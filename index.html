  {id:"ideia",label:"Ideia",icon:"💡",cor:"#8b5cf6"},
  {id:"geral",label:"Geral",icon:"💬",cor:"#6b7280"},
];

async function loadMural(){
  try{MURAL=await sbGet("mural","order=created_at.desc");}catch{MURAL=[];}
}

function renderMural(el){
  const catF=window._muralCat||"";
  const msgs=catF?MURAL.filter(m=>m.categoria===catF):MURAL;

  el.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'+
      '<div style="font-size:18px;font-weight:900">📌 Mural</div>'+
      '<button onclick="abrirNovaMural()" style="padding:8px 14px;background:var(--acc);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);box-shadow:0 3px 10px rgba(155,28,28,.3)">✏️ Escrever</button>'+
    '</div>'+
    '<div class="pills">'+
      '<div class="pill'+(!catF?" on":"")+'" onclick="window._muralCat=\'\';renderMural(document.getElementById(\'conteudo\'))">Tudo</div>'+
      MURAL_CATS.map(c=>{
        const cnt=MURAL.filter(m=>m.categoria===c.id).length;
        return cnt?'<div class="pill'+(catF===c.id?" on":"")+'" onclick="window._muralCat=\''+c.id+'\';renderMural(document.getElementById(\'conteudo\'))">'+c.icon+' '+c.label+' <span style="opacity:.7;font-size:9px">'+cnt+'</span></div>':"";
      }).join("")+
    '</div>'+
    (msgs.length?msgs.map(m=>{
      const cat=MURAL_CATS.find(x=>x.id===m.categoria)||MURAL_CATS[4];
      const reacoes=m.reacoes||{};
      const total=Object.values(reacoes).reduce((s,n)=>s+n,0);
      const ts=m.created_at?new Date(m.created_at).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
      const isMine=m.autor===SESSION?.nome;
      return '<div class="card" style="border-left:3px solid '+cat.cor+';padding:13px 14px">'+
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px">'+
          '<div>'+
            '<span class="tag" style="background:'+cat.cor+'15;color:'+cat.cor+';border-color:'+cat.cor+'30">'+cat.icon+' '+cat.label+'</span> '+
            '<span style="font-size:11px;font-weight:700;margin-left:4px">'+esc(m.autor||"—")+'</span> '+
            '<span style="font-size:10px;color:var(--t3)">'+ts+'</span>'+
            (m.resolvido?' <span class="tag" style="background:#dcfce7;color:#16a34a;border-color:#86efac">✅ Resolvido</span>':"")+'</div>'+
          (isMine||SESSION?.role==="admin"?'<div style="display:flex;gap:4px">'+
            (!m.resolvido?'<button onclick="resolverMural(\''+m.id+'\')" style="padding:3px 7px;background:#dcfce7;border:1px solid #86efac;border-radius:6px;color:#16a34a;font-size:10px;font-weight:700;cursor:pointer">✅</button>':"")+
            '<button onclick="excluirMural(\''+m.id+'\')" style="padding:3px 7px;background:#f8f9fb;border:1px solid var(--border);border-radius:6px;color:var(--t2);font-size:10px;cursor:pointer">🗑️</button>'+
          '</div>':"")+'</div>'+
        '<div style="font-size:14px;color:var(--t1);line-height:1.6;margin-bottom:10px;white-space:pre-wrap">'+esc(m.texto||"")+'</div>'+
        '<div style="display:flex;gap:5px;flex-wrap:wrap">'+
          ["👍","❤️","😂","😮","🔥","✅"].map(e=>{
            const n=reacoes[e]||0;
            return '<button onclick="reagirMural(\''+m.id+'\',\''+e+'\')" style="padding:3px 9px;background:'+(n?"var(--acc-tint)":"var(--bg)")+';border:1px solid '+(n?"var(--acc)":"var(--border)")+';border-radius:20px;font-size:12px;cursor:pointer">'+e+(n?' <span style="font-size:10px;font-weight:700;color:var(--acc)">'+n+'</span>':"")+' </button>';
          }).join("")+
          (total?'<span style="font-size:10px;color:var(--t3);line-height:2.2">'+total+' reação'+(total>1?"ões":"")+'</span>':"")+'</div>'+
      '</div>';
    }).join(""):
      '<div class="vazio"><div class="vazio-icon">📌</div><div class="vazio-titulo">Nenhuma mensagem</div><div class="vazio-sub">Seja o primeiro a escrever</div></div>');
}

function abrirNovaMural(){
  document.getElementById("modal-root").innerHTML=
    '<div class="overlay" onclick="fecharModal()"><div class="sheet" onclick="event.stopPropagation()">'+
    '<div class="sheet-handle"></div>'+
    '<div class="sheet-titulo"><div class="sheet-titulo-txt">Nova mensagem</div><button class="sheet-x" onclick="fecharModal()">✕</button></div>'+
    '<div class="sheet-corpo">'+
      '<label class="flabel">Categoria</label>'+
      '<div style="display:flex;gap:7px;flex-wrap:wrap" id="mural-cats">'+
        MURAL_CATS.map((c,i)=>'<button type="button" class="tipo-btn'+(i===0?" on":"")+'" data-cat="'+c.id+'" onclick="selCatMural(\''+c.id+'\')" style="flex-basis:calc(33% - 5px)"><span>'+c.icon+'</span>'+c.label+'</button>').join("")+
      '</div>'+
      '<input type="hidden" id="mural-cat" value="'+MURAL_CATS[0].id+'"/>'+
      '<label class="flabel">Mensagem *</label>'+
      '<textarea class="finput" id="mural-txt" rows="4" placeholder="Digite sua mensagem..." autofocus></textarea>'+
      '<button class="btn-p" onclick="salvarMural()">📌 Publicar</button>'+
      '<button class="btn-s" onclick="fecharModal()">Cancelar</button>'+
    '</div></div></div>';
  setTimeout(()=>document.getElementById("mural-txt")?.focus(),100);
}

function selCatMural(id){
  document.getElementById("mural-cat").value=id;
  document.querySelectorAll("#mural-cats .tipo-btn").forEach(b=>b.classList.toggle("on",b.dataset.cat===id));
}

async function salvarMural(){
  const txt=(document.getElementById("mural-txt")?.value||"").trim();
  const cat=document.getElementById("mural-cat")?.value||"geral";
  if(!txt){toast("Digite uma mensagem.","erro");return;}
  const btn=document.querySelector(".btn-p");if(btn){btn.disabled=true;btn.textContent="Publicando...";}
  try{
    await sbPost("mural",{texto:txt,categoria:cat,autor:SESSION?.nome||"—",autor_id:SESSION?.id||null,reacoes:{},resolvido:false});
    toast("✅ Publicado!");fecharModal();await loadMural();renderizar();
  }catch(e){
    toast("Erro: "+e.message,"erro");
    if(btn){btn.disabled=false;btn.textContent="📌 Publicar";}
  }
}

async function reagirMural(id,emoji){
  const m=MURAL.find(x=>x.id===id);if(!m)return;
  const r={...(m.reacoes||{})};r[emoji]=(r[emoji]||0)+1;
  try{await sbPatch("mural","id=eq."+id,{reacoes:r});m.reacoes=r;renderizar();}catch{}
}

async function resolverMural(id){
  try{await sbPatch("mural","id=eq."+id,{resolvido:true});const m=MURAL.find(x=>x.id===id);if(m)m.resolvido=true;toast("✅ Resolvido!");renderizar();}catch(e){toast("Erro","erro");}
}

async function excluirMural(id){
  if(!confirm("Excluir esta mensagem?"))return;
  try{await sbDelete("mural","id=eq."+id);MURAL=MURAL.filter(x=>x.id!==id);renderizar();}catch(e){toast("Erro","erro");}
}

function renderUsuarios(el){
  if(SESSION?.role!=="admin"){
    el.innerHTML='<div class="vazio"><div class="vazio-icon">🔒</div><div class="vazio-titulo">Acesso restrito</div><div class="vazio-sub">Apenas administradores</div></div>';
    return;
  }
  const users=DADOS.usuarios||[];
  el.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
      '<div style="font-size:18px;font-weight:900">👤 Usuários</div>'+
      '<button onclick="abrirNovoUsuario()" style="padding:8px 14px;background:var(--acc);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);min-height:40px">+ Novo</button>'+
    '</div>'+
    (users.length?users.map(u=>{
      const roleLabel={admin:"Administrador",recepcao:"Recepção",mecanico:"Mecânico"}[u.role]||u.role;
      const roleColor={admin:"#9b1c1c",recepcao:"#1d4ed8",mecanico:"#7c3aed"}[u.role]||"#6b7280";
      const iniciais=(u.nome||"?").split(" ").map(n=>n[0]).slice(0,2).join("").toUpperCase();
      return '<div class="card" style="padding:14px;display:flex;align-items:center;gap:12px">'+
        '<div style="width:44px;height:44px;border-radius:50%;background:'+roleColor+'18;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:'+roleColor+';flex-shrink:0">'+iniciais+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:14px;font-weight:700">'+esc(u.nome)+'</div>'+
          '<div style="font-size:11px;color:'+roleColor+';font-weight:700">'+roleLabel+' · @'+esc(u.username)+'</div>'+
          '<div style="font-size:10px;color:var(--t3);margin-top:2px">'+(u.ativo!==false?"✅ Ativo":"❌ Inativo")+'</div>'+
        '</div>'+
        '<button onclick="toggleAtivoUsuario(\''+u.id+'\','+u.ativo+')" style="padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);font-size:11px;font-weight:700;cursor:pointer;color:var(--t2);min-height:36px">'+
          (u.ativo!==false?"Desativar":"Ativar")+

    }).join(""):
      '<div class="vazio"><div class="vazio-icon">👤</div><div class="vazio-titulo">Nenhum usuário</div></div>');
}

async function toggleAtivoUsuario(id,ativo){
  const novo=ativo===false;
  try{
    await sbPatch("usuarios","id=eq."+id,{ativo:novo});
    const u=(DADOS.usuarios||[]).find(x=>x.id===id);
    if(u) u.ativo=novo;
    toast(novo?"✅ Usuário ativado":"Usuário desativado");
    renderUsuarios(document.getElementById("conteudo"));
  }catch(e){toast("Erro: "+e.message,"erro");}
}

function abrirNovoUsuario(){
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)";

    '<div style="background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:540px;padding:0 0 calc(20px + env(safe-area-inset-bottom));animation:sobir .25s cubic-bezier(0.34,1.56,0.64,1)" onclick="event.stopPropagation()">'+
    '<div style="width:40px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 10px"></div>'+
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px 14px;border-bottom:1px solid var(--border2);margin-bottom:14px">'+
      '<div style="font-size:17px;font-weight:700">Novo Usuário</div>'+
      '<button onclick="this.closest(\'div[style*=fixed]\').remove()" class="sheet-x">✕</button>'+
    '</div>'+
    '<div style="padding:0 20px">'+
      '<label class="flabel">Nome completo *</label><input class="finput" id="nu-nome" placeholder="Nome do usuário"/>'+
      '<label class="flabel">Login *</label><input class="finput" id="nu-user" placeholder="joao.silva" autocapitalize="none"/>'+
      '<label class="flabel">Senha *</label><input class="finput" id="nu-pass" type="password" placeholder="Mínimo 4 caracteres"/>'+
      '<label class="flabel">Função</label>'+
      '<select class="finput" id="nu-role">'+
        '<option value="mecanico">🔧 Mecânico</option>'+
        '<option value="recepcao">📋 Recepção</option>'+
        '<option value="admin">⚙️ Administrador</option>'+
      '</select>'+
      '<button onclick="salvarNovoUsuario()" style="width:100%;padding:14px;background:var(--acc);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);box-shadow:0 4px 14px rgba(155,28,28,.3);margin-top:16px;min-height:52px">💾 Criar</button>'+
      '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="width:100%;padding:13px;background:#f8f9fb;color:var(--t2);border:1px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:8px;min-height:48px">Cancelar</button>'+
    '</div></div>';
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById("nu-nome")?.focus(),200);
}

async function salvarNovoUsuario(){
  const nome=(document.getElementById("nu-nome")?.value||"").trim();
  const user=(document.getElementById("nu-user")?.value||"").trim().toLowerCase();
  const pass=(document.getElementById("nu-pass")?.value||"").trim();
  if(!nome||!user||!pass){toast("Preencha todos os campos.","erro");return;}
  if(pass.length<4){toast("Senha mínimo 4 caracteres.","erro");return;}
  const btn=Array.from(document.querySelectorAll("button")).find(b=>b.textContent.includes("Criar"));
  if(btn){btn.disabled=true;btn.textContent="Salvando...";}
  try{
    let senha=pass;
    try{const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pass));senha=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");}catch{}
    await sbPost("usuarios",{nome,username:user,senha,role:document.getElementById("nu-role")?.value||"mecanico",ativo:true});
    toast("✅ "+nome+" criado!");
    document.querySelector("div[style*='position:fixed'][style*='z-index:400']")?.remove();
    await carregarDados();renderUsuarios(document.getElementById("conteudo"));
  }catch(e){toast("Erro: "+e.message,"erro");if(btn){btn.disabled=false;btn.textContent="💾 Criar";}}
}

function abrirTrocarSenha(){
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)";
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
  overlay.innerHTML=
    '<div style="background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:540px;padding:0 0 calc(20px + env(safe-area-inset-bottom));animation:sobir .25s cubic-bezier(0.34,1.56,0.64,1)" onclick="event.stopPropagation()">'+
    '<div style="width:40px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 10px"></div>'+
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px 14px;border-bottom:1px solid var(--border2);margin-bottom:14px">'+
      '<div style="font-size:17px;font-weight:700">Trocar Senha</div>'+
      '<button onclick="this.closest(\'div[style*=fixed]\').remove()" class="sheet-x">✕</button>'+
    '</div>'+
    '<div style="padding:0 20px">'+
      '<label class="flabel">Nova senha *</label><input class="finput" id="ts-p1" type="password" placeholder="Mínimo 4 caracteres"/>'+
      '<label class="flabel">Confirmar senha *</label><input class="finput" id="ts-p2" type="password" placeholder="Repita a senha"/>'+
      '<button onclick="salvarNovaSenha()" style="width:100%;padding:14px;background:var(--acc);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);box-shadow:0 4px 14px rgba(155,28,28,.3);margin-top:16px;min-height:52px">🔑 Salvar</button>'+
      '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="width:100%;padding:13px;background:#f8f9fb;color:var(--t2);border:1px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);margin-top:8px;min-height:48px">Cancelar</button>'+
    '</div></div>';
  document.body.appendChild(overlay);
}

async function salvarNovaSenha(){
  const p1=(document.getElementById("ts-p1")?.value||"").trim();
  const p2=(document.getElementById("ts-p2")?.value||"").trim();
  if(!p1||p1.length<4){toast("Senha mínimo 4 caracteres.","erro");return;}
  if(p1!==p2){toast("Senhas não coincidem.","erro");return;}
  if(!SESSION?.id){toast("Sem ID de sessão — faça login novamente.","erro");return;}
  try{
    let senha=p1;
    try{const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p1));senha=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");}catch{}
    await sbPatch("usuarios","id=eq."+SESSION.id,{senha});
    toast("✅ Senha alterada!");
    document.querySelector("div[style*='position:fixed'][style*='z-index:400']")?.remove();
  }catch(e){toast("Erro: "+e.message,"erro");}
}
