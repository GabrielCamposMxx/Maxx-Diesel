async function saveUsuario(id){
  const nome=document.getElementById("u-nome").value.trim();
  const username=document.getElementById("u-user").value.trim().toLowerCase();
  const role=document.getElementById("u-role").value;
  const pass=document.getElementById("u-pass")?.value;
  const fotoEl=document.getElementById("u-foto-data");
  const foto=fotoEl?.value||"";

  if(!nome||!username){showToast("Nome e usuário obrigatórios.","error");return;}
  if(!id&&!pass){showToast("Senha obrigatória para novo usuário.","error");return;}
  const dup=DATA.usuarios.find(u=>u.username===username&&u.id!==id);
  if(dup){showToast("Esse nome de usuário já existe.","error");return;}

  // verifica tamanho da foto — base64 tem ~1.37x o tamanho original
  // Supabase aceita até ~1MB por campo de texto
  if(foto && foto.length > 800000){
    showToast("Foto muito grande. Tente uma imagem menor.","error");
    return;
  }

  const btn=document.getElementById("btn-save-user");
  btn.disabled=true;btn.textContent="⏳ Salvando...";

  // monta body sem foto primeiro
  const body={nome,username,role,ativo:true};
  if(pass) body.senha=await hashSenha(pass).catch(()=>pass);

  // inclui foto no body (string vazia = remover foto, string com data = salvar)
  if(fotoEl) body.foto=foto||null;

  try{
    if(id) await sbPatch("usuarios",`id=eq.${id}`,body);
    else    await sbPost("usuarios",body);
    showToast(id?"✅ Usuário atualizado!":"✅ Usuário criado!");
    closeModal();await loadAll();
    gotoPage("usuarios");
  }catch(e){
    // se falhou por causa da foto, tenta salvar sem ela
    if(foto && e.message?.includes("foto")){
      try{
        const bodySemFoto={...body};delete bodySemFoto.foto;
        if(id) await sbPatch("usuarios",`id=eq.${id}`,bodySemFoto);
        else    await sbPost("usuarios",bodySemFoto);
        showToast("Dados salvos, mas foto não pôde ser salva.","warning");
        closeModal();await loadAll();gotoPage("usuarios");
      }catch(e2){showToast("Erro: "+e2.message,"error");btn.disabled=false;btn.textContent=id?"💾 Salvar":"✅ Criar usuário";}
    } else {
      showToast("Erro: "+e.message,"error");
      btn.disabled=false;btn.textContent=id?"💾 Salvar":"✅ Criar usuário";
    }
  }
}

async function toggleUsuarioAtivo(id,ativo){

}

  const isMes=o=>{const d=new Date(o.data_entrada||o.created_at||"");return d.getMonth()===mesAtual&&d.getFullYear()===anoAtual;};
  const osMes=DATA.os.filter(isMes);
  const osFinalizadas=osMes.filter(o=>["finalizado","entregue"].includes(o.status));
  const faturamento=osFinalizadas.reduce((s,o)=>s+Number(o.valor_total||0),0);
  const ticket=osFinalizadas.length?faturamento/osFinalizadas.length:0;
  // por técnico
  const tecnicos={};
  DATA.os.filter(o=>["finalizado","entregue"].includes(o.status)&&isMes(o)).forEach(o=>{
    const t=o.tecnico||"Sem técnico";
    if(!tecnicos[t]) tecnicos[t]={nome:t,os:0,faturamento:0,tempo:0};
    tecnicos[t].os++;
    tecnicos[t].faturamento+=Number(o.valor_total||0);
    tecnicos[t].tempo+=Number(o.tempo_total_min||0);
  });
  const tecList=Object.values(tecnicos).sort((a,b)=>b.faturamento-a.faturamento);
  // serviços mais frequentes (palavras-chave)
  const freqs={};
  DATA.os.filter(isMes).forEach(o=>{
    const words=(o.descricao||"").toLowerCase().split(/[\s,+/]+/).filter(w=>w.length>4);
    words.forEach(w=>{freqs[w]=(freqs[w]||0)+1;});

  const topServicos=Object.entries(freqs).sort((a,b)=>b[1]-a[1]).slice(0,8);
  // últimos 6 meses faturamento
  const meses=[];

    const d=new Date(anoAtual,mesAtual-i,1);
    const m=d.getMonth();const a=d.getFullYear();

        <div class="stat-val" style="color:var(--accent)">${osMes.length}</div>
        <div class="stat-lbl">OS abertas</div>
        <div class="stat-sub">${DATA.os.filter(o=>!["finalizado","entregue"].includes(o.status)).length} em andamento</div>
      </div>
      <div class="stat" style="border-top-color:var(--warning)">
        <div class="stat-icon">👥</div>

        <div class="stat-lbl">Técnicos ativos</div>
        <div class="stat-sub">Com OS no mês</div>
      </div>
    </div>

    <!-- faturamento 6 meses -->
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">Faturamento — últimos 6 meses</div>
      <div style="display:flex;align-items:flex-end;gap:8px;height:100px;padding:8px 0">
        ${meses.map(m=>`
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">

async function salvarFotoPerfil(input){
  const file=input.files[0];if(!file||!SESSION?.id)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=async()=>{
      const canvas=document.createElement("canvas");
      const max=120,r=Math.min(max/img.width,max/img.height,1);
      canvas.width=Math.round(img.width*r);canvas.height=Math.round(img.height*r);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      const data=canvas.toDataURL("image/jpeg",.65);
      try{
        await sbPatch("usuarios",`id=eq.${SESSION.id}`,{foto:data});
        showToast("✅ Foto atualizada!");
        await loadAll();
        openMeuPerfil();
        // atualiza ícone no topbar
        const btn=document.getElementById("btn-perfil");
        if(btn) btn.style.backgroundImage=`url(${data})`;
      }catch(e){showToast("Erro: "+e.message,"error");}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

async function salvarMeuPerfil(){
  const p1=document.getElementById("perfil-pass1")?.value;
  const p2=document.getElementById("perfil-pass2")?.value;
  if(!p1&&!p2){closeModal();return;}
  if(!p1||p1.length<4){showToast("Senha deve ter pelo menos 4 caracteres.","error");return;}
  if(p1!==p2){showToast("Senhas não coincidem.","error");return;}
  try{
    const h=await hashSenha(p1).catch(()=>p1);
    await sbPatch("usuarios",`id=eq.${SESSION.id}`,{senha:h});
    showToast("✅ Senha alterada!");
    closeModal();
  }catch(e){showToast("Erro: "+e.message,"error");}
}

function selecionarSetor(setorId){
  document.getElementById("f-set").value=setorId;
  document.querySelectorAll(".setor-opt").forEach(btn=>{
    const sel=btn.dataset.setor===setorId;
    const s=SETORES.find(x=>x.id===btn.dataset.setor);
    const cor=s?.cor||"var(--text-muted)";
    btn.style.background=sel?(s?s.cor+"25":"var(--bg-elevated)"):(s?s.cor+"10":"var(--bg-elevated)");
    btn.style.borderColor=sel?(s?s.cor:"var(--accent)"):(s?s.cor+"30":"var(--border)");
    btn.style.transform=sel?"scale(1.04)":"scale(1)";
    btn.style.boxShadow=sel?(s?`0 4px 12px ${s.cor}30`:"none"):"none";
  });
}

function selecionarTipoOS(tipo){
  // atualiza hidden
  const hid=document.getElementById("f-tipo-val");
  if(hid) hid.value=tipo;
  // visual dos botões
  document.querySelectorAll(".tipo-opt").forEach(btn=>{
    const sel=btn.dataset.tipo===tipo;
    btn.style.background=sel?"var(--accent-tint)":"var(--bg-elevated)";
    btn.style.borderColor=sel?"var(--accent)":"var(--border)";
    btn.style.color=sel?"var(--accent)":"var(--text-secondary)";
  });
  // renderiza specs
  const panel=document.getElementById("f-specs-panel");
  if(!panel) return;
  const specs={veiculo:SPECS_VEICULO,pecas:SPECS_PECAS,bico:SPECS_BICO,bomba:SPECS_BOMBA,kit:SPECS_KIT}[tipo]||"";
  panel.innerHTML=specs?`
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:12px 14px">
      <div style="font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">
        Especificações
      </div>
      ${specs}
    </div>`:"";
}

function coletarEspecificacoes(){
  const tipo=document.getElementById("f-tipo-val")?.value||"veiculo";
  const get=id=>document.getElementById(id)?.value||"";
  if(tipo==="veiculo") return {
    modelo:get("spec-modelo"),ano:get("spec-ano"),motor:get("spec-motor"),
    combustivel:get("spec-combustivel"),placa:get("spec-placa"),km:get("f-km"),dtc:get("f-dtc")
  };
  if(tipo==="pecas") return {
    tipo_peca:get("spec-tipo-peca"),quantidade:get("spec-qty"),referencia:get("spec-ref"),
    aplicacao:get("spec-aplicacao"),marca:get("spec-marca"),condicao:get("spec-condicao")
  };
  if(tipo==="bico") return {
    tipo_bico:get("spec-tipo-bico"),quantidade:get("spec-qty"),referencia:get("spec-ref"),
    aplicacao:get("spec-aplicacao"),pressao:get("spec-pressao"),marca:get("spec-marca"),
    problema:get("spec-problema")
  };
  if(tipo==="kit") return {
    aplicacao:get("spec-aplicacao"),pressao:get("spec-pressao"),
    marca:get("spec-marca"),problema:get("spec-problema"),
    bico:{
      tipo:get("spec-tipo-bico"),quantidade:get("spec-qty-bico"),
      referencia:get("spec-ref-bico")
    },
    bomba:{
      tipo:get("spec-tipo-bomba"),cilindros:get("spec-cil-bomba"),
      referencia:get("spec-ref-bomba")
    }
  };
  if(tipo==="bomba") return {
    tipo_bomba:get("spec-tipo-bomba"),cilindros:get("spec-cil-bomba"),referencia:get("spec-ref"),
    aplicacao:get("spec-aplicacao"),pressao:get("spec-pressao"),marca:get("spec-marca"),
    problema:get("spec-problema")
  };
  return {};
}

function openRetornoModal(osId){
  const o=DATA.os.find(x=>x.id===osId);if(!o)return;

  // busca OS anteriores do mesmo cliente/veículo já entregues
  const osAnteriores=DATA.os.filter(x=>
    x.id!==osId&&
    (x.cliente_id===o.cliente_id||(vei&&x.veiculo_id===o.veiculo_id))&&
    x.status==="entregue"

  document.getElementById("modal-root").innerHTML=`
    <div class="overlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:460px">
        <div class="modal-hd">
          <div>
            <div class="modal-title">🔄 Registrar Retorno</div>
            <div class="modal-sub">${esc(cli?.nome||"—")}${vei?.placa?" · "+esc(vei.placa):""}</div>
          </div>
          <button class="modal-x" onclick="closeModal()">✕</button>
        </div>

        <!-- Selecionar OS de origem -->
        <div style="margin-bottom:14px">
          <div class="flabel">OS de origem (serviço que está retornando)</div>
          ${osAnteriores.length?`
            <div style="display:flex;flex-direction:column;gap:6px">
              ${osAnteriores.slice(0,5).map(os2=>{
                const diasDesde=os2.data_entrega?Math.floor((Date.now()-new Date(os2.data_entrega))/(1000*60*60*24)):null;
                const naGarantia=diasDesde!==null&&diasDesde<=90;
                return `<label style="cursor:pointer">
                  <input type="radio" name="os-origem" value="${os2.id}" style="display:none" onchange="verificarGarantiaRetorno('${os2.id}')"/>
                  <div onclick="this.previousElementSibling.checked=true;verificarGarantiaRetorno('${os2.id}');document.querySelectorAll('.os-origem-card').forEach(e=>e.classList.remove('sel-origem'));this.classList.add('sel-origem')"

                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">

                  </div>

              }).join("")}

function verificarGarantiaRetorno(osOrigId){
  document.getElementById("retorno-origem-id").value=osOrigId;
  const osOrig=DATA.os.find(x=>x.id===osOrigId);
  const el=document.getElementById("garantia-status");
  if(!osOrig||!el) return;
  const dataRef=osOrig.data_entrega||osOrig.created_at?.split("T")[0];
  if(!dataRef){el.style.display="none";return;}
  const dias=Math.floor((Date.now()-new Date(dataRef))/(1000*60*60*24));
  const naGarantia=dias<=90;
  el.style.display="block";
  el.innerHTML=`
    <div style="padding:12px 14px;border-radius:10px;background:${naGarantia?"#f0fdf4":"#fff7ed"};border:1px solid ${naGarantia?"#86efac":"#fcd34d"}">
      <div style="font-size:13px;font-weight:700;color:${naGarantia?"#16a34a":"#d97706"};margin-bottom:4px">
        ${naGarantia?"🛡️ Dentro da garantia":"⏰ Fora do prazo de garantia"}
      </div>
      <div style="font-size:12px;color:${naGarantia?"#15803d":"#92400e"}">
        ${naGarantia
          ?`Serviço entregue há <strong>${dias} dias</strong>. Garantia válida por 90 dias — <strong>${90-dias} dias restantes</strong>.`
          :`Serviço entregue há <strong>${dias} dias</strong>. Prazo de garantia (90 dias) expirado há ${dias-90} dias.`
        }
      </div>
    </div>`;
  // auto-seleciona responsabilidade
  if(naGarantia){
    document.getElementById("resp-garantia").checked=true;
    atualizarRespVisual();
  }
}

function atualizarRespVisual(){
  const sel=document.querySelector("input[name='retorno-resp']:checked")?.value;
  document.querySelectorAll(".resp-opt").forEach((el,i)=>{
    const vals=["garantia","novo_problema","uso_indevido"];
    const isS=vals[i]===sel;
    el.style.borderColor=isS?"var(--accent)":"var(--border)";
    el.style.background=isS?"var(--accent-tint)":"var(--bg-elevated)";
    el.style.color=isS?"var(--accent)":"var(--text-secondary)";
  });
}

async function salvarRetorno(osId){
  const motivo=document.getElementById("retorno-motivo").value.trim();
  const origemId=document.getElementById("retorno-origem-id").value;
  const resp=document.querySelector("input[name='retorno-resp']:checked")?.value||"garantia";
  if(!motivo){showToast("Descreva o motivo do retorno.","error");return;}
  const o=DATA.os.find(x=>x.id===osId);if(!o)return;
  const hist=[...(Array.isArray(o.historico)?o.historico:[]),
    {data:nowStr(),acao:`🔄 Retorno registrado — ${resp==="garantia"?"Em garantia":resp==="novo_problema"?"Novo problema":"Uso indevido"}. Motivo: ${motivo}`,user:SESSION?.nome||""}];
  try{
    await sbPatch("ordens_servico",`id=eq.${osId}`,{
      status:"retorno",
      os_origem_id:origemId||null,
      retorno_motivo:motivo,
      retorno_responsabilidade:resp,
      retorno_data:today(),
      historico:hist
    });
    showToast("🔄 Retorno registrado!");
    closeModal();await loadAll();
  }catch(e){showToast("Erro: "+e.message,"error");}
}

function confirmarExcluirOS(id){
  const o=DATA.os.find(x=>x.id===id);if(!o)return;

async function excluirOS(id){

    gotoPage("os");

        const isMine=m.autor===SESSION?.nome||m.autor_id===SESSION?.id;

              <span style="font-size:11px;font-weight:700;color:var(--text-primary)">${esc(m.autor||"—")}</span>
              <span style="font-size:10px;color:var(--text-muted)">${ts}</span>
              ${m.resolvido?`<span style="background:#dcfce7;color:#16a34a;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">✅ Resolvido</span>`:""}

function openNovaMural(){
  document.getElementById("modal-root").innerHTML=`
    <div class="overlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:460px">
        <div class="modal-hd">
          <div><div class="modal-title">📌 Nova mensagem</div></div>
          <button class="modal-x" onclick="closeModal()">✕</button>
        </div>
        <div style="margin-bottom:12px">
          <div class="flabel">Categoria</div>
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            ${MURAL_CATS.map((cat,i)=>`
              <button type="button" class="mural-cat-btn" data-cat="${cat.id}"
                onclick="selecionarCatMural('${cat.id}')"
                style="padding:8px 12px;border:1.5px solid ${i===0?cat.cor:"var(--border)"};
                background:${i===0?cat.cor+"15":"var(--bg-elevated)"};color:${i===0?cat.cor:"var(--text-secondary)"};
                border-radius:10px;font-size:11px;font-weight:700;cursor:pointer">
                ${cat.icon} ${cat.label}
              </button>`).join("")}
          </div>
          <input type="hidden" id="mural-cat" value="${MURAL_CATS[0].id}"/>
        </div>
        <div style="margin-bottom:16px">
          <div class="flabel">Mensagem *</div>
          <textarea id="mural-texto" rows="4" placeholder="Digite sua mensagem, aviso ou pedido..." autofocus style="font-size:14px"></textarea>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-red" style="flex:2" onclick="salvarMural()">📌 Publicar</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById("mural-texto")?.focus(),100);
}

function selecionarCatMural(catId){
  document.getElementById("mural-cat").value=catId;
  document.querySelectorAll(".mural-cat-btn").forEach(btn=>{
    const cat=MURAL_CATS.find(x=>x.id===btn.dataset.cat);
    const sel=btn.dataset.cat===catId;
    btn.style.borderColor=sel?cat.cor:"var(--border)";
    btn.style.background=sel?cat.cor+"15":"var(--bg-elevated)";
    btn.style.color=sel?cat.cor:"var(--text-secondary)";
  });
}

async function salvarMural(){
  const texto=document.getElementById("mural-texto").value.trim();
  const cat=document.getElementById("mural-cat").value;
  if(!texto){showToast("Digite uma mensagem.","error");return;}
  try{
    await sbPost("mural",{
      texto,categoria:cat,
      autor:SESSION?.nome||"Usuário",
      autor_id:SESSION?.id||null,
      reacoes:{},resolvido:false
    });
    showToast("✅ Publicado!");
    closeModal();await loadMural();
    renderMural(document.getElementById("content"));
  }catch(e){showToast("Erro: "+e.message,"error");}
}

async function reagirMural(id,emoji){
  const m=MURAL_DATA.find(x=>x.id===id);if(!m)return;
  const reacoes={...(m.reacoes||{})};
  reacoes[emoji]=(reacoes[emoji]||0)+1;
  try{
    await sbPatch("mural",`id=eq.${id}`,{reacoes});
    m.reacoes=reacoes;
    renderMural(document.getElementById("content"));
  }catch(e){showToast("Erro: "+e.message,"error");}
}

async function resolverMural(id){
  try{
    await sbPatch("mural",`id=eq.${id}`,{resolvido:true});
    const m=MURAL_DATA.find(x=>x.id===id);if(m) m.resolvido=true;
    showToast("✅ Marcado como resolvido!");
    renderMural(document.getElementById("content"));
  }catch(e){showToast("Erro: "+e.message,"error");}
}

async function excluirMural(id){
  if(!confirm("Excluir esta mensagem?"))return;
  try{
    await sbDelete("mural",`id=eq.${id}`);
    MURAL_DATA=MURAL_DATA.filter(x=>x.id!==id);
    showToast("Mensagem excluída.");
    renderMural(document.getElementById("content"));
  }catch(e){showToast("Erro: "+e.message,"error");}
}

function _labFoto(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      const r  = Math.min(800/img.width, 800/img.height, 1);
      cv.width  = Math.round(img.width*r);
      cv.height = Math.round(img.height*r);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      _wizData.lab_fotos.push(cv.toDataURL("image/jpeg",0.75));
      _renderWizLab();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function _labCapturaCli(){
  // Captura dados do cliente novo inline antes de avançar
  const nome = document.getElementById("nc-nome")?.value?.trim();
  if(nome && !_wizData.cli_id){
    _wizData._nc_nome = nome;
    _wizData._nc_tel  = document.getElementById("nc-tel")?.value||"";
    _wizData._nc_wpp  = document.getElementById("nc-wpp")?.value||"";
    _wizData.cli_nome = nome;
  }
}


function _labNext1(){
  if(!_wizData.lab_problema?.trim()){
    showToast("Descreva o problema ou sintoma.","error"); return;
  }
  _wizStep = 1; _renderWizLab();
}

async function _labSalvar(){
  const btn = document.getElementById("btn-wiz-save");
  const errDiv = document.getElementById("wiz-erro");
  if(btn){ btn.disabled=true; btn.textContent="⏳ Abrindo..."; }
  try{
    // Cliente — usa dados armazenados (getElementById não existe no step de confirmação)
    let cliId = _wizData.cli_id||null;
    if(!cliId && _wizData._nc_nome){
      const res = await sbPost("clientes",{
        nome:     _wizData._nc_nome,
        telefone: _wizData._nc_tel||"",
        whatsapp: _wizData._nc_wpp||"",
      });
      cliId = (Array.isArray(res)?res[0]:res)?.id;
    }

    const tipo = LAB_TIPOS.find(t=>t.id===_wizData.lab_tipo)||LAB_TIPOS[0];
    const total  = _wizData.orcamento_items.reduce((s,i)=>s+i.qtd*i.valor,0);
    const valorMO= _wizData.orcamento_items.filter(i=>i.tipo==="mo").reduce((s,i)=>s+i.qtd*i.valor,0);
    const status = _wizData.aprovacao==="presencial"?"em_execucao":
                   _wizData.aprovacao==="link"?"aguardando_aprovacao":"recebido";

    const especificacoes = {
      lab_tipo:       _wizData.lab_tipo,
      referencia:     _wizData.lab_referencia,
      quantidade:     _wizData.lab_quantidade,
      aplicacao:      _wizData.lab_aplicacao,
      marca:          _wizData.lab_marca,
      aprovacao:      _wizData.aprovacao,
      link_aprovacao: _wizData.link_aprovacao||null,
      ..._wizData.lab_specs,
    };

    // Fotos: base64 NÃO vai direto no POST (excede 1MB → "Failed to fetch")
    // Salva só metadados por agora; as imagens ficam na memória
    const fotos = _wizData.lab_fotos.map((_,i)=>({url:"", tag:`lab_${i}`, data:nowStr()})).filter(()=>false); // array vazio

    const cotacao_itens = _wizData.orcamento_items.map(i=>({
      descricao:i.desc, quantidade:i.qtd, valor_unitario:i.valor, tipo:i.tipo, produto_id:i.produto_id||null
    }));

    const historico = [{data:nowStr(),acao:`OS laboratório aberta — ${tipo.label}`,user:SESSION?.nome||""}];
    if(_wizData.aprovacao==="presencial") historico.push({data:nowStr(),acao:"Orçamento aprovado presencialmente",user:SESSION?.nome||""});

    const descricao = `${tipo.icon} ${tipo.label}${_wizData.lab_referencia?" · "+_wizData.lab_referencia:""}${_wizData.lab_aplicacao?" — "+_wizData.lab_aplicacao:""}`;

    const osRes = await sbPost("ordens_servico",{
      cliente_id:    cliId,
      setor_id:      _wizData.setor||tipo.setor,
      tipo_servico:  _wizData.lab_tipo,
      descricao:     _wizData.lab_problema||descricao,
      prioridade:    _wizData.prioridade||"media",
      status,
      valor_mo:      valorMO,
      valor_total:   total,
      especificacoes,
      historico,
      fotos,
      cotacao_itens,
      data_entrada:  today(),
      tecnico:       SESSION?.nome||"",
    });
    const osId = (Array.isArray(osRes)?osRes[0]:osRes)?.id;

    if(_wizData.aprovacao==="presencial" && _wizData.orcamento_items.length>0 && osId){
      for(const item of _wizData.orcamento_items){
        await sbPost("os_itens",{
          os_id:osId, produto_id:item.produto_id||null,
          descricao:item.desc, quantidade:item.qtd,
          valor_unitario:item.valor, valor_total:item.qtd*item.valor,
        }).catch(()=>{});
      }
    }

    haptic(30);
    showToast(`🔬 OS Laboratório aberta!`);

    // Faz upload das fotos para Storage em background (não bloqueia)
    if(osId && _wizData.lab_fotos.length > 0){
      _uploadFotosLab(osId, _wizData.lab_fotos).catch(()=>{});
    }

    closeModal();
    await loadAll();

  }catch(e){
    if(errDiv){ errDiv.textContent="❌ "+e.message; errDiv.style.display="block"; }
    if(btn){ btn.disabled=false; btn.textContent="🔬 ABRIR OS LAB"; }
  }
}

    _wizData._nc_nome = ncNome;
    _wizData._nc_tel  = document.getElementById("nc-tel")?.value||"";

async function supabase_buscaVeiculo(placa){
  const { data } = await sbGet("veiculos","placa=ilike."+placa+"&select=*,clientes(*)&limit=1");
  if(data && data[0]){
    const vei = data[0];
    _wizData.veiculo_id = vei.id;
    _wizData.modelo     = _wizData.modelo || vei.modelo;
    _wizData.ano        = _wizData.ano    || String(vei.ano||"");
    _wizData.motor      = _wizData.motor  || (vei.motor||"");
    if(vei.clientes && !_wizData.cli_id){
      _wizData.cli_id   = vei.clientes.id;
      _wizData.cli_nome = vei.clientes.nome;
      _wizData.cli_tel  = vei.clientes.telefone||"";
    }
    showToast(`🚗 Veículo encontrado: ${vei.modelo}`);
  }
}

let _wizFotoChecklistId = null;
function _wizFotoChecklist(id){
  _wizFotoChecklistId = id;
  document.getElementById("checklist-foto-input")?.click();
}
function _wizProcessFotoChecklist(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      const r  = Math.min(600/img.width, 600/img.height, 1);
      cv.width  = Math.round(img.width*r);
      cv.height = Math.round(img.height*r);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      const data = cv.toDataURL("image/jpeg", 0.72);
      if(!_wizData.checklist_fotos[_wizFotoChecklistId]) _wizData.checklist_fotos[_wizFotoChecklistId] = [];
      _wizData.checklist_fotos[_wizFotoChecklistId].push(data);
      _wizData.checklist[_wizFotoChecklistId] = "avariado"; // marca como avaria automaticamente
      _renderWiz();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function _wizCheckinFoto(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      const r  = Math.min(800/img.width, 800/img.height, 1);
      cv.width  = Math.round(img.width*r);
      cv.height = Math.round(img.height*r);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      _wizData.checkin_data = cv.toDataURL("image/jpeg", 0.75);
      _renderWiz();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── OCR DE PLACA ──────────────────────────────────────
function _wizOCR(){
  document.getElementById("ocr-input")?.click();
}

function _wizProcessOCR(input){
  const file = input.files[0]; if(!file) return;
  const status = document.getElementById("ocr-status");
  if(status) { status.textContent = "⏳ Lendo placa..."; status.style.color="var(--text-muted)"; }

  // OCR via Tesseract CDN (carregado sob demanda)
  _loadTesseract().then(async Tesseract => {
    try{
      const { data: { text } } = await Tesseract.recognize(file, "por", {
        tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
      });
      const clean = text.replace(/[^A-Z0-9]/gi,"").toUpperCase();
      const match = clean.match(/[A-Z]{3}[0-9]{1}[A-Z0-9]{1}[0-9]{2}|[A-Z]{3}[0-9]{4}/);
      const placa = match ? match[0] : clean.slice(0,7);
      if(placa.length >= 6){
        _wizData.placa = placa;
        const el = document.getElementById("wiz-placa");
        if(el){ el.value = placa.slice(0,3)+"-"+placa.slice(3); }
        if(status){ status.textContent = `✅ Placa lida: ${placa}`; status.style.color="var(--success)"; }
        // Busca veículo automaticamente
        supabase_buscaVeiculo(placa);
      } else {
        if(status){ status.textContent = "⚠️ Não foi possível ler — preencha manualmente"; status.style.color="var(--warning)"; }
      }
    }catch(e){
      if(status){ status.textContent = "❌ Falha no OCR — preencha manualmente"; status.style.color="var(--danger)"; }
    }
  }).catch(()=>{
    if(status){ status.textContent = "❌ Tesseract não carregou — preencha manualmente"; status.style.color="var(--danger)"; }
  });
}

function _loadTesseract(){
  return new Promise((resolve, reject) => {
    if(window.Tesseract){ resolve(window.Tesseract); return; }
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload  = () => resolve(window.Tesseract);
    s.onerror = () => reject(new Error("Falha ao carregar Tesseract"));
    document.head.appendChild(s);
  });
}

// ── SALVAR OS ─────────────────────────────────────────
async function _wizSalvar(){
  const btn = document.getElementById("btn-wiz-save");
  const errDiv = document.getElementById("wiz-erro");
  if(btn){ btn.disabled=true; btn.textContent="⏳ Abrindo OS..."; }

  try{
    // 1. Cliente — usa dados armazenados em _wizData (getElementById não existe no Step 4)
    let cliId = _wizData.cli_id||null;
    if(!cliId && _wizData._nc_nome){
      const res = await sbPost("clientes",{
        nome:     _wizData._nc_nome,
        telefone: _wizData._nc_tel||"",
        whatsapp: _wizData._nc_wpp||"",
      });
      cliId = (Array.isArray(res)?res[0]:res)?.id;
      _wizData.cli_id   = cliId;
      _wizData.cli_nome = _wizData._nc_nome;
    }

    // 2. Veículo (upsert por placa)
    let veiId = _wizData.veiculo_id||null;
    if(_wizData.placa && !veiId){
      try{
        const res = await sbPost("veiculos",{
          placa:      _wizData.placa.toUpperCase(),
          modelo:     _wizData.modelo,
          ano:        _wizData.ano ? parseInt(_wizData.ano) : null,
          motor:      _wizData.motor||"",
          cliente_id: cliId,
        });
        veiId = (Array.isArray(res)?res[0]:res)?.id;
      }catch{
        // Provavelmente já existe — busca
        const rows = await sbGet("veiculos","placa=ilike."+_wizData.placa+"&limit=1");
        veiId = rows?.[0]?.id||null;
      }
    }

    // 3. Monta especificacoes — SEM fotos base64 (evita payload > 1MB)
    const checklist_entrada = CHECKLIST_ITENS.map(i=>({
      id:    i.id,
      label: i.label,
      valor: _wizData.checklist[i.id]||"nao_verif",
      tem_foto: (_wizData.checklist_fotos[i.id]||[]).length > 0, // só flag, sem base64
    }));
    const especificacoes = {
      placa:             _wizData.placa,
      modelo:            _wizData.modelo,
      ano:               _wizData.ano,
      motor:             _wizData.motor,
      horimetro:         _wizData.horimetro,
      checklist_entrada,
      dtc_codigos:       _wizData.dtcs,
      aprovacao_status:  _wizData.aprovacao,
      link_aprovacao:    _wizData.link_aprovacao||null,
    };

    // Fotos: base64 NÃO vai direto no POST (corpo >1MB → "Failed to fetch")
    // Manda array vazio agora, faz upload para Storage depois
    const fotos = [];

    // 5. Cotação / status
    const cotacao_itens = _wizData.orcamento_items.map(i=>({
      descricao:      i.desc,
      quantidade:     i.qtd,
      valor_unitario: i.valor,
      tipo:           i.tipo,
      produto_id:     i.produto_id||null,
    }));
    const valorTotal  = _wizData.orcamento_items.reduce((s,i)=>s+i.qtd*i.valor,0);
    const valorMO     = _wizData.orcamento_items.filter(i=>i.tipo==="mo").reduce((s,i)=>s+i.qtd*i.valor,0);
    const status      = _wizData.aprovacao==="presencial"?"em_execucao":
                        _wizData.aprovacao==="link"?"aguardando_aprovacao":"recebido";

    const historico = [{data:nowStr(),acao:`OS aberta`,user:SESSION?.nome||""}];
    if(_wizData.dtcs.length>0) historico.push({data:nowStr(),acao:`DTCs: ${_wizData.dtcs.join(", ")}`,user:SESSION?.nome||""});
    if(_wizData.aprovacao==="presencial") historico.push({data:nowStr(),acao:"Orçamento aprovado presencialmente",user:SESSION?.nome||""});
    if(_wizData.aprovacao==="link")       historico.push({data:nowStr(),acao:"Link de aprovação enviado ao cliente",user:SESSION?.nome||""});

    // 6. Salva OS
    const os = await sbPost("ordens_servico",{
      cliente_id:    cliId,
      veiculo_id:    veiId,
      setor_id:      _wizData.setor||null,
      tipo_servico:  _wizData.tipo||"veiculo",
      descricao:     _wizData.descricao,
      diagnostico:   _wizData.dtcs.length>0?`DTCs: ${_wizData.dtcs.join(", ")}`:null,
      cod_falha:     _wizData.dtcs[0]||null,
      prioridade:    _wizData.prioridade||"media",
      status,
      km_entrada:    _wizData.horimetro?parseInt(_wizData.horimetro):null,
      valor_mo:      valorMO,
      valor_total:   valorTotal,
      especificacoes,
      historico,
      fotos,
      cotacao_itens,
      data_entrada:  today(),
      tecnico:       SESSION?.nome||"",
    });
    const osId = (Array.isArray(os)?os[0]:os)?.id;

    // 7. Se aprovado, lança os_itens
    if(_wizData.aprovacao==="presencial" && _wizData.orcamento_items.length>0 && osId){
      for(const item of _wizData.orcamento_items){
        await sbPost("os_itens",{
          os_id:          osId,
          produto_id:     item.produto_id||null,
          descricao:      item.desc,
          quantidade:     item.qtd,
          valor_unitario: item.valor,
          valor_total:    item.qtd*item.valor,
        }).catch(()=>{});
      }
    }

    haptic(30);
    showToast("⚡ OS aberta com sucesso!");

    // Upload das fotos em background (não bloqueia o fluxo)
    if(osId){
      const todasFotos = [];
      if(_wizData.checkin_data) todasFotos.push({data:_wizData.checkin_data, tag:"entrada"});
      for(const [id, flist] of Object.entries(_wizData.checklist_fotos)){
        for(const url of flist) todasFotos.push({data:url, tag:"checklist_"+id});
      }
      if(todasFotos.length > 0){
        _uploadFotosVeiculo(osId, todasFotos).catch(()=>{});
      }
    }

    closeModal();
    await loadAll();

  }catch(e){
    if(errDiv){ errDiv.textContent="❌ "+e.message; errDiv.style.display="block"; }
    if(btn){ btn.disabled=false; btn.textContent="🔧 ABRIR OS"; }
  }
}

// UPLOAD DE FOTOS EM BACKGROUND (base64 → Storage)
// ══════════════════════════════════════════════════

async function _base64ToBlob(dataUrl){
  const res = await fetch(dataUrl);
  return res.blob();
}

async function _uploadFotoStorage(blob, path){
  const res = await fetch(`${SB_URL}/storage/v1/object/os-fotos/${path}`,{
    method:"POST",
    headers:{
      "apikey":     SB_KEY,
      "Authorization": `Bearer ${SB_KEY}`,
      "Content-Type":  "image/jpeg",
      "x-upsert":      "true",
    },
    body: blob,
  });
  if(!res.ok) throw new Error(`Storage error ${res.status}`);
  return `${SB_URL}/storage/v1/object/public/os-fotos/${path}`;
}

async function _uploadFotosLab(osId, fotosBase64){
  const urls = [];
  for(let i=0; i<fotosBase64.length; i++){
    try{
      const blob = await _base64ToBlob(fotosBase64[i]);
      const path = `${osId}/lab_${Date.now()}_${i}.jpg`;
      const url  = await _uploadFotoStorage(blob, path);
      urls.push({url, tag:`lab_${i}`, data:nowStr()});
    }catch(e){ console.warn("Foto lab upload falhou:", e.message); }
  }
  if(urls.length > 0){
    const o = DATA.os.find(x=>x.id===osId);
    const existentes = Array.isArray(o?.fotos)?o.fotos:[];
    await sbPatch("ordens_servico",`id=eq.${osId}`,{fotos:[...existentes,...urls]}).catch(()=>{});
    if(o) o.fotos=[...existentes,...urls];
  }
}

async function _uploadFotosVeiculo(osId, fotosComTag){
  // fotosComTag: [{data: dataUrl, tag: "entrada"|"checklist_xxx"}]
  const urls = [];
  for(let i=0; i<fotosComTag.length; i++){
    try{
      const {data, tag} = fotosComTag[i];
      const blob = await _base64ToBlob(data);
      const path = `${osId}/${tag}_${Date.now()}_${i}.jpg`;
      const url  = await _uploadFotoStorage(blob, path);
      urls.push({url, tag, data:nowStr()});
    }catch(e){ console.warn("Foto veículo upload falhou:", e.message); }
  }
  if(urls.length > 0){
    const o = DATA.os.find(x=>x.id===osId);
    const existentes = Array.isArray(o?.fotos)?o.fotos:[];
    await sbPatch("ordens_servico",`id=eq.${osId}`,{fotos:[...existentes,...urls]}).catch(()=>{});
    if(o) o.fotos=[...existentes,...urls];
  }
}

let _entregaFoto = null;
function _entregaFotoCaptura(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      const r  = Math.min(800/img.width, 800/img.height, 1);
      cv.width  = Math.round(img.width*r);
      cv.height = Math.round(img.height*r);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      _entregaFoto = cv.toDataURL("image/jpeg",0.75);
      // Atualiza preview sem fechar modal
      const area = document.getElementById("saida-foto-area");
      if(area){ area.style.height="160px"; area.innerHTML=`<img src="${_entregaFoto}" style="width:100%;height:100%;object-fit:cover"/>`; }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

    specs.obs_entrega     = obs;

    await sbPatch("ordens_servico",`id=eq.${osId}`,{
      status:        "entregue",
      especificacoes: specs,
      historico:     hist,
      fotos,
    });

    // Lança no financeiro
    if(o.valor_total>0){
      await sbPost("lancamentos",{
        tipo:       "receita",
        descricao:  `OS ${numOS(o.numero)} — ${DATA.clientes.find(c=>c.id===o.cliente_id)?.nome||""}`,
        valor:      o.valor_total,
        categoria:  "Serviços",
        data:       today(),
        status:     "pago",
        forma:      pgto||null,
        os_id:      osId,
      }).catch(()=>{});
    }

    haptic([30,50,30]);
    showToast("🎉 Veículo entregue! OS finalizada.");
    _entregaFoto = null;
    closeModal();
    await loadAll();

  }catch(e){
    if(errDiv){ errDiv.textContent="❌ "+e.message; errDiv.style.display="block"; }
    if(btn){ btn.disabled=false; btn.textContent="✅ CONFIRMAR ENTREGA"; }
  }
}

function osTab(e,id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

}

// ciclo de estados ao clicar: pendente → ok → avaria → na → pendente
const CHK_CYCLE=["pendente","ok","avaria","na"];
let _chkState={};

function toggleChkItem(osId,itemId,el){
  if(!_chkState[osId]) _chkState[osId]={};
  const o=DATA.os.find(x=>x.id===osId);
  const current=(_chkState[osId][itemId])||(o?.checklist_vistoria?.[itemId])||"pendente";
  const next=CHK_CYCLE[(CHK_CYCLE.indexOf(current)+1)%CHK_CYCLE.length];
  _chkState[osId][itemId]=next;
  // atualiza visual imediato sem salvar no banco ainda
  el.className=`chk-item${next!=="pendente"?" "+next:""}`;
  el.querySelector(".chk-item-estado").textContent=
    next==="ok"?"✅ OK":next==="avaria"?"⚠️ Avaria":next==="na"?"— N/A":"· Verificar";
}

// ── CANVAS DE ASSINATURA ──────────────────────────────────
let _sigDrawing=false;let _sigCtx=null;

function initSigCanvas(){
  const canvas=document.getElementById("sig-canvas");
  if(!canvas||_sigCtx) return;
  _sigCtx=canvas.getContext("2d");
  _sigCtx.strokeStyle="#f9fafb";
  _sigCtx.lineWidth=2.5;
  _sigCtx.lineCap="round";
  _sigCtx.lineJoin="round";

  const pos=(e)=>{
    const r=canvas.getBoundingClientRect();
    const scaleX=canvas.width/r.width;
    const scaleY=canvas.height/r.height;
    const src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-r.left)*scaleX,y:(src.clientY-r.top)*scaleY};
  };
  const start=e=>{e.preventDefault();_sigDrawing=true;const p=pos(e);_sigCtx.beginPath();_sigCtx.moveTo(p.x,p.y);canvas.classList.add("signed");};
  const move=e=>{e.preventDefault();if(!_sigDrawing)return;const p=pos(e);_sigCtx.lineTo(p.x,p.y);_sigCtx.stroke();};
  const end=e=>{e.preventDefault();_sigDrawing=false;};

  canvas.addEventListener("mousedown",start);
  canvas.addEventListener("mousemove",move);
  canvas.addEventListener("mouseup",end);
  canvas.addEventListener("mouseleave",end);
  canvas.addEventListener("touchstart",start,{passive:false});
  canvas.addEventListener("touchmove",move,{passive:false});
  canvas.addEventListener("touchend",end,{passive:false});
}

function clearSig(){
  const canvas=document.getElementById("sig-canvas");
  if(!canvas) return;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  canvas.classList.remove("signed");
  _sigCtx=null;
}

function isSigEmpty(){
  const canvas=document.getElementById("sig-canvas");
  if(!canvas) return true;
  const ctx=canvas.getContext("2d");
  const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  return !data.some(v=>v!==0);
}

async function saveChecklist(osId){
  const o=DATA.os.find(x=>x.id===osId);if(!o)return;
  // merge estado local com estado salvo
  const base=o.checklist_vistoria||{};
  const local=_chkState[osId]||{};
  const merged={...base,...local};
  // remove pendentes para não poluir
  Object.keys(merged).forEach(k=>{if(merged[k]==="pendente")delete merged[k];});

  let assinaturaUrl=null;
  if(!isSigEmpty()){
    const canvas=document.getElementById("sig-canvas");
    assinaturaUrl=canvas.toDataURL("image/png");
  }
  if(!assinaturaUrl&&!o.assinatura_cliente){
    if(!confirm("Salvar vistoria sem assinatura do cliente?"))return;
  }

  const avDesc=document.getElementById("chk-avaria-desc")?.value||o.checklist_avarias||"";

  try{
    const patch={checklist_vistoria:merged,checklist_avarias:avDesc};
    if(assinaturaUrl){
      patch.assinatura_cliente=assinaturaUrl;
      patch.checklist_assinado_em=nowStr();
    }
    await sbPatch("ordens_servico",`id=eq.${osId}`,patch);
    _chkState[osId]={};
    _sigCtx=null;
    showToast("✅ Vistoria salva com sucesso!");
    await loadAll();
    openOSDetail(osId);
    setTimeout(()=>{
      const tabBtn=document.querySelector(".tab:nth-child(2)");
      if(tabBtn){tabBtn.click();}
    },80);
  }catch(e){showToast("Erro: "+e.message,"error");}
}

async function addCotacaoItem(osId){
  const desc=document.getElementById("cot-desc")?.value.trim();
  const qtd=Number(document.getElementById("cot-qtd")?.value||1);
  const obs=document.getElementById("cot-obs")?.value.trim()||"";
  if(!desc){showToast("Informe a descrição da peça.","error");return;}

  const lista=[...(o.cotacao_itens||[]),{
    descricao:desc, quantidade:qtd, obs, valor_unitario:0,
    solicitado_por:SESSION?.nome||"", criado_em:nowStr()

  try{
    await sbPatch("ordens_servico",`id=eq.${osId}`,{cotacao_itens:lista});

async function aprovarCotacao(osId){
  if(!confirm("Aprovar cotação? Os itens serão lançados como peças na OS e o estoque será descontado."))return;
  const o=DATA.os.find(x=>x.id===osId);
  const lista=o.cotacao_itens||[];
  if(!lista.length){showToast("Nenhum item na cotação.","error");return;}

  try{
    let valorExtra=0;
    for(const it of lista){
      const totalItem=Number(it.valor_unitario||0)*Number(it.quantidade||1);
      await sbPost("os_itens",{
        os_id:osId, descricao:it.descricao,
        quantidade:it.quantidade, valor_unitario:it.valor_unitario,
        valor_total:totalItem, produto_id:null
      });
      valorExtra+=totalItem;
    }
    // atualiza valor_total da OS
    const novoTotal=Number(o.valor_total||0)+valorExtra;
    // limpa a cotação e salva histórico
    const hist=[...(Array.isArray(o.historico)?o.historico:[]),{
      data:nowStr(),acao:`✅ Cotação aprovada — ${lista.length} itens (${R$(valorExtra)})`,user:SESSION?.nome||"Admin"
    }];
    await sbPatch("ordens_servico",`id=eq.${osId}`,{
      cotacao_itens:[], valor_total:novoTotal, historico:hist
    });
    await recalcularTotal(osId);
    showToast(`✅ Cotação aprovada! ${lista.length} peças lançadas — ${R$(valorExtra)}`);
    await loadAll();
    openOSDetail(osId);
    setTimeout(()=>osTab(null,'osd-pecas'),200);
  }catch(e){showToast("Erro: "+e.message,"error");}
}

// Admin recusa a cotação — itens voltam como peças na OS com valor pendente
async function recusarCotacao(osId){
  if(!confirm("Recusar cotação? Os itens serão lançados na OS como peças sem valor (você define o preço depois).")) return;
  const o = DATA.os.find(x=>x.id===osId);
  const lista = o?.cotacao_itens||[];
  if(!lista.length){ showToast("Nenhum item na cotação.","error"); return; }
  try{
    // Lança cada item na OS sem valor (admin define depois via edição)
    for(const it of lista){
      await sbPost("os_itens",{
        os_id:   osId,
        descricao: it.descricao + " [aguardando preço]",
        quantidade: it.quantidade,
        valor_unitario: 0,
        valor_total:    0,
        produto_id:     null
      });
    }
    const hist = [...(Array.isArray(o.historico)?o.historico:[]),{
      data: nowStr(),
      acao: `❌ Cotação recusada — ${lista.length} itens lançados sem valor`,
      user: SESSION?.nome||"Admin"
    }];
    await sbPatch("ordens_servico",`id=eq.${osId}`,{
      cotacao_itens: [], historico: hist
    });
    if(o){ o.cotacao_itens=[]; o.historico=hist; }
    showToast(`❌ Cotação recusada. ${lista.length} peça(s) lançada(s) na OS aguardando preço.`,"error");
    await loadAll();
    openOSDetail(osId);
    setTimeout(()=>osTab(null,"osd-pecas"), 200);
  }catch(e){ showToast("Erro: "+e.message,"error"); }
}

// ── CRONÔMETRO ────────────────────────────────────────────
function minToHHMM(min){
  const m=Math.round(min);
  return`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
}
function timerAction(action,osId,savedMin){
  const display=document.getElementById(`timer-display-${osId}`);
  const bar=document.getElementById(`timer-bar-${osId}`);
  const btnStart=document.getElementById(`timer-start-${osId}`);
  const btnPause=document.getElementById(`timer-pause-${osId}`);
  const btnStop=document.getElementById(`timer-stop-${osId}`);
  if(action==="start"){
    if(timerInterval) clearInterval(timerInterval);
    timerStart=Date.now();
    timerAccum=savedMin*60;
    bar?.classList.add("timer-running");
    btnStart.style.display="none";btnPause.style.display="";btnStop.style.display="";
    timerInterval=setInterval(()=>{
      const elapsed=Math.floor((Date.now()-timerStart)/1000);
      const total=timerAccum+elapsed;
      const mm=Math.floor(total/60),ss=total%60;
      if(display) display.textContent=`${String(Math.floor(mm/60)).padStart(2,"0")}:${String(mm%60).padStart(2,"0")}`;
    },1000);
  }else if(action==="pause"){
    clearInterval(timerInterval);timerInterval=null;
    const elapsed=(Date.now()-timerStart)/1000/60;
    timerAccum+=elapsed;
    bar?.classList.remove("timer-running");
    btnStart.style.display="";btnPause.style.display="none";btnStop.style.display="";
    btnStart.textContent="▶ Continuar";
  }else if(action==="stop"){
    clearInterval(timerInterval);timerInterval=null;
    const elapsed=timerStart?(Date.now()-timerStart)/1000/60:0;
    const total=Math.round(timerAccum+elapsed);
    sbPatch("ordens_servico",`id=eq.${osId}`,{tempo_total_min:total}).then(()=>{
      showToast(`⏱ Tempo salvo: ${minToHHMM(total)}`);loadAll();
    }).catch(e=>showToast("Erro ao salvar tempo: "+e.message,"error"));
    bar?.classList.remove("timer-running");
    btnStart.style.display="";btnPause.style.display="none";btnStop.style.display="none";
    btnStart.textContent="▶ Iniciar";
    timerStart=null;timerAccum=0;
  }
}

const SB_STORAGE=`${SB_URL}/storage/v1`;
const SB_BUCKET="os-fotos";

function buildFotoGrid(fotos,osId){
  // Normaliza: aceita strings (URL) ou objetos {url, tag, data}
  const normalized = (fotos||[]).map(f=> typeof f==="string" ? {url:f,tag:""} : {url:f.url||f,tag:f.tag||""});
  const slots=[];
  normalized.forEach((f,i)=>{
    if(!f.url) return;
    const isEntrada = f.tag==="entrada";
    slots.push(`
      <div class="foto-thumb${isEntrada?" foto-entrada":""}" onclick="openFotoViewer('${osId}',${i})" style="${isEntrada?"grid-column:span 2;":""}">
        <img src="${f.url}" loading="lazy" style="width:100%;height:100%;object-fit:cover"/>
        ${isEntrada?`<div style="position:absolute;bottom:4px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;backdrop-filter:blur(4px)">📸 Entrada</div>`:""}
        <button class="foto-del" onclick="event.stopPropagation();deleteFoto('${osId}',${i})" title="Remover">✕</button>
      </div>`);
  });
  if(normalized.length<6){
    slots.push(`
      <div class="foto-add" onclick="document.getElementById('foto-input-${osId}').click()" title="Galeria">
        <span class="foto-add-icon">🖼️</span>
        <span class="foto-add-lbl">Galeria</span>
      </div>
      <div class="foto-add" onclick="document.getElementById('foto-cam-${osId}').click()" title="Câmera">
        <span class="foto-add-icon">📷</span>
        <span class="foto-add-lbl">Câmera</span>
      </div>`);
  }
  return slots.join("");
}


// comprime uma imagem no canvas antes do upload
function compressImage(file,maxPx=800,quality=0.70){
  return new Promise((resolve,reject)=>{
    // Formatos que o navegador não decodifica em <img>/<canvas> (ex: HEIC/HEIF de iPhone)
    const nomeOuTipo=(file.type||file.name||"").toLowerCase();
    if(nomeOuTipo.includes("heic")||nomeOuTipo.includes("heif")){
      reject(new Error("Foto em formato HEIC/HEIF não é suportada. No iPhone, mude em Ajustes > Câmera > Formatos para 'Mais Compatível', ou escolha 'Manter Original' ao compartilhar/enviar a foto."));
      return;
    }
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("Não foi possível ler o arquivo selecionado."));
    reader.onload=e=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Não foi possível abrir esta imagem. Tente outro formato (JPG/PNG)."));
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){
          if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
          else{w=Math.round(w*maxPx/h);h=maxPx;}
        }
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(blob) resolve(blob);
          else reject(new Error("Falha ao processar a imagem."));
        },"image/jpeg",quality);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleFotoUpload(event,osId){
  const files=Array.from(event.target.files);
  if(!files.length) return;
  const o=DATA.os.find(x=>x.id===osId);
  const existing=o?.fotos||[];
  const slots=4-existing.length;
  if(slots<=0){showToast("Limite de 4 fotos atingido.","error");return;}
  const toUpload=files.slice(0,slots);

  // mostra spinner nos slots
  const grid=document.getElementById(`foto-grid-${osId}`);
  if(grid){
    const spinner=document.createElement("div");
    spinner.className="foto-add";
    spinner.innerHTML=`<span class="foto-uploading">⏳</span><span class="foto-add-lbl">Enviando...</span>`;
    grid.appendChild(spinner);
  }

  const newUrls=[];
  const erros=[];
  try{
    for(const file of toUpload){
      try{
        const compressed=await compressImage(file);
        const ext="jpg";
        const path=`${osId}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

        // upload para o Supabase Storage
        const res=await fetch(`${SB_STORAGE}/object/${SB_BUCKET}/${path}`,{
          method:"POST",
          headers:{
            "apikey":SB_KEY,
            "Authorization":`Bearer ${SB_KEY}`,
            "Content-Type":"image/jpeg",
            "x-upsert":"true"
          },
          body:compressed
        });
        if(!res.ok){const t=await res.text();throw new Error(t);}

        // URL pública
        const publicUrl=`${SB_STORAGE}/object/public/${SB_BUCKET}/${path}`;
        newUrls.push(publicUrl);
      }catch(fileErr){
        console.warn("Falha ao enviar foto:",file.name,fileErr.message);
        erros.push({nome:file.name,msg:fileErr.message});
      }
    }

    if(newUrls.length>0){
      // Normaliza fotos existentes (pode ter objetos {url,tag} do sistema antigo)
      const existingNorm=(existing||[]).map(f=>typeof f==="string"?f:(f.url||"")).filter(Boolean);
      // salva array de URLs na OS
      const updatedFotos=[...existingNorm,...newUrls];
      await sbPatch("ordens_servico",`id=eq.${osId}`,{fotos:updatedFotos});
      await loadAll();
    }

    if(erros.length===0){
      showToast(`✅ ${newUrls.length} foto(s) adicionada(s).`);
    }else if(newUrls.length>0){
      showToast(`⚠️ ${newUrls.length} foto(s) enviada(s), ${erros.length} falharam: ${erros[0].msg}`,"error");
    }else{
      showToast(`Erro no upload: ${erros[0].msg}`,"error");
    }

    // atualiza só a grade, sem fechar o modal
    const o2=DATA.os.find(x=>x.id===osId);
    const grid2=document.getElementById(`foto-grid-${osId}`);
    if(grid2) grid2.innerHTML=buildFotoGrid(o2?.fotos||[],osId);
    // reconfigura o input
    event.target.value="";
  }catch(e){
    showToast("Erro no upload: "+e.message,"error");
    const grid2=document.getElementById(`foto-grid-${osId}`);
    if(grid2){
      const o2=DATA.os.find(x=>x.id===osId);
      grid2.innerHTML=buildFotoGrid(o2?.fotos||[],osId);
    }
  }
}

async function deleteFoto(osId,index){
  if(!confirm("Remover esta foto?")) return;
  const o=DATA.os.find(x=>x.id===osId);
  // Normaliza para strings
  const fotosRaw=o?.fotos||[];
  const fotos=fotosRaw.map(f=>typeof f==="string"?f:(f.url||"")).filter(Boolean);
  const url=fotos[index];

  // tenta deletar do storage (só funciona para URLs do Storage, não base64)
  if(url && url.startsWith("http")){
    try{
      const match=url.match(/\/object\/public\/os-fotos\/(.+)$/);
      if(match){
        await fetch(`${SB_STORAGE}/object/${SB_BUCKET}/${match[1]}`,{
          method:"DELETE",
          headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`}
        });
      }
    }catch{}
  }

  fotos.splice(index,1);
  await sbPatch("ordens_servico",`id=eq.${osId}`,{fotos});
  if(o) o.fotos=fotos;
  showToast("Foto removida.");
  const grid=document.getElementById(`foto-grid-${osId}`);
  if(grid) grid.innerHTML=buildFotoGrid(fotos,osId);
  else{ await loadAll(); }
}

// lightbox com suporte a URL string e {url,tag} object
function openFotoViewer(osIdOrUrl, idx){
  let urls = [];

  if(typeof idx === "number"){
    // chamado com (osId, index)
    const o = DATA.os.find(x=>x.id===osIdOrUrl);
    const fotos = o?.fotos||[];
    urls = fotos.map(f=> typeof f==="string" ? f : (f.url||"")).filter(Boolean);
  } else {
    // chamado com (url) — modo legado
    urls = [osIdOrUrl];
    idx = 0;
  }

  if(!urls.length) return;
  let cur = idx||0;

  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9000;display:flex;align-items:center;justify-content:center;touch-action:none";
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };

  const render = () => {
    const url = urls[cur];
    overlay.innerHTML = `
      <div style="position:relative;max-width:100vw;max-height:100dvh;display:flex;flex-direction:column;align-items:center">
        <div style="position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(rgba(0,0,0,.6),transparent);z-index:1">
          <div style="color:rgba(255,255,255,.7);font-size:12px">${cur+1} / ${urls.length}</div>
          <button onclick="this.closest('[style*=z-index:9000]').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
        </div>
        <img src="${url}" style="max-width:100vw;max-height:100dvh;object-fit:contain;user-select:none" draggable="false" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
        <div style="display:none;flex-direction:column;align-items:center;gap:12px;color:#fff;padding:40px">
          <div style="font-size:40px">🖼️</div>
          <div style="font-size:14px;opacity:.7">Não foi possível carregar a foto</div>
        </div>
        ${urls.length>1?`
          <div style="position:fixed;bottom:20px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px;z-index:1">
            <button onclick="_fvPrev()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:28px;width:52px;height:52px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>
            <div style="display:flex;gap:6px">${urls.map((_,i)=>`<div style="width:7px;height:7px;border-radius:50%;background:${i===cur?"#fff":"rgba(255,255,255,.4)"}"></div>`).join("")}</div>
            <button onclick="_fvNext()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:28px;width:52px;height:52px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">›</button>
          </div>`:""}
      </div>`;
  };

  window._fvPrev = () => { cur=(cur-1+urls.length)%urls.length; render(); };
  window._fvNext = () => { cur=(cur+1)%urls.length; render(); };

  // Swipe
  let sx=0;
  overlay.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
  overlay.addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>40){ dx<0?window._fvNext():window._fvPrev(); }
  },{passive:true});

  render();
  document.body.appendChild(overlay);
}

function filterProdSearch(val){
  const dd=document.getElementById("prod-results");
  if(!val||val.length<1){dd.style.display="none";return;}
  const q=val.toLowerCase();
  const matches=DATA.produtos.filter(p=>`${p.nome} ${p.codigo||""}`.toLowerCase().includes(q)).slice(0,7);
  if(!matches.length){dd.style.display="none";return;}
  dd.innerHTML=matches.map(p=>{
    const critico=Number(p.estoque_atual)<=Number(p.estoque_minimo);
    const semEstoque=Number(p.estoque_atual)<=0;
    return `<div onclick="selectProd('${p.id}','${esc(p.nome)}',${p.preco_venda||0})"
      style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;${semEstoque?"opacity:.5":""}">
      <div>
        <div style="font-size:12px;font-weight:700">${esc(p.nome)}</div>
        <div style="font-size:10px;color:var(--muted)">${p.codigo?esc(p.codigo)+" · ":""}${R$(p.preco_venda)} · Estoque: <span style="color:${critico?"var(--accent)":"var(--green)"};font-weight:800">${p.estoque_atual} ${p.unidade||"un"}</span></div>
      </div>
      ${semEstoque?`<span style="font-size:9px;background:#ef444420;color:var(--accent);padding:2px 6px;border-radius:4px;font-weight:800">Sem estoque</span>`:""}
    </div>`;
  }).join("");
  dd.style.display="block";
}

function selectProd(id,nome,preco){
  document.getElementById("peca-prod-id").value=id;
  document.getElementById("peca-search").value=nome;
  document.getElementById("peca-desc").value=nome;
  document.getElementById("peca-unit").value=preco;
  document.getElementById("prod-results").style.display="none";
  calcPecaTotal();
  document.getElementById("peca-qtd").focus();
}

function calcPecaTotal(){
  const qtd=Number(document.getElementById("peca-qtd")?.value||1);
  const unit=Number(document.getElementById("peca-unit")?.value||0);
  const total=qtd*unit;
  const el=document.getElementById("peca-total");
  if(el) el.value=total>0?R$(total):"";
}

async function addPeca(osId){
  const desc=document.getElementById("peca-desc").value.trim();
  const qtd=Number(document.getElementById("peca-qtd").value||1);
  const unit=Number(document.getElementById("peca-unit").value||0);
  const prodId=document.getElementById("peca-prod-id").value||null;
  if(!desc){showToast("Informe a descrição da peça.","error");return;}
  if(!unit){showToast("Informe o valor unitário.","error");return;}
  if(qtd<1){showToast("Quantidade inválida.","error");return;}

  // se veio do estoque, verifica disponibilidade
  if(prodId){
    const prod=DATA.produtos.find(p=>p.id===prodId);
    if(prod&&Number(prod.estoque_atual)<qtd){
      showToast(`Estoque insuficiente — disponível: ${prod.estoque_atual} ${prod.unidade||"un"}. Adicione como peça externa ou ajuste a quantidade.`,"error");
      return;
    }
  }

  const btn=document.querySelector("#osd-pecas button[onclick*='addPeca']");
  if(btn){btn.disabled=true;btn.textContent="⏳ Salvando...";}

  try{
    const totalItem=qtd*unit;

    // 1. insere o item na OS
    await sbPost("os_itens",{
      os_id:osId,
      produto_id:prodId||null,
      descricao:desc,
      quantidade:qtd,
      valor_unitario:unit,
      valor_total:totalItem
    });

    // 2. atualiza valor_total da OS
    const o=DATA.os.find(x=>x.id===osId);
    const novoTotal=Number(o?.valor_total||0)+totalItem;
    await sbPatch("ordens_servico",`id=eq.${osId}`,{valor_total:novoTotal});

    // 3. ── MELHORIA #4: decrementa estoque se produto vinculado ──
    if(prodId){
      const prod=DATA.produtos.find(p=>p.id===prodId);
      if(prod){
        const novoEstoque=Number(prod.estoque_atual)-qtd;
        await sbPatch("produtos",`id=eq.${prodId}`,{estoque_atual:novoEstoque});

        // alerta de estoque crítico
        if(novoEstoque<=Number(prod.estoque_minimo)&&novoEstoque>0){
          showToast(`⚠️ Estoque de "${prod.nome}" está crítico: ${novoEstoque} ${prod.unidade||"un"} restantes.`,"error");
        }else if(novoEstoque<=0){
          showToast(`🚨 "${prod.nome}" zerou no estoque!`,"error");
        }else{
          showToast(`✅ Peça adicionada — estoque atualizado: ${novoEstoque} ${prod.unidade||"un"} restantes.`);
        }
      }
    }else{
      showToast("✅ Peça adicionada.");
    }

    // 4. recarrega tudo e reabre a OS na aba peças
    await loadAll();
    await openOSDetail(osId);
    // volta para aba peças automaticamente
    setTimeout(()=>{
      const tabBtn=document.querySelector(".tab:nth-child(2)");
      const pecasPanel=document.getElementById("osd-pecas");
      if(tabBtn&&pecasPanel){
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        tabBtn.classList.add("active");
        ["osd-resumo","osd-pecas","osd-wpp","osd-status","osd-hist"].forEach(x=>{
          const el=document.getElementById(x);if(el)el.style.display=x==="osd-pecas"?"block":"none";
        });
      }
    },50);

  }catch(e){
    showToast("Erro: "+e.message,"error");
    if(btn){btn.disabled=false;btn.textContent="✅ Adicionar peça";}
  }
}

async function removePeca(itemId,prodId,qtd,osId){
  if(!confirm("Remover esta peça? O estoque será reposto.")) return;
  try{
    const item=await sbGet("os_itens",`id=eq.${itemId}`);
    const valorItem=Number(item[0]?.valor_total||0);

    // 1. remove o item
    await sbDelete("os_itens",`id=eq.${itemId}`);

    // 2. subtrai do valor_total da OS
    const o=DATA.os.find(x=>x.id===osId);
    const novoTotal=Math.max(0,Number(o?.valor_total||0)-valorItem);
    await sbPatch("ordens_servico",`id=eq.${osId}`,{valor_total:novoTotal});

    // 3. ── MELHORIA #4: repõe estoque se havia produto vinculado ──
    if(prodId){
      const prod=DATA.produtos.find(p=>p.id===prodId);
      if(prod){
        const novoEstoque=Number(prod.estoque_atual)+Number(qtd);
        await sbPatch("produtos",`id=eq.${prodId}`,{estoque_atual:novoEstoque});
      }
    }

    showToast("Peça removida e estoque reposto.");
    await loadAll();
    await openOSDetail(osId);
    setTimeout(()=>{
      const tabBtn=document.querySelector(".tab:nth-child(2)");
      const pecasPanel=document.getElementById("osd-pecas");
      if(tabBtn&&pecasPanel){
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        tabBtn.classList.add("active");
        ["osd-resumo","osd-pecas","osd-wpp","osd-status","osd-hist"].forEach(x=>{
          const el=document.getElementById(x);if(el)el.style.display=x==="osd-pecas"?"block":"none";
        });
      }
    },50);
  }catch(e){showToast("Erro: "+e.message,"error");}
}

const _origPost=sbPost, _origPatch=sbPatch;
window.sbPost=async function(...args){
  setSyncStatus("saving");

  catch(e){ setSyncStatus("error"); throw e; }
};
window.sbPatch=async function(...args){

};
window.addEventListener("online", ()=>setSyncStatus("ok"));

// ── PULL-TO-REFRESH ───────────────────────────────────
(function(){
  let startY=0, pulling=false, indicator=null;
  function createIndicator(){
    if(document.getElementById("ptr-indicator")) return;
    const el=document.createElement("div");
    el.id="ptr-indicator";
    el.style.cssText="position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-60px);background:#fff;border:1px solid var(--border);border-radius:50px;padding:6px 14px;font-size:11px;font-weight:700;color:var(--accent);z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .2s ease;pointer-events:none;display:flex;align-items:center;gap:6px";
    el.innerHTML="⟳ Solte para atualizar";
    document.body.appendChild(el);
    return el;
  }
  document.addEventListener("touchstart",e=>{
    if(window.scrollY>0) return;
    startY=e.touches[0].clientY;
    pulling=false;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!SESSION) return;
    const dy=e.touches[0].clientY-startY;
    if(dy<40||window.scrollY>0) return;
    pulling=true;
    const ind=createIndicator()||document.getElementById("ptr-indicator");
    if(!ind) return;
    const progress=Math.min(dy-40,60);
    ind.style.transform=`translateX(-50%) translateY(${progress-60}px)`;
    ind.innerHTML=progress>50?"⟳ Solte para atualizar":"⬇️ Puxe para atualizar";
    ind.style.color=progress>50?"var(--accent)":"var(--text-muted)";
  },{passive:true});
  document.addEventListener("touchend",()=>{
    const ind=document.getElementById("ptr-indicator");
    if(pulling&&ind){
      ind.style.transform="translateX(-50%) translateY(-60px)";
      if(SESSION){loadAll();showToast("Atualizando...");}
    }
    if(ind) setTimeout(()=>ind.remove(),300);
    pulling=false;
  });
})();

function updateAppBadge(){
  if(!("setAppBadge" in navigator)) return;
  const urgentes=DATA.os.filter(o=>o.prioridade==="urgente"&&!["finalizado","entregue"].includes(o.status)).length;
  const atrasadas=DATA.os.filter(o=>!["finalizado","entregue"].includes(o.status)&&o.created_at&&(Date.now()-new Date(o.created_at))/(1000*60*60*24)>=3).length;
  const total=urgentes+atrasadas;
  if(total>0) navigator.setAppBadge(total).catch(()=>{});
  else navigator.clearAppBadge?.().catch(()=>{});
}

  const osDoVeiculo=DATA.os.filter(o=>o.veiculo_id===veiculoId&&o.id!==osAtualId&&["finalizado","entregue"].includes(o.status));

  const pecas=[];
  osDoVeiculo.forEach(o=>{
    const itens=(DATA.os_itens||[]).filter(i=>i.os_id===o.id);
    itens.forEach(i=>pecas.push({desc:i.descricao,os:numOS(o.numero),data:o.data_entrada||o.created_at?.split("T")[0]||""}));
  });
  if(!pecas.length) return "";
  return `
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px">🔧 Peças usadas neste veículo</div>
      ${pecas.slice(0,6).map(p=>`
        <div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--border-sub);align-items:center">
          <span style="font-size:12px;flex:1;color:var(--text-primary)">${esc(p.desc)}</span>
          <span style="font-size:9px;color:var(--text-muted);white-space:nowrap">${esc(p.os)} · ${esc(p.data)}</span>
        </div>`).join("")}
      ${pecas.length>6?`<div style="font-size:10px;color:var(--text-muted);margin-top:4px">+${pecas.length-6} peças em OS anteriores</div>`:""}
    </div>`;
}

// ── AUTO-REFRESH ──────────────────────────────────────────
let _autoRefreshTimer=null;
const AUTO_REFRESH_MS=60000; // 60 segundos

function startAutoRefresh(){
  stopAutoRefresh();
  _autoRefreshTimer=setInterval(async()=>{
    if(!SESSION||document.hidden) return; // pausa se aba não está visível
    if(!navigator.onLine) return;         // pausa se offline
    try{
      const safe=q=>q.catch(()=>[]);
      const[clis,veis,os,prods,lancs]=await Promise.all([
        safe(sbGet("clientes","select=*&order=created_at.desc")),
        safe(sbGet("veiculos","select=*")),
        safe(sbGet("ordens_servico","select=*&order=numero.desc")),
        safe(sbGet("produtos","select=*&order=nome")),
        safe(sbGet("lancamentos","select=*&order=created_at.desc")),
      ]);
      DATA.clientes=clis.map(c=>({...c,veiculos:veis.filter(v=>v.cliente_id===c.id)}));
      DATA.veiculos=veis;DATA.os=os;DATA.produtos=prods;DATA.lancamentos=lancs;
      saveDataCache();
      updateAppBadge();
      // re-renderiza só se não há modal aberto e não está digitando
      const modalAberto=document.querySelector(".overlay");
      const digitando=document.activeElement?.tagName==="INPUT"||document.activeElement?.tagName==="TEXTAREA";
      if(!modalAberto&&!digitando) render();
    }catch{}
  },AUTO_REFRESH_MS);
}

function stopAutoRefresh(){
  clearInterval(_autoRefreshTimer);
  _autoRefreshTimer=null;
}

// pausa quando aba perde foco, retoma quando volta
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) stopAutoRefresh();
  else if(SESSION) startAutoRefresh();
});

function abrirLightbox(osId, idx){
  const o=DATA.os.find(x=>x.id===osId);if(!o)return;
  const fotos=Array.isArray(o.fotos)?o.fotos:[];
  if(!fotos.length)return;
  let cur=idx||0;
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;align-items:center;justify-content:center;touch-action:none";
  overlay.setAttribute("data-overlay","1");

  const render=()=>{
    const f=fotos[cur];
    const url=f?.url||f||"";
    const tag=f?.tag||"";
    overlay.innerHTML=
      '<div style="position:relative;max-width:100vw;max-height:100dvh;display:flex;flex-direction:column;align-items:center">'+
        '<div style="position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(rgba(0,0,0,.6),transparent)">'+
          '<div style="color:#fff;font-size:13px;font-weight:700">'+( tag?'📸 '+tag:"")+'</div>'+
          '<div style="color:rgba(255,255,255,.7);font-size:12px">'+(cur+1)+' / '+fotos.length+'</div>'+
          '<button onclick="this.closest(\'[style*=z-index:999]\').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>'+
        '</div>'+
        '<img src="'+url+'" style="max-width:100vw;max-height:100dvh;object-fit:contain;user-select:none" draggable="false"/>'+
        (fotos.length>1?
          '<div style="position:fixed;bottom:20px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px">'+
            '<button onclick="_lbPrev()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:24px;width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>'+
            '<div style="display:flex;gap:6px">'+fotos.map((_,i)=>'<div style="width:7px;height:7px;border-radius:50%;background:'+(i===cur?"#fff":"rgba(255,255,255,.4)")+'"></div>').join("")+'</div>'+
            '<button onclick="_lbNext()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:24px;width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">›</button>'+
          '</div>':"")+
      '</div>';
  };

  window._lbPrev=()=>{cur=(cur-1+fotos.length)%fotos.length;render();};
  window._lbNext=()=>{cur=(cur+1)%fotos.length;render();};

  // Swipe horizontal
  let sx=0;
  overlay.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
  overlay.addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>40){dx<0?window._lbNext():window._lbPrev();}
  },{passive:true});
  overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};

  render();
  document.body.appendChild(overlay);
}

function abrirAddFotoOS(osId){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.multiple=true; inp.capture="environment";
  inp.style.display="none";
  inp.onchange=async()=>{
    const files=Array.from(inp.files||[]);
    if(!files.length)return;
    const o=DATA.os.find(x=>x.id===osId); if(!o)return;
    // Normaliza fotos existentes para formato de URL string
    const existing=(o.fotos||[]).map(f=>typeof f==="string"?f:(f.url||"")).filter(Boolean);
    const isFirstPhoto=existing.length===0;
    showToast("📷 Enviando "+files.length+" foto(s)...");
    try{
      const newUrls=[];
      for(let fi=0;fi<files.length;fi++){
        const file=files[fi];
        const compressed=await compressImage(file,900,0.72);
        const path=`${osId}/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
        const res=await fetch(`${SB_STORAGE}/object/${SB_BUCKET}/${path}`,{
          method:"POST",
          headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"image/jpeg","x-upsert":"true"},
          body:compressed
        });
        if(!res.ok){ const t=await res.text(); throw new Error(t); }
        newUrls.push(`${SB_STORAGE}/object/public/${SB_BUCKET}/${path}`);
      }
      const updatedFotos=[...existing,...newUrls];
      await sbPatch("ordens_servico",`id=eq.${osId}`,{fotos:updatedFotos});
      if(o) o.fotos=updatedFotos;
      showToast(`✅ ${newUrls.length} foto(s) adicionada(s)!`);
      // Atualiza grid sem fechar o modal
      const grid=document.getElementById(`foto-grid-${osId}`);
      if(grid) grid.innerHTML=buildFotoGrid(updatedFotos,osId);
      else{ closeModal(); await loadAll(); }
    }catch(e){ showToast("Erro ao enviar foto: "+e.message,"error"); }
    document.body.removeChild(inp);
  };
  document.body.appendChild(inp);
  inp.click();
}

async function solicitarPecaCotacao(osId){
  const desc = (document.getElementById("sol-desc")?.value||"").trim();
  if(!desc){ showToast("Descreva a peça necessária.","error"); return; }
  const qtd  = Number(document.getElementById("sol-qtd")?.value||1);
  const obs  = (document.getElementById("sol-obs")?.value||"").trim();
  const btn  = document.querySelector("[data-overlay] button[onclick*='solicitarPecaCotacao']");
  if(btn){ btn.disabled=true; btn.textContent="⏳ Enviando..."; }
  try{
    const o = DATA.os.find(x=>x.id===osId);
    const lista = [...(o.cotacao_itens||[]), {
      descricao: desc,
      quantidade: qtd,
      obs,
      valor_unitario: 0,
      solicitado_por: SESSION?.nome||"Mecânico",
      criado_em: nowStr()

async function salvarDiagnostico(osId){
  const tecnico=(document.getElementById('diag-tecnico')?.value||'').trim();
  if(!tecnico){showToast('Descreva o diagnóstico técnico.','erro');return;}
  const btn=document.querySelector('[data-overlay] .btn-p');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  try{
    const o=DATA.os.find(x=>x.id===osId);
    const specs={...(o?.especificacoes||{})};
    const comp=(document.getElementById('diag-comp')?.value||'').trim();
    if(comp) specs.componente_defeituoso=comp;
    const dtc=(document.getElementById('diag-dtc')?.value||'').trim();
    const resultado=document.getElementById('diag-resultado')?.value||'precisa_orcamento';
    const hist=[...(Array.isArray(o?.historico)?o.historico:[]),{data:agora(),acao:'Diagnóstico registrado',user:SESSION?.nome||'—'}];
    // Se aprovado direto para reparo, avança o status
    const novoStatus=resultado==='aprovado'?'em_execucao':resultado==='sem_defeito'?'finalizado':(o?.status||'diagnostico');
    await sbPatch('ordens_servico','id=eq.'+osId,{
      diagnostico:tecnico,
      cod_falha:dtc||o?.cod_falha,
      /* resultado salvo em specs acima */
      especificacoes:specs,
      historico:hist,
      status:novoStatus,
    });
    if(o){
      o.diagnostico=tecnico;
      o.cod_falha=dtc||o.cod_falha;
      if(o) o.especificacoes={...(o.especificacoes||{}),resultado_diagnostico:resultado};
      o.especificacoes=specs;
      o.historico=hist;
      o.status=novoStatus;
    }
    showToast('✅ Diagnóstico salvo!');
    closeModal(); // fecharOverlay(document.querySelector('[data-overlay]'));
    closeModal();
    abrirDetalheOS(osId);
  }catch(e){
    showToast('Erro: '+e.message,'erro');
    if(btn){btn.disabled=false;btn.textContent='💾 Salvar diagnóstico';}
  }
}

async function salvarAprovacao(osId,situacao){
  const mo=Number(document.getElementById('orc-mo')?.value||0);
  const pc=Number(document.getElementById('orc-pecas')?.value||0);
  const dc=Number(document.getElementById('orc-desc')?.value||0);
  const total=Math.max(0,mo+pc-dc);
  const prazo=document.getElementById('orc-prazo')?.value||'';
  const obsC=(document.getElementById('orc-obs-cli')?.value||'').trim();
  try{
    const o=DATA.os.find(x=>x.id===osId);
    const hist=[...(Array.isArray(o?.historico)?o.historico:[]),
      {data:agora(),acao:'Orçamento: '+{aprovado:'Aprovado',reprovado:'Reprovado',parcial:'Parcialmente aprovado',aguardando:'Aguardando cliente'}[situacao],user:SESSION?.nome||'—'}];
    const novoStatus=situacao==='aprovado'?'em_execucao':situacao==='reprovado'?'finalizado':situacao==='parcial'?'em_execucao':'aguardando_aprovacao';
    const specsOrc={...(o?.especificacoes||{})};
    specsOrc.aprovacao_orcamento=situacao;
    specsOrc.valor_pecas=pc;
    specsOrc.valor_desconto=dc;
    specsOrc.prazo_dias=prazo?Number(prazo):null;
    specsOrc.obs_cliente=obsC;
    const dados={
      valor_mo:mo,valor_total:total,
      especificacoes:specsOrc,historico:hist,status:novoStatus,
    };
    await sbPatch('ordens_servico','id=eq.'+osId,dados);
    if(o) Object.assign(o,dados);
    const labels={aprovado:'✅ Aprovado!',reprovado:'❌ Reprovado — OS finalizada',parcial:'⚠️ Aprovação parcial',aguardando:'⏳ Aguardando cliente'};
    showToast(labels[situacao]);
    closeModal(); // fecharOverlay(document.querySelector('[data-overlay]'));
    closeModal();
    abrirDetalheOS(osId);
  }catch(e){showToast('Erro: '+e.message,'erro');}
}

async function salvarLaudo(osId){
  const o=DATA.os.find(x=>x.id===osId);if(!o)return;
  const tipo=o.tipo_servico||'bico';
  const isBico=['bico','injetor'].includes(tipo);
  const campos=isBico?
    ['vazao_antes','vazao_depois','vedacao_antes','vedacao_depois','atomizacao','ruido','pressao_abertura']:
    ['pressao_minima','pressao_maxima','vazao_nominal','rpm_teste','advance','shutoff','regulagem'];
  const laudo={referencia:document.getElementById('lau-ref')?.value||''};
  campos.forEach(f=>{const v=document.getElementById('lau-'+f)?.value||'';if(v) laudo[f]=v;});
  laudo.servico_executado=document.getElementById('lau-servico')?.value||'';
  laudo.conclusao=document.getElementById('lau-conclusao')?.value||'recondicionado';
  laudo.garantia=document.getElementById('lau-garantia')?.value||'';
  laudo.obs=document.getElementById('lau-obs')?.value||'';
  laudo.tecnico=SESSION?.nome||'—';
  laudo.data=agora();
  const btn=document.querySelector('[data-overlay] .btn-p');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  try{
    const hist=[...(Array.isArray(o.historico)?o.historico:[]),{data:agora(),acao:'Laudo técnico registrado',user:SESSION?.nome||'—'}];
        if(o) o.especificacoes={...(o.especificacoes||{}),laudo_tecnico:laudo};
    await sbPatch('ordens_servico','id=eq.'+osId,{
      especificacoes:{...(o?.especificacoes||{}),laudo_tecnico:laudo},
      historico:hist,
    });
    o.laudo_tecnico=laudo;
    o.garantia=laudo.garantia;
    o.historico=hist;
    showToast('✅ Laudo salvo!');
    closeModal(); // fecharOverlay(document.querySelector('[data-overlay]'));
    closeModal();
    abrirDetalheOS(osId);
  }catch(e){
    showToast('Erro: '+e.message,'erro');
    if(btn){btn.disabled=false;btn.textContent='💾 Salvar laudo';}
  }
}
