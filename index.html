<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MAXX DIESEL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:16px;padding:28px;max-width:360px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}
h1{color:#9b1c1c;font-size:24px;font-weight:900;margin-bottom:4px}
p{color:#6b7280;font-size:12px;margin-bottom:20px}
label{display:block;text-align:left;font-size:11px;font-weight:700;color:#374151;text-transform:uppercase;margin-bottom:5px;margin-top:14px}
input{width:100%;padding:12px;border:1.5px solid #e2e6ed;border-radius:10px;font-size:15px;outline:none;display:block}
#btn{width:100%;padding:13px;background:#9b1c1c;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;display:block}
#msg{margin-top:10px;font-size:13px;font-weight:600;min-height:20px;color:#dc2626}
</style>
</head>
<body>
<div class="box">
  <h1>MAXX DIESEL</h1>
  <p>v3 — build 25/06/2026</p>
  <label>Usuário</label>
  <input type="text" id="u" value="admin"/>
  <label>Senha</label>
  <input type="password" id="p" value="maxx2024"/>
  <button id="btn" type="button">Entrar</button>
  <div id="msg"></div>
</div>
<script type="text/javascript">
(function() {
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');
  
  function entrar() {
    var u = document.getElementById('u').value.trim().toLowerCase();
    var p = document.getElementById('p').value;
    msg.style.color = '#16a34a';
    msg.textContent = 'JS OK - usuario: ' + u;
    
    if (u === 'admin' && p === 'maxx2024') {
      msg.textContent = 'Bootstrap OK! Carregando...';
      setTimeout(function() {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:24px;font-weight:900;color:#9b1c1c">MAXX DIESEL - Sistema carregado!</div>';
      }, 1000);
      return;
    }
    msg.style.color = '#dc2626';
    msg.textContent = 'Use admin / maxx2024';
  }
  
  btn.addEventListener('click', entrar);
  document.getElementById('p').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') entrar();
  });
  
  msg.style.color = '#16a34a';
  msg.textContent = 'JavaScript carregado ✅';
})();
</script>
</body>
</html>
