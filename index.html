async function confirmarEntrega(osId){
  const o=DATA.os.find(x=>x.id===osId);if(!o)return;
  const kmSaida=Number(document.getElementById('ent-km')?.value||0);
  const garantia=document.getElementById('ent-garantia')?.value||'';
  const obsEntr=(document.getElementById('ent-obs-entr')?.value||'').trim();
  const pgto=document.getElementById('ent-pgto')?.value||'';
  const btn=document.querySelector('[data-overlay] button[style*="16a34a"]');
  if(btn){btn.disabled=true;btn.textContent='Finalizando...';}
  try{
    const hist=[...(Array.isArray(o.historico)?o.historico:[]),{data:agora(),acao:'Veículo entregue ao cliente'+(pgto?' — '+pgto:''),user:SESSION?.nome||'—'}];
    const specsEntr={...(o?.especificacoes||{})};
    specsEntr.km_saida=kmSaida||null;
    specsEntr.obs_entrega=obsEntr;
    specsEntr.forma_pagamento=pgto;
    specsEntr.data_saida=hoje();
    const dados={
      status:'entregue',
      especificacoes:specsEntr,
      historico:hist,
    };
    await sbPatch('ordens_servico','id=eq.'+osId,dados);
    Object.assign(o,dados);
    // Lança pagamento no financeiro
    if(o.valor_total>0){
      await sbPost('lancamentos',{
        descricao:'OS '+numOS(o.numero)+' — '+(DATA.clientes.find(c=>c.id===o.cliente_id)?.nome||''),
        valor:o.valor_total,
        tipo:'receita',
        status:'pago',
        categoria:'Serviços',
        forma:pgto,
        data:hoje(),
        os_id:osId,
      }).catch(()=>{});
    }
    haptic([30,50,30]);
    showToast('🎉 Veículo entregue! OS finalizada.');
    closeModal(); // fecharOverlay(document.querySelector('[data-overlay]'));
    closeModal();
    await carregarDados();
  }catch(e){
    showToast('Erro: '+e.message,'erro');
    if(btn){btn.disabled=false;btn.textContent='✅ Confirmar entrega';}
  }
}

function _getBotoesProcesso(o){
  const id=o.id;
  const st=o.status;
  const btns=[];
  // Diagnóstico — disponível nos status iniciais
  if(['recebido','diagnostico','aguardando_aprovacao'].includes(st)){
    btns.push('<button onclick="closeModal();setTimeout(()=>abrirDiagnostico(\''+id+'\'),100)" style="flex:1;padding:10px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;color:#0369a1;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);min-height:42px">🔍 Diagnóstico</button>');
  }
  // Orçamento — após diagnóstico ou se aguardando aprovação
  if(['diagnostico','aguardando_aprovacao','em_execucao'].includes(st)||o.diagnostico){
    btns.push('<button onclick="closeModal();setTimeout(()=>abrirAprovacaoOrcamento(\''+id+'\'),100)" style="flex:1;padding:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;color:#b45309;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);min-height:42px">💰 Orçamento</button>');
  }
  // Laudo — para serviços de laboratório
  if(['bico','bomba','injetor'].includes(o.tipo_servico)||['injecao','bomba'].includes(o.setor_id)){
    btns.push('<button onclick="closeModal();setTimeout(()=>abrirLaudo(\''+id+'\'),100)" style="flex:1;padding:10px;background:#f0fdf4;border:1px solid #86efac;border-radius:10px;color:#16a34a;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);min-height:42px">📋 Laudo</button>');
  }
  // Entrega — apenas quando finalizado
  if(st==='finalizado'){
    btns.push('<button onclick="closeModal();setTimeout(()=>abrirEntregaOS(\''+id+'\'),100)" style="flex:1;padding:10px;background:#16a34a;border:none;border-radius:10px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);min-height:42px;box-shadow:0 3px 10px rgba(22,163,74,.3)">🚗 Entregar</button>');
  }
  return btns;
}

      '<div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Redefinir senha</div>'+
      '<div style="display:flex;gap:8px;margin-bottom:14px">'+
        '<input class="finput" id="eu-novasenha" type="password" placeholder="Nova senha (deixe em branco para não alterar)" style="flex:1"/>'+
      '</div>'+

      '<button onclick="salvarEdicaoUsuario(\''+uid+'\')" class="btn-p">💾 Salvar alterações</button>'+
      '<button onclick="closeModal(); // fecharOverlay(this)" class="btn-s">Cancelar</button>'+
    '</div></div>';

  document.body.appendChild(overlay);

  // Inicializa estado interno de permissões
  window._euPerms={...perms};
}

function _selRoleEU(role){
  document.getElementById('eu-role').value=role;
  document.querySelectorAll('#eu-role-btns button').forEach(b=>{
    const on=b.dataset.role===role;
    b.style.borderColor=on?'var(--acc)':'var(--border)';
    b.style.background=on?'var(--acc-tint)':'var(--bg)';
  });
  // Atualiza permissões ao trocar role
  window._euPerms={...(PERM_PADRAO[role]||{})};
  MODULOS_PERM.forEach(m=>{
    const tem=window._euPerms[m.id]!==false;
    const tog=document.getElementById('eu-perm-tog-'+m.id);
    const ball=document.getElementById('eu-perm-ball-'+m.id);
    const lbl=document.getElementById('eu-perm-lbl-'+m.id);
    if(tog){tog.style.background=tem?'var(--acc)':'var(--border)';}
    if(ball){ball.style.left=tem?'22px':'2px';}
    if(lbl){lbl.textContent=tem?'Permitido':'Bloqueado';}
  });
}

function _togglePermEU(modId){
  if(!window._euPerms) window._euPerms={};
  const cur=window._euPerms[modId]!==false;
  window._euPerms[modId]=!cur;
  const tem=!cur;
  const tog=document.getElementById('eu-perm-tog-'+modId);
  const ball=document.getElementById('eu-perm-ball-'+modId);
  const lbl=document.getElementById('eu-perm-lbl-'+modId);
  if(tog){tog.style.background=tem?'var(--acc)':'var(--border)';}
  if(ball){ball.style.left=tem?'22px':'2px';}
  if(lbl){lbl.textContent=tem?'Permitido':'Bloqueado';}
}

async function salvarEdicaoUsuario(uid){
  const nome=(document.getElementById('eu-nome')?.value||'').trim();
  const role=document.getElementById('eu-role')?.value||'mecanico';
  const novaSenha=(document.getElementById('eu-novasenha')?.value||'').trim();
  if(!nome){showToast('Informe o nome.','erro');return;}
  if(novaSenha&&novaSenha.length<4){showToast('Senha mínimo 4 caracteres.','erro');return;}
  const btn=document.querySelector('[data-overlay] .btn-p');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  try{
    const dados={nome,role,perms:window._euPerms||{}};
    if(novaSenha){
      let senha=novaSenha;
      try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(novaSenha));senha=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch{}
      dados.senha=senha;
    }
    await sbPatch('usuarios','id=eq.'+uid,dados);
    const u=(DATA.usuarios||[]).find(x=>x.id===uid);
    if(u) Object.assign(u,dados);
    // Atualiza sessão própria se for o usuário logado
    if(uid===SESSION?.id){SESSION.nome=nome;SESSION.role=role;SESSION.perms=dados.perms;salvarSessao(SESSION);}
    showToast('✅ Usuário atualizado!');
    closeModal(); // fecharOverlay(document.querySelector('[data-overlay]'));
    renderUsuarios(document.getElementById('conteudo'));
  }catch(e){
    showToast('Erro: '+e.message,'erro');
    if(btn){btn.disabled=false;btn.textContent='💾 Salvar alterações';}
  }
}

function salvarConfiguracoes(){
  const campos=['nome','sub','tel','end','cor'];
  const checkboxes=['show_km','show_motor','show_dtc','show_prioridade','show_setor','show_hist','show_assin','show_obs'];
  const cfg={};
  campos.forEach(id=>{const el=document.getElementById('cfg-'+id);if(el) cfg[id]=el.value.trim();});
  checkboxes.forEach(id=>{const el=document.getElementById(id);if(el) cfg[id]=el.checked;});
  localStorage.setItem('maxx_cfg',JSON.stringify(cfg));
  showToast('✅ Configurações salvas!');
}

function abrirPreviewImpressao(){
  // Pega a primeira OS disponível para o preview
  const os=DATA.os[0];
  if(!os){showToast('Nenhuma OS disponível para preview.','erro');return;}
  imprimirOS(os.id,true); // true = preview mode
}

function importarDados(){
  const dados={os:DATA.os,clientes:DATA.clientes,veiculos:DATA.veiculos};
  const blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='maxx-diesel-backup-'+hoje()+'.json';
  a.click();
  showToast('📥 Backup exportado!');
}
