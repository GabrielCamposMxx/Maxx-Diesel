<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MAXX DIESEL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f0f2f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:16px;padding:28px;max-width:360px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}
h1{color:#9b1c1c;font-size:24px;font-weight:900;margin-bottom:4px}
p{color:#6b7280;font-size:12px;margin-bottom:20px}
input{width:100%;padding:12px;border:1.5px solid #e2e6ed;border-radius:10px;font-size:15px;outline:none;display:block;margin-bottom:10px}
#btn{width:100%;padding:13px;background:#9b1c1c;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;display:block}
#log{margin-top:10px;font-size:12px;text-align:left;background:#f8f9fb;border-radius:8px;padding:10px;min-height:40px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <h1>MAXX DIESEL</h1>
  <p>v5 debug</p>
  <input type="text" id="u" value="admin" placeholder="usuario"/>
  <input type="password" id="p" value="maxx2024" placeholder="senha"/>
  <button id="btn" type="button" onclick="entrar()">Entrar</button>
  <div id="log">Aguardando...</div>
</div>
<script>
var SB = "https://rktprdnhpyefmqoiqxpv.supabase.co";
var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrdHByZG5ocHllZm1xb2lxeHB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MDcyNzUsImV4cCI6MjA5NjE4MzI3NX0.hXlX8WLAFPXZgvACaRBmHfehnZfL1gWoiuMT6dRBQU4";

function log(msg) {
  document.getElementById('log').textContent += '\n' + msg;
}

window.onerror = function(m,s,l) { log('ERRO JS: ' + m + ' L' + l); };

log('JS carregado OK');

function entrar() {
  log('Botao clicado!');
  var u = document.getElementById('u').value.trim().toLowerCase();
  var p = document.getElementById('p').value;
  log('Usuario: ' + u);

  if (u === 'admin' && p === 'maxx2024') {
    log('Bootstrap OK! Buscando no banco...');
    fetch(SB + '/rest/v1/usuarios?username=eq.admin&select=id,nome,role&limit=1', {
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
    })
    .then(function(r) { 
      log('Status HTTP: ' + r.status);
      return r.json(); 
    })
    .then(function(d) { 
      log('Resposta: ' + JSON.stringify(d));
      abrirSistema(d[0] || {nome:'Administrador',role:'admin'});
    })
    .catch(function(e) { 
      log('Erro fetch: ' + e.message);
      abrirSistema({nome:'Administrador',role:'admin'});
    });
    return;
  }

  fetch(SB + '/rest/v1/usuarios?username=eq.' + encodeURIComponent(u) + '&select=*&limit=1', {
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
  })
  .then(function(r) { return r.json(); })
  .then(function(rows) {
    if (!rows || !rows.length) { log('Usuario nao encontrado'); return; }
    var row = rows[0];
    log('Senha no banco: ' + row.senha);
    if (row.senha === p) {
      abrirSistema(row);
    } else {
      log('Senha incorreta');
    }
  })
  .catch(function(e) { log('Erro: ' + e.message); });
}

function abrirSistema(user) {
  log('Abrindo sistema para: ' + user.nome);
  localStorage.setItem('maxx_u', JSON.stringify(user));
  setTimeout(function() {
    window.location.href = 'sistema.html';
  }, 500);
}

document.getElementById('p').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') entrar();
});
</script>
</body>
</html>
