<title>MAXX DIESEL</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ── DESIGN TOKENS — MAXX DIESEL ── */
:root{
  /* Vermelho MAXX (extraído do escudo) */
  --acc:#C41A1A;
  --acc2:#A01414;
  --acc-tint:rgba(196,26,26,.07);
  --acc-glow:rgba(196,26,26,.2);

  /* Superfícies */
  --bg:#F2F1EF;
  --card:#FFFFFF;
  --card2:#FAFAF9;

  /* Bordas */
  --border:#E4E2DC;
  --border2:#F0EEE8;

  /* Texto */
  --t1:#1A1A1A;
  --t2:#6B6B6B;
  --t3:#A8A8A8;

  /* Semânticas */
  --ok:#16a34a;
  --warn:#d97706;
  --err:#dc2626;
  --info:#2563eb;

  /* Misc */
  --r:16px;
  --font:'Barlow',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --bounce:cubic-bezier(0.34,1.56,0.64,1);
  --shadow:0 2px 12px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-up:0 -2px 12px rgba(0,0,0,.06);
}

body{font-family:var(--font);background:var(--bg);color:var(--t1);min-height:100dvh}

/* ── LOGIN ── */
#tela-login{
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;padding:20px;
  background:radial-gradient(ellipse at top,#3d0a0a 0%,#1a0505 60%,#0d0202 100%);
}
.lbox{
  background:#fff;border-radius:24px;padding:36px 28px;
  width:100%;max-width:340px;
  box-shadow:0 24px 64px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
}
.llogo{text-align:center;margin-bottom:28px}
.llogo-title{font-size:20px;font-weight:900;color:var(--acc);letter-spacing:3px;margin-top:8px;text-transform:uppercase}
.llogo-sub{font-size:10px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:1.2px}
.lcampo{margin-bottom:14px}
.lcampo label{display:block;font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.linput{
  width:100%;padding:13px 14px;
  border:1.5px solid var(--border);border-radius:12px;
  font-size:15px;font-family:var(--font);
  outline:none;transition:all .15s;color:var(--t1);background:#fff;
}
.linput:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.lbtn{
  width:100%;padding:15px;
  background:var(--acc);color:#fff;border:none;border-radius:12px;
  font-size:16px;font-weight:700;font-family:var(--font);cursor:pointer;
  margin-top:6px;
  transition:all .18s var(--bounce);
  box-shadow:0 4px 20px rgba(196,26,26,.4);
  min-height:52px;
}
.lbtn:hover{background:var(--acc2);transform:translateY(-1px);box-shadow:0 6px 24px rgba(196,26,26,.5)}
.lbtn:active{transform:scale(.97)}
.lbtn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
#login-err{text-align:center;font-size:13px;margin-top:10px;min-height:20px;color:var(--err);font-weight:600}

/* ── APP ── */
#app{display:none;min-height:100dvh}

/* ── TOPBAR ── */
#topbar{
  position:sticky;top:0;z-index:100;
  background:var(--acc);
  height:56px;display:flex;align-items:center;padding:0 14px;gap:10px;
  box-shadow:0 1px 0 rgba(0,0,0,.1),0 4px 20px rgba(196,26,26,.25);
}
#menu-btn{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);
  border-radius:8px;color:#fff;font-size:18px;padding:5px 8px;cursor:pointer;line-height:1;
  min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;
}
#topbar-title{color:#fff;font-size:14px;font-weight:700;flex:1;letter-spacing:.5px;text-transform:uppercase}
#sync-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .3s}
.tb-btn{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);
  border-radius:9px;color:#fff;font-size:13px;font-weight:700;
  padding:7px 12px;cursor:pointer;font-family:var(--font);
  min-height:36px;white-space:nowrap;
}

/* ── FAB ── */
#nova-os-fab{
  position:fixed;right:16px;
  bottom:calc(76px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;
  background:var(--acc);color:#fff;border:none;
  font-size:28px;cursor:pointer;
  box-shadow:0 4px 20px rgba(196,26,26,.5),0 2px 6px rgba(0,0,0,.2);
  z-index:150;display:flex;align-items:center;justify-content:center;
  transition:all .2s var(--bounce);
}
#nova-os-fab:active{transform:scale(.88)}

/* ── SIDEBAR ── */
#sidebar-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.45);z-index:200;backdrop-filter:blur(4px)
}
#sidebar{
  position:fixed;left:0;top:0;bottom:0;width:264px;
  background:var(--card);z-index:201;
  transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  box-shadow:4px 0 32px rgba(0,0,0,.15);
}
#sidebar.open{transform:translateX(0)}
.sb-logo{
  padding:18px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  background:var(--acc);
}
.sb-logo-text{font-size:14px;font-weight:900;color:#fff;letter-spacing:1px;text-transform:uppercase}
.sb-user{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.sb-group{
  font-size:9px;font-weight:700;color:var(--t3);
  text-transform:uppercase;letter-spacing:1px;
  padding:14px 8px 4px;
}
.sb-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:11px 12px;border:none;border-radius:10px;background:none;
  color:var(--t2);font-size:13px;font-weight:600;
  cursor:pointer;text-align:left;font-family:var(--font);
  transition:all .15s;margin-bottom:2px;min-height:44px;
}
.sb-item:hover{background:var(--bg);color:var(--t1);transform:translateX(2px)}
.sb-item.ativo{background:var(--acc-tint);color:var(--acc);font-weight:700}
.sb-item span:first-child{font-size:16px;width:22px;text-align:center}
.sb-footer{padding:12px 8px;border-top:1px solid var(--border)}

/* Desktop: sidebar com nova OS button */
@media(min-width:900px){
  .sb-logo{padding:16px;}
  .sb-nav{padding:8px 8px 0}
  #sidebar-nova-os{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:12px 14px;border:none;border-radius:10px;
    background:var(--acc);color:#fff;
    font-size:13px;font-weight:700;cursor:pointer;
    font-family:var(--font);margin:10px 0 4px;
    box-shadow:0 3px 10px rgba(196,26,26,.3);
    min-height:44px;transition:all .15s;
  }
  #sidebar-nova-os:hover{background:var(--acc2);transform:translateY(-1px)}
}

/* ── CONTEÚDO ── */
#conteudo{padding:14px 14px calc(80px + env(safe-area-inset-bottom))}

/* ── SPINNER ── */
#spinner{
  display:none;flex-direction:column;align-items:center;
  justify-content:center;padding:60px;gap:12px;color:var(--t2);font-size:13px
}
.spin{
  width:28px;height:28px;border:3px solid var(--border);
  border-top-color:var(--acc);border-radius:50%;
  animation:girar .7s linear infinite
}
@keyframes girar{to{transform:rotate(360deg)}}

/* ── CARDS ── */
.card{
  background:var(--card);border-radius:var(--r);
  border:1px solid var(--border);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px;
}
.card-titulo{
  font-size:10px;font-weight:700;color:var(--t2);
  text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:12px;display:flex;align-items:center;justify-content:space-between
}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{
  background:var(--card);border-radius:var(--r);
  border:1px solid var(--border);border-top:3px solid;
  padding:14px;box-shadow:var(--shadow);
  transition:transform .18s var(--bounce);cursor:pointer;
}
.stat:active{transform:scale(.97)}
.stat-val{font-size:26px;font-weight:900;line-height:1;font-family:var(--mono)}
.stat-lbl{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.stat-sub{font-size:10px;color:var(--t3);margin-top:2px}

/* ── OS CARDS ── */
.os-card{
  background:var(--card);border-radius:18px;
  border:1px solid var(--border);overflow:hidden;
  margin-bottom:10px;box-shadow:var(--shadow);
  cursor:pointer;transition:transform .18s var(--bounce);
}
.os-card:active{transform:scale(.99)}
.os-foto{
  width:100%;height:112px;
  background:linear-gradient(145deg,#1A1A1A,#2d2d2d);
  position:relative;display:flex;align-items:center;justify-content:center;
  font-size:36px;overflow:hidden;
}
.os-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.os-badge-num{
  position:absolute;top:8px;left:10px;
  background:rgba(0,0,0,.65);color:#fff;
  font-family:var(--mono);font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:20px;backdrop-filter:blur(6px);
}
.os-placa-box{
  position:absolute;top:8px;right:10px;
  background:#fff;border:2px solid #1A1A1A;border-radius:6px;
  padding:2px 8px;text-align:center;
}
.os-placa-top{
  background:#1d3a8a;color:#fff;font-size:6px;font-weight:900;
  letter-spacing:.8px;border-radius:3px 3px 0 0;
  margin:-2px -8px 2px;padding:1.5px;
}
.os-placa-num{font-family:var(--mono);font-size:12px;font-weight:900;color:#0f0f1a;letter-spacing:1px}
.os-urgente{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--err);color:#fff;
  font-size:10px;font-weight:800;padding:4px 10px;text-align:center;
  letter-spacing:.3px;
}
.os-body{padding:12px 14px}
.os-nome{font-size:14px;font-weight:700;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.os-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:700;border:1px solid}
.os-desc{font-size:12px;color:var(--t2);line-height:1.45;margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.os-footer{display:flex;align-items:center;gap:6px;padding-top:8px;border-top:1px solid var(--border2);flex-wrap:wrap}
.next-btn{
  padding:6px 12px;border-radius:9px;border:1.5px solid;
  font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font);
  transition:all .15s var(--bounce);min-height:32px;
}
.next-btn:active{transform:scale(.95)}

/* ── LISTA COMPACTA ── */
.os-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 13px;background:var(--card);
  border:1px solid var(--border);border-left:3px solid;
  border-radius:12px;margin-bottom:7px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .15s;
}
.os-row:active{transform:scale(.99)}
.os-row-foto{
  width:44px;height:44px;border-radius:9px;
  background:linear-gradient(135deg,#1A1A1A,#2d2d2d);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;overflow:hidden;
}
.os-row-foto img{width:100%;height:100%;object-fit:cover}
.os-row-info{flex:1;min-width:0}
.os-row-nome{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.os-row-sub{font-size:11px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}

/* ── PILLS ── */
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{
  padding:7px 14px;border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid var(--border);background:var(--card);color:var(--t2);
  white-space:nowrap;cursor:pointer;transition:all .15s var(--bounce);
  flex-shrink:0;min-height:34px;display:inline-flex;align-items:center;gap:4px;
}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 3px 12px rgba(196,26,26,.3)}
.pill:active{transform:scale(.95)}

/* ── SHEET / MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:300;display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(6px);
}
.sheet{
  background:var(--card);border-radius:24px 24px 0 0;
  width:100%;max-width:540px;max-height:92dvh;overflow-y:auto;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
  animation:sobir .26s var(--bounce);
}
@keyframes sobir{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 10px}
.sheet-titulo{
  font-size:17px;font-weight:700;padding:0 20px 14px;
  border-bottom:1px solid var(--border2);margin-bottom:14px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
}
.sheet-titulo-txt{flex:1;min-width:0}
.sheet-x{
  background:var(--bg);border:1px solid var(--border);border-radius:50%;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;color:var(--t2);flex-shrink:0;margin-top:2px;
  transition:all .15s;min-width:32px;
}
.sheet-x:active{background:var(--border);color:var(--t1)}
.sheet-corpo{padding:0 20px}

/* ── FORMULÁRIOS ── */
.flabel{
  display:block;font-size:10px;font-weight:700;color:var(--t2);
  text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:5px;margin-top:14px;
}
.flabel:first-child{margin-top:0}
.finput{
  width:100%;padding:13px 14px;
  border:1.5px solid var(--border);border-radius:12px;
  font-size:15px;font-family:var(--font);
  outline:none;transition:all .15s;color:var(--t1);background:#fff;
  min-height:48px;
}
.finput:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
textarea.finput{resize:none}
select.finput{cursor:pointer;-webkit-appearance:none}

/* ── BOTÕES ── */
.btn-p{
  width:100%;padding:15px;background:var(--acc);color:#fff;border:none;
  border-radius:12px;font-size:15px;font-weight:700;font-family:var(--font);
  cursor:pointer;box-shadow:0 4px 16px rgba(196,26,26,.35);
  transition:all .18s var(--bounce);margin-top:16px;min-height:52px;
}
.btn-p:active{transform:scale(.97)}
.btn-p:disabled{opacity:.6;cursor:not-allowed}
.btn-s{
  width:100%;padding:13px;background:var(--card2);color:var(--t2);
  border:1px solid var(--border);border-radius:12px;
  font-size:14px;font-weight:700;font-family:var(--font);
  cursor:pointer;margin-top:8px;min-height:48px;
}

/* ── TIPO / SETOR ── */
.tipo-grid{display:flex;gap:6px;margin-top:4px}
.tipo-btn{
  flex:1;padding:10px 4px;border:1.5px solid var(--border);border-radius:12px;
  background:var(--card2);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--t2);
  transition:all .18s var(--bounce);min-height:60px;
}
.tipo-btn span{font-size:18px}
.tipo-btn.on{border-color:var(--acc);background:var(--acc-tint);color:var(--acc);transform:scale(1.04)}
.tipo-btn:active{transform:scale(.95)}
.setor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.setor-btn{
  padding:10px 6px;border:2px solid;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:9px;font-weight:700;transition:all .18s var(--bounce);min-height:60px;
}
.setor-btn span{font-size:18px}

/* ── FOTOS ── */
.foto-area{
  width:100%;height:120px;border:2px dashed var(--border);border-radius:14px;
  background:var(--card2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;position:relative;transition:all .2s;
}
.foto-area.ok{border-color:var(--ok);border-style:solid;background:#f0fdf4}
.foto-area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foto-thumb{width:68px;height:68px;border-radius:10px;border:1px solid var(--border);overflow:hidden;position:relative;flex-shrink:0}
.foto-thumb img{width:100%;height:100%;object-fit:cover}
.foto-thumb-del{
  position:absolute;top:2px;right:2px;
  background:rgba(0,0,0,.65);border:none;color:#fff;
  width:18px;height:18px;border-radius:50%;font-size:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.ci-btns{display:flex;gap:6px;margin-top:7px}
.ci-btn{
  flex:1;padding:11px 8px;border-radius:11px;border:1.5px solid var(--border);
  background:var(--card);font-size:12px;font-weight:700;color:var(--t2);
  cursor:pointer;text-align:center;transition:all .15s var(--bounce);min-height:44px;
}
.ci-btn.red{background:var(--acc-tint);border-color:var(--acc-glow);color:var(--acc)}

/* ── DETALHE INFO ── */
.detalhe-info{
  background:var(--card2);border-radius:14px;
  padding:12px 14px;border:1px solid var(--border);margin-bottom:14px
}
.info-linha{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--border2)}
.info-linha:last-child{border:none}
.info-chave{font-size:11px;color:var(--t2);min-width:72px;flex-shrink:0;font-weight:700;padding-top:1px}
.info-valor{font-size:13px;color:var(--t1);flex:1;word-break:break-word}
.status-acao{
  width:100%;padding:12px 14px;border-radius:13px;border:none;
  font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  margin-bottom:8px;font-family:var(--font);
  transition:all .15s var(--bounce);min-height:48px;
}
.status-acao:active{transform:scale(.97)}

/* ── BOTTOM NAV ── */
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(62px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--border);
  display:flex;align-items:flex-start;justify-content:space-around;
  padding:8px 0 0;z-index:100;box-shadow:var(--shadow-up);
}
.bn-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--t3);font-size:10px;font-weight:700;
  cursor:pointer;padding:4px 10px;font-family:var(--font);
  transition:color .15s;min-width:54px;min-height:48px;
}
.bn-btn.on{color:var(--acc)}
.bn-btn span:first-child{font-size:20px}

/* ── TOAST ── */
#toast{
  position:fixed;left:12px;right:12px;
  bottom:calc(70px + env(safe-area-inset-bottom));
  background:#1A1A1A;color:#fff;padding:13px 16px;border-radius:13px;
  font-size:13px;font-weight:600;z-index:9999;display:none;
  align-items:center;gap:9px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  animation:fadeup .2s ease;
}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── EMPTY STATE ── */
.vazio{text-align:center;padding:48px 20px;color:var(--t3)}
.vazio-icon{font-size:44px;margin-bottom:12px}
.vazio-titulo{font-size:15px;font-weight:700;color:var(--t2);margin-bottom:6px}
.vazio-sub{font-size:13px}

/* ── BUSCA GLOBAL ── */
#busca-global-wrap input::placeholder{color:rgba(255,255,255,.5)}
#busca-global-wrap input:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4)}
#busca-global-results div:last-child{border-bottom:none!important}
@media(min-width:900px){
  #busca-global-wrap{left:240px}
  #conteudo[style*="margin-top"]{margin-top:0!important;padding-top:84px}
}
   ════════════════════════════════════════ */
@media(min-width:900px){
  /* Sidebar sempre visível */
  #sidebar{
    transform:translateX(0) !important;
    position:fixed;top:0;left:0;bottom:0;
    width:240px;z-index:50;
  }
  #sidebar-overlay{display:none !important}
  #menu-btn{display:none !important}

  /* App desloca para direita da sidebar */
  #app{display:block;margin-left:240px}

  /* Topbar ocupa o espaço restante */
  #topbar{
    position:sticky;top:0;
    margin-left:0;
    z-index:60;
  }

  /* Conteúdo centralizado com max-width */
  #conteudo{
    max-width:900px;margin:0 auto;
    padding:20px 28px calc(20px + env(safe-area-inset-bottom));
  }

  /* Stats em 4 colunas */
  .stats-grid{grid-template-columns:repeat(4,1fr)}

  /* OS em 2 colunas no modo cards */
  #os-grid-2col{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  /* Bottom nav vira top nav integrado na sidebar */
  #bottom-nav{display:none !important}

  /* FAB fica ao lado da sidebar */
  #nova-os-fab{
    right:24px;
    bottom:24px;
  }

  /* Kanban mais espaçoso */
  .kanban-scroll{padding-bottom:20px}

  /* Cards maiores */
  .os-card{border-radius:18px}

  /* Sheet centralizado */
  .overlay{align-items:center !important}
  .sheet{
    border-radius:20px !important;
    max-height:85vh !important;
    margin:0 auto;
    max-width:560px;
  }
  @keyframes sobir{
    from{opacity:0;transform:translateY(20px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
}

/* Tablet (600–899px) */
@media(min-width:600px) and (max-width:899px){
  #conteudo{max-width:640px;margin:0 auto;padding:16px 20px calc(80px + env(safe-area-inset-bottom))}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
}
</style>

// ══════════════════════════════════════════════════
// SUPABASE
// ══════════════════════════════════════════════════
async function sbGet(tabela,query){
  try{
    const r=await fetch(SB_URL+"/rest/v1/"+tabela+"?"+(query||""),{headers:H});
    if(!r.ok)return[];
    return await r.json();
  }catch{return[];}
}

async function sbPost(tabela,corpo){
  setSyncStatus("saving");
  try{
    const r=await fetch(SB_URL+"/rest/v1/"+tabela,{method:"POST",headers:{...H,Prefer:"return=representation"},body:JSON.stringify(corpo)});
    if(!r.ok){const t=await r.text();throw new Error(t);}
    setSyncStatus("ok");
    return await r.json();
  }catch(e){setSyncStatus("erro");throw e;}
}

async function sbPatch(tabela,query,corpo){
  setSyncStatus("saving");
  try{
    const r=await fetch(SB_URL+"/rest/v1/"+tabela+"?"+query,{method:"PATCH",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify(corpo)});
    if(!r.ok){const t=await r.text();throw new Error(t);}
    setSyncStatus("ok");
  }catch(e){setSyncStatus("erro");throw e;}
}

async function sbDelete(tabela,query){
  const r=await fetch(SB_URL+"/rest/v1/"+tabela+"?"+query,{method:"DELETE",headers:{...H,Prefer:"return=minimal"}});
  if(!r.ok){const t=await r.text();throw new Error(t);}
}

function salvarSessao(s){try{localStorage.setItem("maxx_s2",JSON.stringify(s));}catch{}}
function carregarSessao(){try{return JSON.parse(localStorage.getItem("maxx_s2")||"null");}catch{return null;}}

document.getElementById("btn-entrar").addEventListener("click",fazerLogin);
document.getElementById("inp-pass").addEventListener("keydown",e=>{if(e.key==="Enter")fazerLogin();});
document.getElementById("inp-user").addEventListener("keydown",e=>{if(e.key==="Enter")fazerLogin();});

async function fazerLogin(){
  const u=(document.getElementById("inp-user").value||"").trim().toLowerCase();
  const p=document.getElementById("inp-pass").value||"";
  const err=document.getElementById("login-err");
  const btn=document.getElementById("btn-entrar");
  err.textContent="";
  if(!u||!p){err.textContent="Preencha usuário e senha.";return;}

  // bootstrap sempre funciona
  if(u==="admin"&&p==="maxx2024"){
    SESSION={nome:"Administrador",role:"admin",user:"admin",id:null};
    salvarSessao(SESSION);
    abrirApp();
    return;
  }

  btn.disabled=true;btn.textContent="Verificando...";
  try{
    const rows=await sbGet("usuarios","username=eq."+encodeURIComponent(u)+"&select=*&limit=1");
    if(!rows||!rows.length){err.textContent="Usuário não encontrado.";btn.disabled=false;btn.textContent="Entrar";return;}
    const row=rows[0];
    if(row.ativo===false){err.textContent="Usuário inativo.";btn.disabled=false;btn.textContent="Entrar";return;}
    let ok=(row.senha===p);
    if(!ok){
      try{
        const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p));
        const h=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
        ok=(row.senha===h);
      }catch{}
    }
    if(!ok){err.textContent="Senha incorreta.";btn.disabled=false;btn.textContent="Entrar";return;}
    SESSION={id:row.id,nome:row.nome,role:row.role||"mecanico",user:row.username};
    salvarSessao(SESSION);
    sbPatch("usuarios","id=eq."+row.id,{ultimo_acesso:new Date().toISOString()}).catch(()=>{});
  }catch(e){
    err.textContent="Erro de conexão. Tente novamente.";
    btn.disabled=false;btn.textContent="Entrar";
    return;
  }
  btn.disabled=false;btn.textContent="Entrar";
  abrirApp();
}

function abrirApp(){
  document.getElementById("tela-login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("sb-user-nome").textContent=SESSION.nome+" · "+({admin:"Admin",recepcao:"Recepção",mecanico:"Mecânico"}[SESSION.role]||SESSION.role);
  document.getElementById("btn-sair").addEventListener("click",sair,{once:true});
  // Desktop: mostra botão Nova OS na sidebar
  const isDesktop=window.innerWidth>=900;
  const btnSidebarOS=document.getElementById("sidebar-nova-os");
  if(btnSidebarOS) btnSidebarOS.style.display=isDesktop?"flex":"none";
  window.addEventListener("resize",()=>{
    const d=window.innerWidth>=900;
    if(btnSidebarOS) btnSidebarOS.style.display=d?"flex":"none";
  });
  construirNav();
  carregarDados();

async function carregarDados(){
  const spin=document.getElementById("spinner");
  const cont=document.getElementById("conteudo");
  spin.style.display="flex";cont.style.display="none";
  // tenta cache primeiro
  try{
    const c=localStorage.getItem("maxx_cache");
    if(c){
      const snap=JSON.parse(c);
      DADOS.os=snap.os||[];DADOS.clientes=snap.clientes||[];
      DADOS.veiculos=snap.veiculos||[];DADOS.produtos=snap.produtos||[];
      DADOS.lancamentos=snap.lancamentos||[];
      spin.style.display="none";cont.style.display="block";
      renderizar();
    }
  }catch{}
  // busca dados frescos
  try{
    const [os,clis,veis,prods,lancs,users]=await Promise.all([
      sbGet("ordens_servico","select=*&order=numero.desc"),
      sbGet("clientes","select=*&order=nome"),
      sbGet("veiculos","select=*"),
      sbGet("produtos","select=*&order=nome"),
      sbGet("lancamentos","select=*&order=created_at.desc&limit=200"),
      sbGet("usuarios","select=id,nome,username,role,ativo,ultimo_acesso"),
    ]);
    DADOS.os=Array.isArray(os)?os:[];
    DADOS.clientes=Array.isArray(clis)?clis:[];
    DADOS.veiculos=Array.isArray(veis)?veis:[];
    DADOS.produtos=Array.isArray(prods)?prods:[];
    DADOS.lancamentos=Array.isArray(lancs)?lancs:[];
    DADOS.usuarios=Array.isArray(users)?users:[];
    try{localStorage.setItem("maxx_cache",JSON.stringify(DADOS));}catch{}
  }catch{}
  spin.style.display="none";cont.style.display="block";
  renderizar();
}

    else if(PAGINA==="mural") renderMural(el);
    else if(PAGINA==="cotacao") renderCotacao(el);
    else if(PAGINA==="kanban") renderKanban(el);
    else if(PAGINA==="agenda") renderAgenda(el);
    else if(PAGINA==="relatorio") renderRelatorio(el);

function calcPreviewCotacao(itemId, qtd){
  const val=Number(document.getElementById("preco-"+itemId)?.value||0);
  const el=document.getElementById("preview-"+itemId);
  if(!el)return;
  if(val>0){
    el.style.display="block";
    el.textContent="Total: "+R$(val*qtd)+" ("+qtd+"× "+R$(val)+")";
  } else {
    el.style.display="none";
  }
}

async function aprovarCotacao(itemId, qtd){
  const val=Number(document.getElementById("preco-"+itemId)?.value||0);
  if(!val||val<=0){toast("Informe o valor unitário.","erro");return;}
  try{
    await sbPatch("os_itens","id=eq."+itemId,{
      valor_unit:val,
      valor_total:val*qtd,
      status:"aprovado",
      aprovado_por:SESSION?.nome||"Admin",
      aprovado_em:agora(),
    });
    // Recalcula total da OS
    const item=(await sbGet("os_itens","id=eq."+itemId+"&select=os_id"))[0];
    if(item?.os_id){
      const o=DADOS.os.find(x=>x.id===item.os_id);
      const itens=await sbGet("os_itens","os_id=eq."+item.os_id+"&select=valor_total");
      const soma=(itens||[]).reduce((s,i)=>s+Number(i.valor_total||0),0);
      const novoTotal=Number(o?.valor_mo||0)+soma;
      await sbPatch("ordens_servico","id=eq."+item.os_id,{valor_total:novoTotal});
      if(o) o.valor_total=novoTotal;
    }
    toast("✅ Cotação aprovada! "+R$(val*qtd));
    renderCotacao(document.getElementById("conteudo"));
  }catch(e){toast("Erro: "+e.message,"erro");}
}

async function recusarCotacao(itemId){
  if(!confirm("Recusar e remover este item?"))return;
  try{
    await sbDelete("os_itens","id=eq."+itemId);
    toast("Item removido.");
    renderCotacao(document.getElementById("conteudo"));
  }catch(e){toast("Erro: "+e.message,"erro");}
}

async function salvarSolicitacaoCotacao(){
  const osId=document.getElementById("cot-os-id")?.value;
  const desc=(document.getElementById("cot-desc")?.value||"").trim();
  const ref=(document.getElementById("cot-ref")?.value||"").trim();
  const qtd=Number(document.getElementById("cot-qtd")?.value||1);
  const obs=(document.getElementById("cot-obs")?.value||"").trim();

  if(!osId){toast("Selecione a OS.","erro");return;}
  if(!desc){toast("Informe a descrição da peça.","erro");return;}

  const btn=Array.from(document.querySelectorAll("button")).find(b=>b.textContent.includes("Enviar para aprovação"));
  if(btn){btn.disabled=true;btn.textContent="Enviando...";}

  try{
    await sbPost("os_itens",{
      os_id:osId,
      referencia:ref||null,
      descricao:desc,
      quantidade:qtd,
      valor_unit:0,
      valor_total:0,
      tipo:"peca",
      status:"pendente",
      observacao:obs||null,
      solicitado_por:SESSION?.nome||"—",
      solicitado_em:agora(),
    });
    toast("✅ Solicitação enviada!");
    document.querySelector("div[style*='position:fixed'][style*='z-index:400']")?.remove();
    renderCotacao(document.getElementById("conteudo"));
  }catch(e){
    toast("Erro: "+e.message,"erro");
    if(btn){btn.disabled=false;btn.textContent="📤 Enviar para aprovação";}
  }
}

        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:8px 10px;background:'+col.cor+'15;border-radius:10px;border-left:3px solid '+col.cor+'">'+
          '<span>'+col.icon+'</span>'+
          '<span style="font-size:12px;font-weight:700;color:'+col.cor+'">'+col.label+'</span>'+
          '<span style="margin-left:auto;background:'+col.cor+';color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px">'+osCol.length+'</span>'+
        '</div>'+
        (osCol.length?osCol.map(o=>{
          const cli=DADOS.clientes.find(c=>c.id===o.cliente_id);
          const specs=o.especificacoes||{};
          const next=FLOW[o.status]?.[0];
          const stNext=next?STATUS[next]:null;
          return '<div onclick="abrirDetalheOS(\''+o.id+'\')" draggable="true" ondragstart="onDragStart(\''+o.id+'\')" style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:7px;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:opacity .15s" onmousedown="this.style.opacity=.8" onmouseup="this.style.opacity=1">'+
            '<div style="font-size:12px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(cli?.nome||"Sem cliente")+'</div>'+
            '<div style="font-size:10px;color:var(--t2);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+numOS(o.numero)+(specs.placa?' · '+specs.placa:"")+'</div>'+
            (stNext?'<button onclick="event.stopPropagation();avancarStatus(\''+o.id+'\',\''+next+'\')" style="width:100%;padding:6px;background:'+stNext.cor+'12;border:1px solid '+stNext.cor+'25;border-radius:8px;font-size:10px;font-weight:700;color:'+stNext.cor+';cursor:pointer;font-family:var(--font)">'+stNext.icon+' '+stNext.label+'</button>':"")+
          '</div>';
        }).join(""):
          '<div style="padding:14px;text-align:center;font-size:11px;color:var(--t3);background:#f8f9fb;border-radius:10px">Vazio</div>')+
      '</div>';
    }).join("")+
    '</div>';
}

// ══════════════════════════════════════════════════
// AGENDA
// ══════════════════════════════════════════════════
function renderAgenda(el){
  // Usa OS com data_entrada como base
  const hoje=new Date();
  const dias=[];
  for(let i=0;i<7;i++){
    const d=new Date(hoje);d.setDate(hoje.getDate()+i);
    dias.push(d);
  }

  const fmt=d=>d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"});
  const iso=d=>d.toISOString().split("T")[0];

  el.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
      '<div style="font-size:18px;font-weight:900">📅 Agenda</div>'+
      '<button onclick="abrirNovaOS()" style="padding:8px 14px;background:var(--acc);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)">+ OS</button>'+
    '</div>'+
    dias.map(d=>{
      const osDay=DADOS.os.filter(o=>(o.data_entrada||o.created_at?.split("T")[0])===iso(d));
      const isHoje=iso(d)===iso(hoje);
      return '<div style="margin-bottom:12px">'+
        '<div style="font-size:11px;font-weight:700;color:'+(isHoje?"var(--acc)":"var(--t2)")+';text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;background:'+(isHoje?"var(--acc-tint)":"var(--bg)")+';border-radius:8px;margin-bottom:6px;display:flex;align-items:center;gap:8px">'+
          fmt(d)+(isHoje?' <span style="background:var(--acc);color:#fff;font-size:9px;padding:1px 6px;border-radius:20px">HOJE</span>':"")+
          '<span style="margin-left:auto;font-size:10px">'+osDay.length+' OS</span>'+
        '</div>'+
        (osDay.length?osDay.map(o=>osRowHTML(o)).join(""):
          '<div style="padding:10px 12px;font-size:12px;color:var(--t3);background:#f8f9fb;border-radius:9px">Sem OS</div>')+
      '</div>';
    }).join("");
}

// ══════════════════════════════════════════════════
// RELATÓRIO
// ══════════════════════════════════════════════════
function renderRelatorio(el){
  // Calcula por mês atual
  const agora=new Date();
  const mesAtual=agora.toISOString().slice(0,7); // "2024-01"
  const mesLabel=agora.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

  const osMes=DADOS.os.filter(o=>(o.created_at||"").startsWith(mesAtual));
  const lancMes=DADOS.lancamentos.filter(l=>(l.created_at||"").startsWith(mesAtual));

  const recPago=lancMes.filter(l=>l.tipo==="receita"&&l.status==="pago").reduce((s,l)=>s+Number(l.valor||0),0);
  const despPago=lancMes.filter(l=>l.tipo==="despesa"&&l.status==="pago").reduce((s,l)=>s+Number(l.valor||0),0);
  const ticketMedio=osMes.length?osMes.reduce((s,o)=>s+Number(o.valor_total||0),0)/osMes.length:0;

  // OS por status no mês
  const porStatus=Object.entries(STATUS).map(([k,s])=>{
    const n=osMes.filter(o=>o.status===k).length;
    return n?{k,s,n}:null;
  }).filter(Boolean);

  // Técnicos
  const porTecnico={};
  osMes.forEach(o=>{
    const t=o.tecnico||"Sem técnico";
    porTecnico[t]=(porTecnico[t]||0)+1;
  });

  // Tipos de serviço
  const porTipo={};
  osMes.forEach(o=>{
    const t=o.tipo_servico||"veiculo";
    porTipo[t]=(porTipo[t]||0)+1;
  });

  el.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">'+
    '<div style="font-size:18px;font-weight:900;text-transform:capitalize">📈 '+mesLabel+'</div>'+
    '<button onclick="exportarRelatorio()" style="padding:7px 14px;background:var(--acc);color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font)">🖨️ Exportar</button>'+
  '</div>'+
    '<div style="font-size:12px;color:var(--t2);margin-bottom:14px">Relatório do período</div>'+

    '<div class="stats-grid" style="margin-bottom:14px">'+
      '<div class="stat" style="border-top-color:var(--acc)"><div class="stat-val" style="color:var(--acc)">'+osMes.length+'</div><div class="stat-lbl">OS no mês</div></div>'+
      '<div class="stat" style="border-top-color:#16a34a"><div class="stat-val" style="color:#16a34a;font-size:18px">'+R$(recPago)+'</div><div class="stat-lbl">Receita</div></div>'+
      '<div class="stat" style="border-top-color:#dc2626"><div class="stat-val" style="color:#dc2626;font-size:18px">'+R$(despPago)+'</div><div class="stat-lbl">Despesas</div></div>'+
      '<div class="stat" style="border-top-color:#8b5cf6"><div class="stat-val" style="color:#8b5cf6;font-size:18px">'+R$(ticketMedio)+'</div><div class="stat-lbl">Ticket médio</div></div>'+
    '</div>'+

    '<div class="card" style="margin-bottom:12px">'+
      '<div class="card-titulo">OS por status</div>'+
      porStatus.map(({k,s,n})=>'<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border2)">'+
        '<span style="font-size:16px">'+s.icon+'</span>'+
        '<span style="font-size:13px;font-weight:600;flex:1">'+s.label+'</span>'+
        '<div style="display:flex;align-items:center;gap:8px">'+
          '<div style="height:6px;width:'+Math.round(n/Math.max(osMes.length,1)*80)+'px;background:'+s.cor+';border-radius:3px;min-width:4px"></div>'+
          '<span style="font-size:13px;font-weight:700;font-family:var(--mono);color:'+s.cor+'">'+n+'</span>'+
        '</div>'+
      '</div>').join("")+
    '</div>'+

    (Object.keys(porTecnico).length?
    '<div class="card" style="margin-bottom:12px">'+
      '<div class="card-titulo">Por técnico</div>'+
      Object.entries(porTecnico).sort((a,b)=>b[1]-a[1]).map(([t,n])=>'<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border2)">'+
        '<span style="font-size:13px;flex:1;font-weight:600">'+esc(t)+'</span>'+
        '<span style="font-size:13px;font-weight:700;color:var(--acc)">'+n+' OS</span>'+
      '</div>').join("")+
    '</div>':"")+

    '<div class="card">'+
      '<div class="card-titulo">Por tipo de serviço</div>'+
      Object.entries(porTipo).sort((a,b)=>b[1]-a[1]).map(([t,n])=>{
        const icons={veiculo:"🚗",pecas:"📦",bico:"💉",bomba:"⚙️",kit:"🔩"};
        return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border2)">'+
          '<span style="font-size:16px">'+( icons[t]||"🔧")+'</span>'+
          '<span style="font-size:13px;flex:1;font-weight:600">'+t[0].toUpperCase()+t.slice(1)+'</span>'+
          '<span style="font-size:13px;font-weight:700;color:var(--acc)">'+n+'</span>'+
        '</div>';
      }).join("")+
    '</div>';
}

// DASHBOARD
// ══════════════════════════════════════════════════
function renderDashboard(el){
  const ativas=DADOS.os.filter(o=>!["entregue"].includes(o.status)).length;
  const prontas=DADOS.os.filter(o=>o.status==="finalizado").length;
  const retornos=DADOS.os.filter(o=>o.status==="retorno").length;
  const recPago=DADOS.lancamentos.filter(l=>l.tipo==="receita"&&l.status==="pago").reduce((s,l)=>s+Number(l.valor||0),0);
  const aRec=DADOS.lancamentos.filter(l=>l.tipo==="receita"&&l.status==="pendente").reduce((s,l)=>s+Number(l.valor||0),0);

  const alertas=[];
  const agAprov=DADOS.os.filter(o=>o.status==="aguardando_aprovacao");
  const agPecas=DADOS.os.filter(o=>o.status==="aguardando_pecas");
  const atrasadas=DADOS.os.filter(o=>!["finalizado","entregue"].includes(o.status)&&o.created_at&&(Date.now()-new Date(o.created_at))/86400000>=3);
  if(retornos) alertas.push({cor:"#dc2626",txt:retornos+" OS em retorno de serviço"});
  if(prontas) alertas.push({cor:"#16a34a",txt:prontas+" OS prontas para entrega — "+R$(DADOS.os.filter(o=>o.status==="finalizado").reduce((s,o)=>s+Number(o.valor_total||0),0))});
  if(agAprov.length) alertas.push({cor:"#f59e0b",txt:agAprov.length+" OS aguardando aprovação"});
  if(agPecas.length) alertas.push({cor:"#f97316",txt:agPecas.length+" OS aguardando peças"});
  if(atrasadas.length) alertas.push({cor:"#6b7280",txt:atrasadas.length+" OS parada(s) há 3+ dias"});

  const recentes=DADOS.os.filter(o=>o.status!=="entregue").slice(0,5).map(o=>osRowHTML(o)).join("");

  el.innerHTML=
    (alertas.length?'<div class="card" style="border-left:3px solid var(--acc);padding:12px 14px;margin-bottom:12px">'+
      '<div style="font-size:10px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">⚠️ ATENÇÃO</div>'+
      alertas.map(a=>'<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px"><div style="width:7px;height:7px;border-radius:50%;background:'+a.cor+';flex-shrink:0"></div>'+esc(a.txt)+'</div>').join("")+
    '</div>':"")+'<div class="stats-grid">'+
    '<div class="stat" style="border-top-color:var(--acc)" onclick="irPara(\'os\')">'+
      '<div class="stat-val" style="color:var(--acc)">'+ativas+'</div>'+
      '<div class="stat-lbl">OS Ativas</div>'+
    '</div>'+
    '<div class="stat" style="border-top-color:#16a34a">'+
      '<div class="stat-val" style="color:#16a34a;font-size:18px">'+R$(recPago)+'</div>'+
      '<div class="stat-lbl">Receita Paga</div>'+
      '<div class="stat-sub">'+R$(aRec)+' a receber</div>'+
    '</div>'+
    '<div class="stat" style="border-top-color:'+(prontas?"#f59e0b":"var(--border)")+'" onclick="irPara(\'os\')">'+
      '<div class="stat-val" style="color:'+(prontas?"#f59e0b":"var(--t3)")+'">'+prontas+'</div>'+
      '<div class="stat-lbl">Prontas</div>'+
    '</div>'+
    '<div class="stat" style="border-top-color:'+(retornos?"#dc2626":"var(--border)")+'" onclick="irPara(\'os\')">'+
      '<div class="stat-val" style="color:'+(retornos?"#dc2626":"var(--t3)")+'">'+retornos+'</div>'+
      '<div class="stat-lbl">Retornos</div>'+
    '</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="card-titulo">📋 OS em andamento <button onclick="irPara(\'os\')" style="font-size:11px;color:var(--acc);background:none;border:none;cursor:pointer;font-weight:700">Ver todas →</button></div>'+
      (recentes||'<div class="vazio" style="padding:24px"><div class="vazio-icon" style="font-size:32px">📋</div><div class="vazio-titulo" style="font-size:13px">Nenhuma OS</div></div>')+
    '</div>';
}

// ══════════════════════════════════════════════════
// LISTA DE OS
// ══════════════════════════════════════════════════
function osRowHTML(o){
  const cli=DADOS.clientes.find(c=>c.id===o.cliente_id);
  const set=SETORES.find(s=>s.id===o.setor_id);
  const st=STATUS[o.status]||STATUS.recebido;
  const next=FLOW[o.status]?.[0];
  const stNext=next?STATUS[next]:null;
  const specs=o.especificacoes||{};
  const placa=(DADOS.veiculos.find(v=>v.id===o.veiculo_id)?.placa)||specs.placa||"";
  const fotos=Array.isArray(o.fotos)?o.fotos:[];
  const dias=o.created_at?Math.floor((Date.now()-new Date(o.created_at))/86400000):0;
  const isOld=dias>=3&&!["finalizado","entregue"].includes(o.status);
  const tipoIcon={veiculo:"🚗",pecas:"📦",bico:"💉",bomba:"⚙️",kit:"🔩"}[o.tipo_servico||"veiculo"]||"🔧";

  return '<div class="os-row" style="border-left-color:'+st.cor+'" onclick="abrirDetalheOS(\''+o.id+'\')">'+ 
    '<div class="os-row-foto">'+(fotos[0]?'<img src="'+(fotos[0].url||fotos[0])+'" alt="foto" loading="lazy"/>':tipoIcon)+'</div>'+
    '<div class="os-row-info">'+
      '<div class="os-row-nome">'+
        (o.prioridade==="urgente"?'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#dc2626;margin-right:5px;flex-shrink:0"></span>':"")+
        esc(cli?.nome||"Sem cliente")+
        (placa?' <span style="font-family:var(--mono);font-size:10px;background:#f1f5f9;padding:1px 5px;border-radius:3px">'+esc(placa)+'</span>':"")+
      '</div>'+
      '<div style="display:flex;gap:5px;margin-top:3px;flex-wrap:wrap">'+
        '<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:'+st.cor+'15;color:'+st.cor+';border:1px solid '+st.cor+'25">'+st.icon+' '+st.label+'</span>'+
        (set?'<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:'+set.cor+'12;color:'+set.cor+'">'+set.icon+' '+set.nome+'</span>':"")+
        (isOld?'<span style="font-size:9px;color:var(--err);font-weight:700">⚠️ '+dias+'d</span>':"")+
        (o.status==="retorno"?'<span style="font-size:9px;font-weight:700;color:#9b1c1c">🔄 Retorno</span>':"")+
      '</div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0">'+
      (o.valor_total>0?'<span style="font-family:var(--mono);font-size:11px;font-weight:700;color:#16a34a">'+R$(o.valor_total)+'</span>':"")+
      (stNext?'<button onclick="event.stopPropagation();avancarStatus(\''+o.id+'\',\''+next+'\')" style="font-size:10px;font-weight:700;padding:4px 9px;border-radius:8px;border:1px solid '+stNext.cor+'30;background:'+stNext.cor+'12;color:'+stNext.cor+';cursor:pointer;font-family:var(--font)">'+stNext.icon+'</button>':"")+
    '</div>'+
  '</div>';
}

function renderOS(el){
  const busca=(el.querySelector("#os-busca")||{value:""}).value?.toLowerCase()||"";
  let lista=DADOS.os.filter(o=>o.status!=="entregue");
  if(_filtroStatus) lista=lista.filter(o=>o.status===_filtroStatus);
  if(_filtroTipo==="retorno") lista=lista.filter(o=>o.status==="retorno");
  else if(_filtroTipo) lista=lista.filter(o=>(o.tipo_servico||"veiculo")===_filtroTipo);
  if(busca){
    lista=lista.filter(o=>{
      const cli=DADOS.clientes.find(c=>c.id===o.cliente_id);
      const vei=DADOS.veiculos.find(v=>v.id===o.veiculo_id);
      const sp=o.especificacoes||{};
      return (numOS(o.numero)+" "+(cli?.nome||"")+" "+(vei?.placa||"")+" "+(sp.placa||"")+" "+(o.descricao||"")+" "+(o.cod_falha||"")).toLowerCase().includes(busca);
    });
  }
  lista.sort((a,b)=>{
    const ua=a.prioridade==="urgente"?0:1;
    const ub=b.prioridade==="urgente"?0:1;
    if(ua!==ub)return ua-ub;
    return new Date(b.created_at||0)-new Date(a.created_at||0);
  });

  const tiposPills=[
    {f:"",label:"Todas",cnt:DADOS.os.filter(o=>o.status!=="entregue").length},
    {f:"veiculo",label:"🚗 Carros",cnt:DADOS.os.filter(o=>(!o.tipo_servico||o.tipo_servico==="veiculo")).length},
    {f:"pecas",label:"📦 Peças",cnt:DADOS.os.filter(o=>o.tipo_servico==="pecas").length},
    {f:"bico",label:"💉 Bico",cnt:DADOS.os.filter(o=>o.tipo_servico==="bico").length},
    {f:"bomba",label:"⚙️ Bomba",cnt:DADOS.os.filter(o=>o.tipo_servico==="bomba").length},
    {f:"kit",label:"🔩 Kit",cnt:DADOS.os.filter(o=>o.tipo_servico==="kit").length},
    {f:"retorno",label:"🔄 Retorno",cnt:DADOS.os.filter(o=>o.status==="retorno").length},
  ].filter(p=>p.f===""||p.cnt>0);

  const statusPills=Object.entries(STATUS).map(([k,s])=>{
    const cnt=DADOS.os.filter(o=>o.status===k).length;
    return cnt?{f:k,label:s.icon+" "+s.label,cnt}:null;
  }).filter(Boolean);

  el.innerHTML=
    '<div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">'+
      '<div style="position:relative;flex:1">'+
        '<span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none">🔍</span>'+
        '<input id="os-busca" placeholder="Cliente, placa, DTC..." style="width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:var(--font);outline:none" oninput="renderOS(document.getElementById(\'conteudo\'))" value="'+esc(busca)+'"/>'+
      '</div>'+
      '<button onclick="_osViewMode=_osViewMode===\'cards\'?\'lista\':\'cards\';renderOS(document.getElementById(\'conteudo\'))" style="padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:16px;cursor:pointer;min-width:40px;min-height:40px">'+(_osViewMode==="cards"?"☰":"⊞")+'</button>'+
    '</div>'+
    '<div class="pills">'+tiposPills.map(p=>'<div class="pill'+(_filtroTipo===p.f?" on":"")+'" onclick="_filtroTipo=\''+p.f+'\';renderOS(document.getElementById(\'conteudo\'))">'+esc(p.label)+' <span style="opacity:.7;font-size:9px">'+p.cnt+'</span></div>').join("")+'</div>'+
    '<div class="pills">'+
      '<div class="pill'+((!_filtroStatus)?" on":"")+'" onclick="_filtroStatus=\'\';renderOS(document.getElementById(\'conteudo\'))">Todos</div>'+
      statusPills.map(p=>'<div class="pill'+(_filtroStatus===p.f?" on":"")+'" onclick="_filtroStatus=\''+p.f+'\';renderOS(document.getElementById(\'conteudo\'))">'+esc(p.label)+'</div>').join("")+
    '</div>'+
    '<div style="font-size:11px;color:var(--t3);margin-bottom:10px">'+lista.length+' OS</div>'+
    (lista.length?
      (_osViewMode==="cards"&&window.innerWidth>=900?
        '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">'+lista.map(o=>osCardHTML(o)).join("")+'</div>':
        lista.map(o=>_osViewMode==="cards"?osCardHTML(o):osRowHTML(o)).join("")
      ):
      '<div class="vazio"><div class="vazio-icon">📋</div><div class="vazio-titulo">Nenhuma OS</div><div class="vazio-sub">'+
        (busca?"Busca: \""+esc(busca)+"\"":_filtroStatus||_filtroTipo?"Tente outro filtro":"Toque em + para criar a primeira OS")+
      '</div></div>');
}

function osCardHTML(o){

// BUSCA GLOBAL
// ══════════════════════════════════════════════════
function toggleBuscaGlobal(){
  const wrap=document.getElementById("busca-global-wrap");
  const input=document.getElementById("busca-global-input");
  const aberto=wrap.style.display==="block";
  if(aberto){
    fecharBuscaGlobal();
  } else {
    wrap.style.display="block";
    document.getElementById("conteudo").style.marginTop="70px";
    setTimeout(()=>input?.focus(),80);
  }
}

function fecharBuscaGlobal(){
  const wrap=document.getElementById("busca-global-wrap");
  wrap.style.display="none";
  document.getElementById("conteudo").style.marginTop="";
  const input=document.getElementById("busca-global-input");
  if(input) input.value="";
  const res=document.getElementById("busca-global-results");
  if(res){res.innerHTML="";res.style.display="none";}
}

function executarBuscaGlobal(q){
  const res=document.getElementById("busca-global-results");
  if(!res)return;
  const termo=(q||"").trim().toLowerCase();
  if(termo.length<2){res.style.display="none";res.innerHTML="";return;}

  const resultados=[];

  // Busca em OS
  DADOS.os.filter(o=>o.status!=="entregue").forEach(o=>{
    const cli=DADOS.clientes.find(c=>c.id===o.cliente_id);
    const specs=o.especificacoes||{};
    const placa=(specs.placa||"").toLowerCase();
    const num=numOS(o.numero).toLowerCase();
    const desc=(o.descricao||"").toLowerCase();
    const nomeC=(cli?.nome||"").toLowerCase();
    const dtc=(o.cod_falha||"").toLowerCase();
    if(num.includes(termo)||desc.includes(termo)||placa.includes(termo)||nomeC.includes(termo)||dtc.includes(termo)){
      const st=STATUS[o.status]||STATUS.recebido;
      resultados.push({
        tipo:"os",id:o.id,
        titulo:numOS(o.numero)+" — "+(cli?.nome||"Sem cliente"),
        sub:(placa?placa.toUpperCase()+" · ":"")+st.icon+" "+st.label,
        cor:st.cor,
        action:`fecharBuscaGlobal();abrirDetalheOS('${o.id}')`,
      });
    }
  });

  // Busca em clientes
  DADOS.clientes.forEach(c=>{
    const nome=(c.nome||"").toLowerCase();
    const tel=(c.telefone||"").replace(/\D/g,"");
    const wpp=(c.whatsapp||"").replace(/\D/g,"");
    const termoNum=termo.replace(/\D/g,"");
    if(nome.includes(termo)||(termoNum&&(tel.includes(termoNum)||wpp.includes(termoNum)))){
      const osC=DADOS.os.filter(o=>o.cliente_id===c.id).length;
      const veics=DADOS.veiculos.filter(v=>v.cliente_id===c.id).map(v=>v.placa).filter(Boolean).join(", ");
      resultados.push({
        tipo:"cliente",id:c.id,
        titulo:c.nome,
        sub:(c.telefone||"")+(veics?" · "+veics:"")+(osC?" · "+osC+" OS":""),
        cor:"#2563eb",
        action:`fecharBuscaGlobal();irPara('clientes');setTimeout(()=>abrirDetalheCliente('${c.id}'),300)`,
      });
    }
  });

  // Busca em veículos pela placa
  DADOS.veiculos.forEach(v=>{
    const placa=(v.placa||"").toLowerCase();
    if(placa.includes(termo)){
      const cli=DADOS.clientes.find(c=>c.id===v.cliente_id);
      if(cli&&!resultados.find(r=>r.tipo==="cliente"&&r.id===cli.id)){
        resultados.push({
          tipo:"cliente",id:cli.id,
          titulo:cli.nome,
          sub:"🚗 "+v.placa.toUpperCase()+(v.modelo?" · "+v.modelo:""),
          cor:"#2563eb",
          action:`fecharBuscaGlobal();irPara('clientes');setTimeout(()=>abrirDetalheCliente('${cli.id}'),300)`,
        });
      }
    }
  });

  if(!resultados.length){
    res.innerHTML=
      '<div style="padding:20px;text-align:center;color:var(--t2)">'+
        '<div style="font-size:24px;margin-bottom:8px">🔍</div>'+
        '<div style="font-size:13px;font-weight:600">Nenhum resultado para "'+esc(q)+'"</div>'+
        '<div style="font-size:11px;color:var(--t3);margin-top:4px">Tente o número da OS, nome do cliente ou placa</div>'+
      '</div>';
    res.style.display="block";
    return;
  }

  // Agrupa por tipo
  const osRes=resultados.filter(r=>r.tipo==="os");
  const cliRes=resultados.filter(r=>r.tipo==="cliente");

  let html="";
  if(osRes.length){
    html+='<div style="padding:8px 14px 4px;font-size:9px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border2)">📋 Ordens de Serviço</div>';
    html+=osRes.slice(0,5).map(r=>
      '<div onclick="'+r.action+'" style="display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border2);transition:background .1s" onmousedown="this.style.background=\'var(--bg)\'" onmouseup="this.style.background=\'\'">'+
        '<div style="width:36px;height:36px;border-radius:9px;background:'+r.cor+'15;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:'+r.cor+'">📋</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t1)">'+esc(r.titulo)+'</div>'+
          '<div style="font-size:11px;color:var(--t2);margin-top:2px">'+esc(r.sub)+'</div>'+
        '</div>'+
        '<span style="color:var(--t3);font-size:14px">›</span>'+
      '</div>'
    ).join("");
  }

  if(cliRes.length){
    html+='<div style="padding:8px 14px 4px;font-size:9px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border2)">👥 Clientes</div>';
    html+=cliRes.slice(0,4).map(r=>
      '<div onclick="'+r.action+'" style="display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border2);transition:background .1s" onmousedown="this.style.background=\'var(--bg)\'" onmouseup="this.style.background=\'\'">'+
        '<div style="width:36px;height:36px;border-radius:50%;background:'+r.cor+'15;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;color:'+r.cor+'">'+esc(r.titulo.charAt(0).toUpperCase())+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t1)">'+esc(r.titulo)+'</div>'+
          '<div style="font-size:11px;color:var(--t2);margin-top:2px">'+esc(r.sub)+'</div>'+
        '</div>'+
        '<span style="color:var(--t3);font-size:14px">›</span>'+
      '</div>'
    ).join("");
  }

  const total=resultados.length;
  if(total>9){
    html+='<div style="padding:10px 14px;font-size:11px;color:var(--t3);text-align:center">+${total-9} resultados — refine a busca</div>';
  }

  res.innerHTML=html;
  res.style.display="block";
}

// Esc fecha busca
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") fecharBuscaGlobal();
  if((e.key==="/"||e.key==="k"&&(e.metaKey||e.ctrlKey))&&!e.target.matches("input,textarea")){
    e.preventDefault();toggleBuscaGlobal();
  }
});

  const btn=Array.from(document.querySelectorAll("button")).find(b=>b.textContent.includes("Salvar alterações"));
  if(btn){btn.disabled=true;btn.textContent="Salvando...";}

async function salvarSaidaEstoque(prodId,prodNome){
  const qtd=Number(document.getElementById("sai-qtd")?.value||0);
  if(!qtd||qtd<=0){toast("Informe a quantidade.","erro");return;}
  const btn=Array.from(document.querySelectorAll("button")).find(b=>b.textContent.includes("Confirmar saída"));
  if(btn){btn.disabled=true;btn.textContent="Salvando...";}
  try{
    const p=DADOS.produtos.find(x=>x.id===prodId);
    const atual=Number(p?.estoque_atual||0);
    if(qtd>atual){toast("Estoque insuficiente ("+atual+" disponível).","erro");if(btn){btn.disabled=false;btn.textContent="📤 Confirmar saída";}return;}
    await sbPatch("produtos","id=eq."+prodId,{estoque_atual:atual-qtd});
    if(p) p.estoque_atual=atual-qtd;
    toast("✅ Saída registrada — "+prodNome);

    renderEstoque(document.getElementById("conteudo"));

}

// ══════════════════════════════════════════════════
// AUTO-REFRESH + PULL-TO-REFRESH
// ══════════════════════════════════════════════════
function startRefresh(){
  stopRefresh();
  _refreshTimer=setInterval(async()=>{
    if(!SESSION||document.hidden||!navigator.onLine)return;
    // só atualiza se não há modal aberto e usuário não está digitando
    const modalAberto=document.getElementById("modal-root")?.children.length>0;
    const overlayAberto=document.querySelector("div[style*='z-index:400']");
    const digitando=["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName);
    if(modalAberto||overlayAberto||digitando)return;
    try{
      const[os,clis]=await Promise.all([
        sbGet("ordens_servico","select=*&order=numero.desc"),
        sbGet("clientes","select=*&order=nome"),
      ]);
      if(Array.isArray(os)) DADOS.os=os;
      if(Array.isArray(clis)) DADOS.clientes=clis;
      renderizar();
      // Badge cotações pendentes
      atualizarBadgeCotacoes();
    }catch{}
  },60000);
}
function stopRefresh(){clearInterval(_refreshTimer);}
document.addEventListener("visibilitychange",()=>document.hidden?stopRefresh():SESSION&&startRefresh());
window.addEventListener("online",()=>{setSyncStatus("ok");if(SESSION)carregarDados();});
window.addEventListener("offline",()=>setSyncStatus("erro"));

// Pull-to-refresh
let _sy=0,_ptr=false,_ptrEl=null;
document.addEventListener("touchstart",e=>{if(window.scrollY===0)_sy=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchmove",e=>{
  const dy=e.touches[0].clientY-_sy;
  if(dy>55&&window.scrollY===0&&!_ptrEl){
    _ptr=true;_ptrEl=document.createElement("div");
    _ptrEl.style.cssText="position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;border-radius:50px;padding:7px 16px;font-size:12px;font-weight:700;z-index:9999;pointer-events:none;box-shadow:0 3px 12px rgba(196,26,26,.4)";
    _ptrEl.textContent="⟳ Solte para atualizar";
    document.body.appendChild(_ptrEl);
  }
},{passive:true});
document.addEventListener("touchend",()=>{
  if(_ptr){carregarDados();toast("Atualizando...");}
  if(_ptrEl){_ptrEl.remove();_ptrEl=null;}_ptr=false;
});

async function atualizarBadgeCotacoes(){
  try{
    const itens=await sbGet("os_itens","status=eq.pendente&select=id");
    const n=(itens||[]).length;
    // Atualiza badge na sidebar
    let badge=document.getElementById("badge-cotacoes");
    const sbItem=document.querySelector('[onclick*="cotacao"]');
    if(sbItem&&n>0){
      if(!badge){
        badge=document.createElement("span");
        badge.id="badge-cotacoes";
        badge.style.cssText="margin-left:auto;background:var(--acc);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center";
        sbItem.appendChild(badge);
      }
      badge.textContent=n;
    } else if(badge){

function sugerirPeca(q){
  const dd=document.getElementById("peca-sugestoes");
  if(!dd)return;
  if(!q||q.length<2){dd.style.display="none";return;}
  const res=DADOS.produtos.filter(p=>
    (p.codigo||"").toLowerCase().includes(q.toLowerCase())||
    (p.nome||"").toLowerCase().includes(q.toLowerCase())
  ).slice(0,6);
  if(!res.length){dd.style.display="none";return;}
  dd.innerHTML=res.map(p=>
    '<div onclick="selecionarPeca(\''+esc(p.codigo||"")+'\',\''+esc(p.nome||"")+'\',\''+Number(p.preco_venda||0)+'\')" '+
    'style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between">'+
      '<div>'+
        '<div style="font-size:13px;font-weight:700">'+esc(p.nome)+'</div>'+
        '<div style="font-size:11px;color:var(--t2)">'+(p.codigo?"Cód: "+esc(p.codigo)+" · ":"")+R$(p.preco_venda||0)+' · Estq: '+( p.estoque_atual||0)+'</div>'+
      '</div>'+
      '<span style="font-size:12px;font-weight:700;color:var(--acc)">'+R$(p.preco_venda||0)+'</span>'+
    '</div>'
  ).join("");
  dd.style.display="block";
}

function selecionarPeca(cod,nome,val){
  const ref=document.getElementById("peca-ref");
  const desc=document.getElementById("peca-desc");
  const valEl=document.getElementById("peca-val");
  const dd=document.getElementById("peca-sugestoes");
  if(ref) ref.value=cod;
  if(desc) desc.value=nome;
  if(valEl) valEl.value=val;
  if(dd) dd.style.display="none";
  // Dispara cálculo de total
  document.getElementById("peca-val")?.dispatchEvent(new Event("input"));
}

async function salvarItemOS(osId){
  const ref=(document.getElementById("peca-ref")?.value||"").trim();
  const desc=(document.getElementById("peca-desc")?.value||"").trim();
  const qtd=Number(document.getElementById("peca-qtd")?.value||1);
  const val=Number(document.getElementById("peca-val")?.value||0);

  if(!desc&&!ref){toast("Informe a referência ou descrição da peça.","erro");return;}
  if(val<=0){toast("Informe o valor unitário.","erro");return;}

  const btn=document.querySelector("#modal-root ~ * button, div[style*=fixed] button");
  const salvarBtn=Array.from(document.querySelectorAll("button")).find(b=>b.textContent.includes("Adicionar à OS"));
  if(salvarBtn){salvarBtn.disabled=true;salvarBtn.textContent="Salvando...";}

  try{
    await sbPost("os_itens",{
      os_id:osId,
      referencia:ref||null,
      descricao:desc||ref,
      quantidade:qtd,
      valor_unit:val,
      valor_total:qtd*val,
      tipo:"peca",
    });

    // Recalcula valor_total da OS
    const o=DADOS.os.find(x=>x.id===osId);
    if(o){
      const itens=await sbGet("os_itens","os_id=eq."+osId+"&select=valor_total");
      const somaItens=(itens||[]).reduce((s,i)=>s+Number(i.valor_total||0),0);
      const novoTotal=Number(o.valor_mo||0)+somaItens;
      await sbPatch("ordens_servico","id=eq."+osId,{valor_total:novoTotal});
      o.valor_total=novoTotal;
    }

    toast("✅ "+(desc||ref)+" adicionado!");
    // Fecha overlay e recarrega itens
    document.querySelector("div[style*='position:fixed'][style*='z-index:400']")?.remove();
    carregarItensOS(osId);
    renderizar();
  }catch(e){
    toast("Erro: "+e.message,"erro");
    if(salvarBtn){salvarBtn.disabled=false;salvarBtn.textContent="✅ Adicionar à OS";}
  }
}

async function removerItemOS(itemId, osId){
  if(!confirm("Remover este item?"))return;
  try{
    await sbDelete("os_itens","id=eq."+itemId);
    // Recalcula total
    const o=DADOS.os.find(x=>x.id===osId);
    if(o){
      const itens=await sbGet("os_itens","os_id=eq."+osId+"&select=valor_total");
      const somaItens=(itens||[]).reduce((s,i)=>s+Number(i.valor_total||0),0);
      const novoTotal=Number(o.valor_mo||0)+somaItens;
      await sbPatch("ordens_servico","id=eq."+osId,{valor_total:novoTotal});
      o.valor_total=novoTotal;
    }
    toast("Item removido.");
    carregarItensOS(osId);
    renderizar();
  }catch(e){toast("Erro: "+e.message,"erro");}
}

async function avancarStatus(id,novoStatus){
  haptic(20);
  const o=DADOS.os.find(x=>x.id===id);if(!o)return;
  const hist=(Array.isArray(o.historico)?o.historico:[]).concat([{data:agora(),acao:"→ "+(STATUS[novoStatus]?.label||novoStatus),user:SESSION?.nome||"—"}]);
  try{
    await sbPatch("ordens_servico","id=eq."+id,{status:novoStatus,historico:hist});
    o.status=novoStatus;o.historico=hist;
    toast((STATUS[novoStatus]?.icon||"✅")+" "+(STATUS[novoStatus]?.label||novoStatus));
    // Notificação automática no mural ao finalizar
    if(novoStatus==="finalizado"){
      const cli=DADOS.clientes.find(c=>c.id===o.cliente_id);
      const specs=o.especificacoes||{};
      const placa=specs.placa||"";
      sbPost("mural",{
        texto:"✅ OS "+numOS(o.numero)+" pronta para entrega"+(cli?" — "+cli.nome:"")+(placa?" · "+placa:""),
        categoria:"aviso",autor:SESSION?.nome||"Sistema",
        reacoes:{},resolvido:false,
      }).catch(()=>{});
    }
    renderizar();
  }catch(e){toast("Erro: "+e.message,"erro");}
}

async function confirmarExcluirOS(id){
  const o=DADOS.os.find(x=>x.id===id);if(!o)return;
  const cli=DADOS.clientes.find(c=>c.id===o.cliente_id);
  if(!confirm("Excluir "+numOS(o.numero)+" — "+( cli?.nome||"Sem cliente")+"?\nEsta ação não pode ser desfeita."))return;
  try{
    await sbDelete("os_itens","os_id=eq."+id).catch(()=>{});
    await sbDelete("lancamentos","os_id=eq."+id).catch(()=>{});
    await sbDelete("ordens_servico","id=eq."+id);
    DADOS.os=DADOS.os.filter(x=>x.id!==id);
    toast("OS excluída.");fecharModal();renderizar();
  }catch(e){toast("Erro: "+e.message,"erro");}
}

function addFotoNovOS(input){
  const files=Array.from(input.files||[]);
  if(!files.length)return;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas");
        const max=600,r=Math.min(max/img.width,max/img.height,1);
        c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        const data=c.toDataURL("image/jpeg",.72);
        novaOSFotos.push({url:data,tag:"Check-in",data:agora()});
        renderFotosNovOS();
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
  input.value="";
}

function renderFotosNovOS(){
  const grid=document.getElementById("nos-foto-grid");
  const ph=document.getElementById("nos-foto-ph");
  const area=document.getElementById("nos-foto-area");
  if(!grid)return;
  // thumbs
  grid.innerHTML=novaOSFotos.map((f,i)=>
    '<div class="foto-thumb">'+
      '<img src="'+f.url+'" loading="lazy"/>'+
      '<button class="foto-thumb-del" onclick="remFotoNovOS('+i+')">✕</button>'+
    '</div>'
  ).join("");
  if(ph) ph.style.display=novaOSFotos.length?"none":"flex";
  if(area){
    area.style.borderColor=novaOSFotos.length?"#16a34a":"var(--border)";
    if(novaOSFotos.length){area.style.height="auto";area.style.minHeight="0";area.style.cursor="default";}
  }
}

function remFotoNovOS(idx){novaOSFotos.splice(idx,1);renderFotosNovOS();}

function buscarCliNovOS(q){
  const dd=document.getElementById("nos-cli-dd");
  if(!dd)return;
  // Esconde badge de selecionado ao digitar
  const sel=document.getElementById("nos-cli-sel");
  if(sel&&q) sel.style.display="none";
  if(!q||q.length<1){dd.style.display="none";return;}
  const res=DADOS.clientes.filter(c=>c.nome.toLowerCase().includes(q.toLowerCase())||(c.telefone||"").includes(q)).slice(0,8);
  if(!res.length){
    dd.innerHTML='<div style="padding:12px 14px;font-size:12px;color:var(--t2);text-align:center">Nenhum cliente encontrado<br><span style="color:var(--acc);font-weight:700">Toque em + para cadastrar</span></div>';
    dd.style.display="block";return;
  }
  dd.innerHTML=res.map(c=>{
    const veics=DADOS.veiculos.filter(v=>v.cliente_id===c.id);
    return '<div onclick="selCliNovOS(\''+c.id+'\',\''+esc(c.nome)+'\')" style="padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border2);active:background:#f8f9fb">'+
      '<div style="font-size:13px;font-weight:700">'+esc(c.nome)+'</div>'+
      '<div style="font-size:11px;color:var(--t2);margin-top:2px">'+
        (c.telefone?'📞 '+c.telefone:'')+
        (veics.length?' · 🚗 '+veics.map(v=>v.placa||v.modelo).filter(Boolean).join(", "):"")+'</div>'+
    '</div>';
  }).join("");
  dd.style.display="block";
}

async function criarCliInline(){
  const nome=(document.getElementById("nc-nome")?.value||"").trim();
  if(!nome){toast("Digite o nome do cliente.","erro");return;}
  const btn=document.querySelector("#painel-novo-cli button:last-child");
  if(btn){btn.disabled=true;btn.textContent="Salvando...";}
  try{
    const rows=await sbPost("clientes",{
      nome,
      telefone:document.getElementById("nc-tel")?.value||"",
      whatsapp:document.getElementById("nc-wpp")?.value||"",
    });
    const novo=Array.isArray(rows)?rows[0]:rows;
    if(novo?.id){
      DADOS.clientes.unshift(novo);
      selCliNovOS(novo.id,novo.nome);
      toast("✅ "+nome+" cadastrado!");
    }
    const painel=document.getElementById("painel-novo-cli");
    if(painel) painel.style.display="none";
  }catch(e){
    toast("Erro: "+e.message,"erro");
    if(btn){btn.disabled=false;btn.textContent="💾 Criar e selecionar";}
  }
}


function buscaPlacaNovOS(placa){
  const p=placa.replace(/[^A-Z0-9]/g,"");
  if(p.length<6)return;
  const vei=DADOS.veiculos.find(v=>(v.placa||"").replace(/[^A-Z0-9]/g,"")=== p);
  if(vei){
    const m=document.getElementById("nos-modelo");
    if(m&&vei.modelo) m.value=vei.modelo+(vei.ano?" "+vei.ano:"");
    const cli=DADOS.clientes.find(c=>c.id===vei.cliente_id);
    if(cli&&!document.getElementById("nos-cli-id").value) selCliNovOS(cli.id,cli.nome);
    toast("🚗 "+( vei.modelo||"Veículo")+" encontrado");
    return;
  }
  const match=DADOS.os.find(o=>((o.especificacoes||{}).placa||"").replace(/[^A-Z0-9]/g,"")=== p);
  if(match){
    const sp=match.especificacoes||{};
    const m=document.getElementById("nos-modelo");
    if(m&&sp.modelo) m.value=sp.modelo+(sp.ano?" "+sp.ano:"");
    const cli=DADOS.clientes.find(c=>c.id===match.cliente_id);
    if(cli&&!document.getElementById("nos-cli-id").value) selCliNovOS(cli.id,cli.nome);
    toast("🚗 "+cli?.nome+" (histórico)");
  }
}

async function salvarNovOS(){
  const desc=(document.getElementById("nos-desc")?.value||"").trim();
  if(!desc){toast("Descreva o problema ou serviço.","erro");return;}
  const btn=document.querySelector("#modal-root .btn-p");
  if(btn){btn.disabled=true;btn.textContent="Salvando...";}
  try{
    const specs={};
    const placa=(document.getElementById("nos-placa")?.value||"").trim();
    const modelo=(document.getElementById("nos-modelo")?.value||"").trim();
    const km=document.getElementById("nos-km")?.value||"";
    if(placa) specs.placa=placa;
    if(modelo) specs.modelo=modelo;
    if(km) specs.km=km;

    const setorId=document.getElementById("nos-setor")?.value||"";
    const cliId=document.getElementById("nos-cli-id")?.value||"";

    const corpo={
      descricao:desc,
      especificacoes:specs,
      fotos:novaOSFotos,
      status:"recebido",
      tipo_servico:document.getElementById("nos-tipo")?.value||"veiculo",
      prioridade:document.getElementById("nos-pri")?.value||"media",
      tecnico:SESSION?.nome||"—",
      historico:[{data:agora(),acao:"OS criada",user:SESSION?.nome||"—"}],
      data_entrada:hoje(),
      valor_mo:0,
      valor_total:0,
    };
    if(cliId) corpo.cliente_id=cliId;
    if(setorId) corpo.setor_id=setorId;
    if(km) corpo.km_entrada=Number(km);

    await sbPost("ordens_servico",corpo);
    haptic([30,50,20]);
    toast("✅ OS aberta com sucesso!");
    novaOSFotos=[];
    fecharModal();
    await carregarDados();
  }catch(e){
    toast("Erro ao salvar: "+e.message,"erro");
    if(btn){btn.disabled=false;btn.textContent="⚡ Abrir OS";}
  }
}

async function toggleStatusLanc(id, statusAtual){

async function salvarLancamento(){
  const desc=(document.getElementById("lanc-desc")?.value||"").trim();
  const val=Number(document.getElementById("lanc-val")?.value||0);
  if(!desc){toast("Informe a descrição.","erro");return;}
  if(!val||val<=0){toast("Informe o valor.","erro");return;}
  const btn=Array.from(document.querySelectorAll("button")).find(b=>b.textContent.includes("Salvar"));
  if(btn){btn.disabled=true;btn.textContent="Salvando...";}
  try{
    const osId=document.getElementById("lanc-os")?.value||"";
    const corpo={
      descricao:desc,
      valor:val,
      tipo:document.getElementById("lanc-tipo")?.value||"receita",
      status:document.getElementById("lanc-status")?.value||"pago",
      categoria:document.getElementById("lanc-cat")?.value||"",
      data:hoje(),
    };
    if(osId) corpo.os_id=osId;
    const rows=await sbPost("lancamentos",corpo);
    DADOS.lancamentos.unshift(Array.isArray(rows)?rows[0]:rows);
    toast("✅ Lançamento salvo!");
    document.querySelector("div[style*='position:fixed'][style*='z-index:400']")?.remove();
    renderFinanceiro(document.getElementById("conteudo"));
  }catch(e){
    toast("Erro: "+e.message,"erro");
    if(btn){btn.disabled=false;btn.textContent="💾 Salvar";}
  }
}

async function salvarEntradaEstoque(prodId, prodNome){
  const qtd=Number(document.getElementById("ent-qtd")?.value||0);
  if(!qtd||qtd<=0){toast("Informe a quantidade.","erro");return;}
  const btn=Array.from(document.querySelectorAll("button")).find(b=>b.textContent.includes("Confirmar"));
  if(btn){btn.disabled=true;btn.textContent="Salvando...";}
  try{
    const p=DADOS.produtos.find(x=>x.id===prodId);
    const novoEstq=Number(p?.estoque_atual||0)+qtd;
    await sbPatch("produtos","id=eq."+prodId,{estoque_atual:novoEstq});
    if(p) p.estoque_atual=novoEstq;
    // Lança no financeiro se informou valor
    const val=Number(document.getElementById("ent-val")?.value||0);
    const obs=document.getElementById("ent-obs")?.value||"";
    if(val>0){
      await sbPost("lancamentos",{
        descricao:"Compra: "+prodNome+(obs?" — "+obs:""),
        valor:val*qtd, tipo:"despesa", status:"pago",
        categoria:"Peças", data:hoje(),
      }).catch(()=>{});
    }
    toast("✅ +"+qtd+" "+prodNome);
    document.querySelector("div[style*='position:fixed'][style*='z-index:400']")?.remove();
    renderEstoque(document.getElementById("conteudo"));
  }catch(e){
    toast("Erro: "+e.message,"erro");
    if(btn){btn.disabled=false;btn.textContent="✅ Confirmar Entrada";}
  }
}
