          <input type="file" id="perfil-foto-input" accept="image/*" style="display:none" onchange="salvarFotoPerfil(this)"/>

    </div>`;

async function salvarFotoPerfil(input){
  const file=input.files[0];if(!file||!SESSION?.id)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=async()=>{
      const canvas=document.createElement("canvas");
      const max=120,r=Math.min(max/img.width,max/img.height,1);
      canvas.width=Math.round(img.width*r);canvas.height=Math.round(img.height*r);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      const data=canvas.toDataURL("image/jpeg",.65);
      try{
        await sbPatch("usuarios",`id=eq.${SESSION.id}`,{foto:data});
        showToast("✅ Foto atualizada!");
        await loadAll();
        openMeuPerfil();
        // atualiza ícone no topbar
        const btn=document.getElementById("btn-perfil");
        if(btn) btn.style.backgroundImage=`url(${data})`;
      }catch(e){showToast("Erro: "+e.message,"error");}
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

async function salvarMeuPerfil(){
  const p1=document.getElementById("perfil-pass1")?.value;
  const p2=document.getElementById("perfil-pass2")?.value;
  if(!p1&&!p2){closeModal();return;}
  if(!p1||p1.length<4){showToast("Senha deve ter pelo menos 4 caracteres.","error");return;}
  if(p1!==p2){showToast("Senhas não coincidem.","error");return;}
  try{
    const h=await hashSenha(p1).catch(()=>p1);
    await sbPatch("usuarios",`id=eq.${SESSION.id}`,{senha:h});
    showToast("✅ Senha alterada!");
    closeModal();
  }catch(e){showToast("Erro: "+e.message,"error");}
}

function saveWppConfig(){
  const url=document.getElementById("wpp-url")?.value.trim();
  const token=document.getElementById("wpp-token")?.value.trim();
  localStorage.setItem("maxx-wpp-config",JSON.stringify({url,token}));
  showToast(url?"✅ WhatsApp configurado!":"Configuração removida.");
  renderDesign(document.getElementById("content"));
}

function setThemeMode(mode){
  if(mode==="light") document.body.classList.add("theme-light");
  else document.body.classList.remove("theme-light");
  localStorage.setItem("maxx_theme_mode",mode);
  renderDesign(document.getElementById("content"));
}

function setAccentColor(cor){
  document.documentElement.style.setProperty("--accent",cor);
  // accent2 = darkened version
  document.documentElement.style.setProperty("--accent2",cor);
  localStorage.setItem("maxx_accent",cor);
  renderDesign(document.getElementById("content"));
}

(()=>{

    btn.style.background=sel?(s?s.cor+"25":"var(--bg-elevated)"):(s?s.cor+"10":"var(--bg-elevated)");

  });

}

function coletarEspecificacoes(){

  if(tipo==="veiculo") return {
    modelo:get("spec-modelo"),ano:get("spec-ano"),motor:get("spec-motor"),
    combustivel:get("spec-combustivel"),placa:get("spec-placa"),km:get("f-km"),dtc:get("f-dtc")
  };
  if(tipo==="pecas") return {
    tipo_peca:get("spec-tipo-peca"),quantidade:get("spec-qty"),referencia:get("spec-ref"),
    aplicacao:get("spec-aplicacao"),marca:get("spec-marca"),condicao:get("spec-condicao")
  };
  if(tipo==="bico") return {
    tipo_bico:get("spec-tipo-bico"),quantidade:get("spec-qty"),referencia:get("spec-ref"),
    aplicacao:get("spec-aplicacao"),pressao:get("spec-pressao"),marca:get("spec-marca"),
    problema:get("spec-problema")
  };
  if(tipo==="kit") return {
    aplicacao:get("spec-aplicacao"),pressao:get("spec-pressao"),
    marca:get("spec-marca"),problema:get("spec-problema"),
    bico:{
      tipo:get("spec-tipo-bico"),quantidade:get("spec-qty-bico"),
      referencia:get("spec-ref-bico")
    },
    bomba:{
      tipo:get("spec-tipo-bomba"),cilindros:get("spec-cil-bomba"),
      referencia:get("spec-ref-bomba")
    }
  };
  if(tipo==="bomba") return {
    tipo_bomba:get("spec-tipo-bomba"),cilindros:get("spec-cil-bomba"),referencia:get("spec-ref"),
    aplicacao:get("spec-aplicacao"),pressao:get("spec-pressao"),marca:get("spec-marca"),
    problema:get("spec-problema")
  };
  return {};
}

                const naGarantia=diasDesde!==null&&diasDesde<=90;
                return `<label style="cursor:pointer">
                  <input type="radio" name="os-origem" value="${os2.id}" style="display:none" onchange="verificarGarantiaRetorno('${os2.id}')"/>

      </div>

}

function verificarGarantiaRetorno(osOrigId){
  document.getElementById("retorno-origem-id").value=osOrigId;
  const osOrig=DATA.os.find(x=>x.id===osOrigId);
  const el=document.getElementById("garantia-status");
  if(!osOrig||!el) return;
  const dataRef=osOrig.data_entrega||osOrig.created_at?.split("T")[0];
  if(!dataRef){el.style.display="none";return;}
  const dias=Math.floor((Date.now()-new Date(dataRef))/(1000*60*60*24));
  const naGarantia=dias<=90;
  el.style.display="block";
  el.innerHTML=`
    <div style="padding:12px 14px;border-radius:10px;background:${naGarantia?"#f0fdf4":"#fff7ed"};border:1px solid ${naGarantia?"#86efac":"#fcd34d"}">
      <div style="font-size:13px;font-weight:700;color:${naGarantia?"#16a34a":"#d97706"};margin-bottom:4px">
        ${naGarantia?"🛡️ Dentro da garantia":"⏰ Fora do prazo de garantia"}
      </div>
      <div style="font-size:12px;color:${naGarantia?"#15803d":"#92400e"}">
        ${naGarantia
          ?`Serviço entregue há <strong>${dias} dias</strong>. Garantia válida por 90 dias — <strong>${90-dias} dias restantes</strong>.`
          :`Serviço entregue há <strong>${dias} dias</strong>. Prazo de garantia (90 dias) expirado há ${dias-90} dias.`
        }
      </div>
    </div>`;
  // auto-seleciona responsabilidade
  if(naGarantia){
    document.getElementById("resp-garantia").checked=true;
    atualizarRespVisual();
  }
}

function atualizarRespVisual(){
  const sel=document.querySelector("input[name='retorno-resp']:checked")?.value;
  document.querySelectorAll(".resp-opt").forEach((el,i)=>{
    const vals=["garantia","novo_problema","uso_indevido"];
    const isS=vals[i]===sel;
    el.style.borderColor=isS?"var(--accent)":"var(--border)";
    el.style.background=isS?"var(--accent-tint)":"var(--bg-elevated)";
    el.style.color=isS?"var(--accent)":"var(--text-secondary)";
  });
}

async function salvarRetorno(osId){
  const motivo=document.getElementById("retorno-motivo").value.trim();
  const origemId=document.getElementById("retorno-origem-id").value;
  const resp=document.querySelector("input[name='retorno-resp']:checked")?.value||"garantia";
  if(!motivo){showToast("Descreva o motivo do retorno.","error");return;}
  const o=DATA.os.find(x=>x.id===osId);if(!o)return;
  const hist=[...(Array.isArray(o.historico)?o.historico:[]),
    {data:nowStr(),acao:`🔄 Retorno registrado — ${resp==="garantia"?"Em garantia":resp==="novo_problema"?"Novo problema":"Uso indevido"}. Motivo: ${motivo}`,user:SESSION?.nome||""}];
  try{
    await sbPatch("ordens_servico",`id=eq.${osId}`,{
      status:"retorno",
      os_origem_id:origemId||null,
      retorno_motivo:motivo,
      retorno_responsabilidade:resp,
      retorno_data:today(),
      historico:hist
    });
    showToast("🔄 Retorno registrado!");
    closeModal();await loadAll();
  }catch(e){showToast("Erro: "+e.message,"error");}
}

function confirmarExcluirOS(id){
  if(!perm("excluirOS")){showToast("Sem permissão para excluir OS.","error");return;}
  const o=DATA.os.find(x=>x.id===id);if(!o)return;
  const cli=DATA.clientes.find(c=>c.id===o.cliente_id);
  // modal de confirmação com dupla checagem
  document.getElementById("modal-root").innerHTML=`
    <div class="overlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:380px">
        <div style="text-align:center;padding:8px 0 16px">
          <div style="font-size:40px;margin-bottom:10px">🗑️</div>
          <div style="font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:6px">Excluir OS ${numOS(o.numero)}?</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px">${esc(cli?.nome||"Sem cliente")}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">${esc((o.descricao||"").slice(0,60))}</div>
          <div style="background:#fff1f1;border:1px solid #fecaca;border-radius:10px;padding:10px 14px;font-size:12px;color:#dc2626;margin-bottom:18px;text-align:left">
            ⚠️ Esta ação é <strong>permanente</strong> e não pode ser desfeita. Todos os itens, cotações e histórico desta OS serão apagados.
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancelar</button>
            <button style="flex:1;padding:10px;background:#dc2626;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer" onclick="excluirOS('${id}')">Sim, excluir</button>
          </div>
        </div>
      </div>
    </div>`;
}

async function excluirOS(id){
  try{
    // remove itens relacionados primeiro
    const o=DATA.os.find(x=>x.id===id);
    await deletarFotosStorage(o?.fotos).catch(()=>{});
    await sbDelete("os_itens",`os_id=eq.${id}`).catch(()=>{});
    await sbDelete("lancamentos",`os_id=eq.${id}`).catch(()=>{});
    await sbDelete("ordens_servico",`id=eq.${id}`);
    showToast("OS excluída.");
    closeModal();
    await loadAll();
    gotoPage("os");
  }catch(e){showToast("Erro ao excluir: "+e.message,"error");}
}

const MURAL_CATS=[

let MURAL_DATA=[];

async function loadMural(){
  try{

function openNovaMural(){
  document.getElementById("modal-root").innerHTML=`
    <div class="overlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:460px">
        <div class="modal-hd">
          <div><div class="modal-title">📌 Nova mensagem</div></div>
          <button class="modal-x" onclick="closeModal()">✕</button>
        </div>
        <div style="margin-bottom:12px">
          <div class="flabel">Categoria</div>
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            ${MURAL_CATS.map((cat,i)=>`
              <button type="button" class="mural-cat-btn" data-cat="${cat.id}"
                onclick="selecionarCatMural('${cat.id}')"

function selecionarCatMural(catId){
  document.getElementById("mural-cat").value=catId;
  document.querySelectorAll(".mural-cat-btn").forEach(btn=>{
    const cat=MURAL_CATS.find(x=>x.id===btn.dataset.cat);
    const sel=btn.dataset.cat===catId;
    btn.style.borderColor=sel?cat.cor:"var(--border)";
    btn.style.background=sel?cat.cor+"15":"var(--bg-elevated)";
    btn.style.color=sel?cat.cor:"var(--text-secondary)";
  });
}

async function salvarMural(){
  const texto=document.getElementById("mural-texto").value.trim();
  const cat=document.getElementById("mural-cat").value;
  if(!texto){showToast("Digite uma mensagem.","error");return;}
  try{
    await sbPost("mural",{
      texto,categoria:cat,
      autor:SESSION?.nome||"Usuário",
      autor_id:SESSION?.id||null,
      reacoes:{},resolvido:false
    });
    showToast("✅ Publicado!");
    closeModal();await loadMural();
    renderMural(document.getElementById("content"));
  }catch(e){showToast("Erro: "+e.message,"error");}
}

async function reagirMural(id,emoji){
  const m=MURAL_DATA.find(x=>x.id===id);if(!m)return;
  const reacoes={...(m.reacoes||{})};
  reacoes[emoji]=(reacoes[emoji]||0)+1;
  try{
    await sbPatch("mural",`id=eq.${id}`,{reacoes});
    m.reacoes=reacoes;
    renderMural(document.getElementById("content"));
  }catch(e){showToast("Erro: "+e.message,"error");}
}

async function resolverMural(id){
  try{
    await sbPatch("mural",`id=eq.${id}`,{resolvido:true});
    const m=MURAL_DATA.find(x=>x.id===id);if(m) m.resolvido=true;
    showToast("✅ Marcado como resolvido!");
    renderMural(document.getElementById("content"));
  }catch(e){showToast("Erro: "+e.message,"error");}
}

async function excluirMural(id){
  if(!confirm("Excluir esta mensagem?"))return;
  try{
    await sbDelete("mural",`id=eq.${id}`);
    MURAL_DATA=MURAL_DATA.filter(x=>x.id!==id);
    showToast("Mensagem excluída.");
    renderMural(document.getElementById("content"));
  }catch(e){showToast("Erro: "+e.message,"error");}
}

// ── HELPERS ───────────────────────────────────────────────────────
function _wizCheckinFoto(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      const max=900;
      const ratio=Math.min(max/img.width,max/img.height,1);
      canvas.width=Math.round(img.width*ratio);
      canvas.height=Math.round(img.height*ratio);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      _wizData.checkin_data=canvas.toDataURL("image/jpeg",.78);
      _wizRender();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function _wizBuscaCli(val){
  const dd=document.getElementById("wiz-cli-dd");
  if(!val||val.length<1){dd.style.display="none";return;}
  const q=val.toLowerCase();
  const matches=DATA.clientes.filter(c=>(c.nome+" "+(c.telefone||"")).toLowerCase().includes(q)).slice(0,6);
  if(!matches.length){dd.style.display="none";return;}
  dd.innerHTML=matches.map(cl=>`
    <div onclick="_wizSelCli('${cl.id}','${esc(cl.nome)}','${esc(cl.telefone||"")}')"
      style="padding:10px 14px;cursor:pointer;font-size:13px;font-weight:700;
      border-bottom:1px solid var(--border);transition:background .1s"
      onmouseover="this.style.background='var(--bg-elevated)'"
      onmouseout="this.style.background=''">
      ${esc(cl.nome)}
      <span style="font-size:11px;color:var(--text-muted);margin-left:6px;font-weight:400">${esc(cl.telefone||"")}</span>
    </div>`).join("");
  dd.style.display="block";
}
function _wizSelCli(id,nome,tel){
  _wizData.cli_id=id; _wizData.cli_nome=nome; _wizData.cli_tel=tel; _wizRender();
}

// cadastra o cliente na hora (confirmação explícita), em vez de criar silenciosamente ao salvar a OS
async function _wizCadastrarCliente(){
  const nome=(document.getElementById("nc-nome")?.value||"").trim();
  const tel=(document.getElementById("nc-tel")?.value||"").trim();
  const wpp=(document.getElementById("nc-wpp")?.value||"").trim();
  if(!nome){showToast("Informe o nome do cliente.","error");return;}
  const btn=document.getElementById("nc-btn-cadastrar");
  if(btn){btn.disabled=true;btn.textContent="⏳ Cadastrando...";}
  try{
    const res=await sbPost("clientes",{nome,telefone:tel,whatsapp:wpp});
    const novo=(Array.isArray(res)?res[0]:res);
    if(!novo?.id) throw new Error("Não foi possível cadastrar.");
    await loadAll();
    _wizData.cli_id=novo.id; _wizData.cli_nome=nome; _wizData.cli_tel=tel;
    showToast("✅ Cliente cadastrado!");
    _wizRender();
  }catch(e){
    showToast("Erro: "+e.message,"error");
    if(btn){btn.disabled=false;btn.textContent="✅ Cadastrar cliente";}
  }
}
function _wizOCR(){
  document.getElementById("ocr-input")?.click();
}
function _wizProcessOCR(input){
  const file=input.files[0]; if(!file)return;
  const st=document.getElementById("ocr-status");
  if(st){st.textContent="⏳ Lendo placa...";st.style.color="var(--text-muted)";}
  const loadTess=()=>new Promise((res,rej)=>{
    if(window.Tesseract){res(window.Tesseract);return;}
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload=()=>res(window.Tesseract); s.onerror=rej;
    document.head.appendChild(s);
  });
  loadTess().then(async T=>{
    try{
      const {data:{text}}=await T.recognize(file,"por",{tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"});
      const clean=text.replace(/[^A-Z0-9]/gi,"").toUpperCase();
      const match=clean.match(/[A-Z]{3}[0-9]{1}[A-Z0-9]{1}[0-9]{2}|[A-Z]{3}[0-9]{4}/);
      const placa=match?match[0]:clean.slice(0,7);
      if(placa.length>=6){
        _wizData.placa=placa;
        const el=document.getElementById("wiz-placa");
        if(el)el.value=placa;
        if(st){st.textContent="✅ Placa: "+placa;st.style.color="var(--success)";}
        // Busca veículo
        const rows=await sbGet("veiculos","placa=ilike."+placa+"&select=*,clientes(*)&limit=1").catch(()=>[]);
        if(rows?.[0]){
          const v=rows[0];
          _wizData.veiculo_id=v.id;
          _wizData.modelo=_wizData.modelo||v.modelo||"";
          if(v.clientes&&!_wizData.cli_id){
            _wizData.cli_id=v.clientes.id;
            _wizData.cli_nome=v.clientes.nome;
            _wizData.cli_tel=v.clientes.telefone||"";
          }
          showToast("🚗 "+v.modelo);
          _wizRender();
        }
      }else{
        if(st){st.textContent="⚠️ Não reconhecido — preencha manualmente";st.style.color="var(--warning)";}
      }
    }catch(e){if(st){st.textContent="❌ Falha no OCR";st.style.color="var(--danger)";}}
  }).catch(()=>{if(st){st.textContent="❌ Tesseract não carregou";st.style.color="var(--danger)";}});
}

// ── SALVAR OS ────────────────────────────────────────────────────
async function _wizSalvar(){
  const btn=document.getElementById("btn-wiz-save");
  if(btn){btn.disabled=true;btn.textContent="⏳ Abrindo...";}

  // Captura campos que ainda estão no DOM
  const descEl=document.getElementById("wiz-desc");
  if(descEl) _wizData.descricao=descEl.value, _wizData.lab_problema=descEl.value;
  const modeloEl=document.getElementById("wiz-modelo");
  if(modeloEl) _wizData.modelo=modeloEl.value.trim();
  const placaEl=document.getElementById("wiz-placa");
  if(placaEl) _wizData.placa=placaEl.value.replace(/[^A-Z0-9]/gi,"").toUpperCase();

  // Validação mínima
  const isLab=_wizFluxo==="lab";
  if(!isLab && !_wizData.modelo){showToast("Informe o modelo.","error");if(btn){btn.disabled=false;btn.textContent="🔧 ABRIR OS";}return;}
  const desc=_wizData.descricao||_wizData.lab_problema||"";
  if(!desc){showToast("Descreva o problema.","error");if(btn){btn.disabled=false;btn.textContent="🔧 ABRIR OS";}return;}

  try{
    // 1. Cliente novo
    let cliId=_wizData.cli_id||null;
    const ncNome=document.getElementById("nc-nome")?.value?.trim();
    if(ncNome&&!cliId){
      const res=await sbPost("clientes",{nome:ncNome,telefone:document.getElementById("nc-tel")?.value||"",whatsapp:document.getElementById("nc-wpp")?.value||""});
      cliId=(Array.isArray(res)?res[0]:res)?.id;
      _wizData.cli_id=cliId; _wizData.cli_nome=ncNome;
    }

    // 2. Veículo (só pátio)
    let veiId=_wizData.veiculo_id||null;
    if(!isLab&&_wizData.placa&&!veiId){
      try{
        const res=await sbPost("veiculos",{placa:_wizData.placa,modelo:_wizData.modelo,ano:_wizData.ano?parseInt(_wizData.ano):null,motor:_wizData.motor||"",cliente_id:cliId});
        veiId=(Array.isArray(res)?res[0]:res)?.id;
      }catch{
        const rows=await sbGet("veiculos","placa=ilike."+_wizData.placa+"&limit=1").catch(()=>[]);
        veiId=rows?.[0]?.id||null;
      }
    }

    // 3. Especificações (sem base64)
    const especificacoes=isLab?{
      lab_tipo:_wizData.lab_tipo,
      referencia:_wizData.lab_referencia,
      quantidade:_wizData.lab_quantidade,
      aplicacao:_wizData.lab_aplicacao,
      marca:_wizData.lab_marca,
    }:{
      dtc_codigos:_wizData.dtcs,
      horimetro:_wizData.horimetro,
    };

    // 4. OS
    const novaOS=await sbPost("ordens_servico",{
      cliente_id:  cliId,
      veiculo_id:  veiId||null,
      setor_id:    _wizData.setor||null,
      tipo_servico:_wizData.tipo||"veiculo",
      descricao:   desc,
      cod_falha:   _wizData.dtcs?.[0]||null,
      prioridade:  _wizData.prioridade||"media",
      status:      "recebido",
      km_entrada:  _wizData.horimetro?parseInt(_wizData.horimetro):null,
      valor_mo:    0,
      valor_total: 0,
      especificacoes,
      historico:   [{data:nowStr(),acao:"OS aberta",user:SESSION?.nome||""}],
      fotos:       [],
      cotacao_itens:[],
      data_entrada:today(),
      tecnico:     SESSION?.nome||"",
    });
    const osId=(Array.isArray(novaOS)?novaOS[0]:novaOS)?.id;

    // 5. Upload foto check-in em background
    if(osId&&_wizData.checkin_data){
      (async()=>{
        try{
          const blob=await(await fetch(_wizData.checkin_data)).blob();
          const path=`${osId}/entrada_${Date.now()}.jpg`;
          const up=await fetch(`${SB_URL}/storage/v1/object/os-fotos/${path}`,{
            method:"POST",
            headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"image/jpeg","x-upsert":"true"},
            body:blob
          });
          if(up.ok){
            const url=`${SB_URL}/storage/v1/object/public/os-fotos/${path}`;
            await sbPatch("ordens_servico",`id=eq.${osId}`,{fotos:[{url,tag:"entrada",data:nowStr()}]}).catch(()=>{});
          }
        }catch{}
      })();
    }

    haptic(30);
    showToast("⚡ OS aberta!");
    closeModal();
    await loadAll();

  }catch(e){
    showToast("Erro: "+e.message,"error");
    if(btn){btn.disabled=false;btn.textContent="🔧 ABRIR OS";}
  }
}

// ══════════════════════════════════════════════════
// UPLOAD DE FOTOS EM BACKGROUND (base64 → Storage)
// ══════════════════════════════════════════════════

async function _base64ToBlob(dataUrl){
  const res = await fetch(dataUrl);
  return res.blob();
}

async function _uploadFotoStorage(blob, path){
  const res = await fetch(`${SB_URL}/storage/v1/object/os-fotos/${path}`,{
    method:"POST",
    headers:{
      "apikey":     SB_KEY,
      "Authorization": `Bearer ${SB_KEY}`,
      "Content-Type":  "image/jpeg",
      "x-upsert":      "true",
    },
    body: blob,
  });
  if(!res.ok) throw new Error(`Storage error ${res.status}`);
  return `${SB_URL}/storage/v1/object/public/os-fotos/${path}`;
}

async function _uploadFotosLab(osId, fotosBase64){
  const urls = [];
  for(let i=0; i<fotosBase64.length; i++){
    try{
      const blob = await _base64ToBlob(fotosBase64[i]);
      const path = `${osId}/lab_${Date.now()}_${i}.jpg`;
      const url  = await _uploadFotoStorage(blob, path);
      urls.push({url, tag:`lab_${i}`, data:nowStr()});
    }catch(e){ console.warn("Foto lab upload falhou:", e.message); }
  }
  if(urls.length > 0){
    const o = DATA.os.find(x=>x.id===osId);
    const existentes = Array.isArray(o?.fotos)?o.fotos:[];
    await sbPatch("ordens_servico",`id=eq.${osId}`,{fotos:[...existentes,...urls]}).catch(()=>{});
    if(o) o.fotos=[...existentes,...urls];
  }
}

async function _uploadFotosVeiculo(osId, fotosComTag){
  // fotosComTag: [{data: dataUrl, tag: "entrada"|"checklist_xxx"}]
  const urls = [];
  for(let i=0; i<fotosComTag.length; i++){
    try{
      const {data, tag} = fotosComTag[i];
      const blob = await _base64ToBlob(data);
      const path = `${osId}/${tag}_${Date.now()}_${i}.jpg`;
      const url  = await _uploadFotoStorage(blob, path);
      urls.push({url, tag, data:nowStr()});
    }catch(e){ console.warn("Foto veículo upload falhou:", e.message); }
  }
  if(urls.length > 0){
    const o = DATA.os.find(x=>x.id===osId);
    const existentes = Array.isArray(o?.fotos)?o.fotos:[];
    await sbPatch("ordens_servico",`id=eq.${osId}`,{fotos:[...existentes,...urls]}).catch(()=>{});
    if(o) o.fotos=[...existentes,...urls];
  }
}

let _entregaFoto = null;
function _entregaFotoCaptura(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      const r  = Math.min(800/img.width, 800/img.height, 1);
      cv.width  = Math.round(img.width*r);
      cv.height = Math.round(img.height*r);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      _entregaFoto = cv.toDataURL("image/jpeg",0.75);
      // Atualiza preview sem fechar modal
      const area = document.getElementById("saida-foto-area");
      if(area){ area.style.height="160px"; area.innerHTML=`<img src="${_entregaFoto}" style="width:100%;height:100%;object-fit:cover"/>`; }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function _confirmarEntregaOS(osId){
  const btn = document.getElementById("btn-entregar");
  const errDiv = document.getElementById("entrega-erro");
  if(btn){ btn.disabled=true; btn.textContent="⏳ Finalizando..."; }
  try{
    const o = DATA.os.find(x=>x.id===osId); if(!o) throw new Error("OS não encontrada");
    const km   = document.getElementById("entrega-km")?.value||"";
    const pgto = document.getElementById("entrega-pgto")?.value||"";
    const obs  = document.getElementById("entrega-obs")?.value||"";
    const gar  = document.getElementById("entrega-garantia")?.value||"";

    // Atualiza especificacoes
    const specs = {...(o.especificacoes||{})};
    specs.km_saida        = km ? parseInt(km) : null;
    specs.forma_pagamento = pgto;
    specs.obs_entrega     = obs;

    const hist = [...(Array.isArray(o.historico)?o.historico:[]),{
      data:  nowStr(),
      acao:  `Veículo entregue${pgto?" — "+pgto:""}${gar?" · Garantia: "+gar:""}`,
      user:  SESSION?.nome||"",
    }];

    // Fotos
    const fotos = [...(Array.isArray(o.fotos)?o.fotos:[])];
    if(_entregaFoto) fotos.push({url:_entregaFoto, tag:"saida", data:nowStr()});

    await sbPatch("ordens_servico",`id=eq.${osId}`,{
      status:        "entregue",
      especificacoes: specs,
      historico:     hist,
      fotos,
    });

    // Lança no financeiro — reaproveita lançamento pendente já criado (ex. ao finalizar), evitando duplicidade
    if(o.valor_total>0){
      const lancPendente=DATA.lancamentos.find(l=>l.os_id===osId&&l.tipo==="receita"&&l.status==="pendente");
      if(lancPendente){
        await sbPatch("lancamentos",`id=eq.${lancPendente.id}`,{status:"pago",forma:pgto||null,valor:o.valor_total,data:today()}).catch(()=>{});
      }else{
        await sbPost("lancamentos",{
          tipo:       "receita",
          descricao:  `OS ${numOS(o.numero)} — ${DATA.clientes.find(c=>c.id===o.cliente_id)?.nome||""}`,
          valor:      o.valor_total,
          categoria:  "Serviços",
          data:       today(),
          status:     "pago",
          forma:      pgto||null,
          os_id:      osId,
        }).catch(()=>{});
      }
    }

    haptic([30,50,30]);
    showToast("🎉 Veículo entregue! OS finalizada.");
    _entregaFoto = null;
    closeModal();
    await loadAll();

  }catch(e){
    if(errDiv){ errDiv.textContent="❌ "+e.message; errDiv.style.display="block"; }
    if(btn){ btn.disabled=false; btn.textContent="✅ CONFIRMAR ENTREGA"; }
  }
}

let _osfBruto=0;
function osfCalcTotalGeral(){
  const pct=Number(document.getElementById("osf-desc-pct")?.value||0);
  const val=Number(document.getElementById("osf-desc-val")?.value||0);
  const total=Math.max(0,_osfBruto-(_osfBruto*pct/100)-val);
  const el=document.getElementById("osf-total-final");
  if(el) el.textContent=R$(total);
}

// alterna entre buscar produto do estoque (peça) e descrição livre (serviço/mão de obra)
function itemTipoChange(){
  const tipo=document.getElementById("item-tipo")?.value||"peca";
  const buscaWrap=document.getElementById("item-busca-wrap");
  const descWrap=document.getElementById("item-desc-wrap");
  document.getElementById("peca-prod-id").value="";
  const buscaInput=document.getElementById("peca-search");
  if(buscaInput) buscaInput.value="";
  const descInput=document.getElementById("peca-desc");
  if(tipo==="servico"){
    if(buscaWrap) buscaWrap.style.display="none";
    if(descWrap) descWrap.style.display="";
    else if(descInput) descInput.closest("div").style.display="";
  }else{
    if(buscaWrap) buscaWrap.style.display="";
    if(descWrap) descWrap.style.display="none";
    if(descInput) descInput.value="";
  }
}

// mecânico (ou quem não tem permissão de precificar) solicita peça/serviço sem valor
async function solicitarItem(osId){
  const tipo=document.getElementById("item-tipo")?.value||"peca";
  const prodId=document.getElementById("peca-prod-id")?.value||null;
  const buscaVal=document.getElementById("peca-search")?.value?.trim()||"";
  const descVal=document.getElementById("peca-desc")?.value?.trim()||"";
  const desc=tipo==="servico"?descVal:(buscaVal||descVal);
  const qtd=Number(document.getElementById("peca-qtd")?.value||1);
  if(!desc){showToast("Descreva a peça ou serviço.","error");return;}
  if(qtd<1){showToast("Quantidade inválida.","error");return;}
  const btn=document.querySelector(".osf-add-row button[onclick*='solicitarItem']");
  if(btn){btn.disabled=true;btn.textContent="⏳ Enviando...";}
  try{
    await sbPost("os_itens",{
      os_id:osId,
      produto_id:tipo==="peca"?(prodId||null):null,
      descricao:desc,
      quantidade:qtd,
      valor_unitario:0,
      valor_total:0,
      desconto_pct:0,
      desconto_valor:0,
      tipo,
      aguardando_preco:true,
      solicitado_por:SESSION?.nome||""
    });
    showToast("📩 Item solicitado — aguardando cotação.");
    await loadAll();
    await openOSDetail(osId);
  }catch(e){
    showToast("Erro: "+e.message,"error");
    if(btn){btn.disabled=false;btn.textContent="📩 Solicitar";}
  }
}

// admin/recepção (com permissão de cotar) define o preço de um item pendente
async function definirPrecoItem(itemId,osId){
  if(!perm("cotarPrecos")){showToast("Sem permissão para cotar preços.","error");return;}
  const input=document.getElementById(`def-preco-${itemId}`);
  const unit=Number(input?.value||0);
  if(!unit){showToast("Informe o valor unitário.","error");return;}
  try{
    const itens=await sbGet("os_itens",`id=eq.${itemId}`);
    const it=itens[0];if(!it){showToast("Item não encontrado.","error");return;}
    const totalItem=Number(it.quantidade||1)*unit;
    await sbPatch("os_itens",`id=eq.${itemId}`,{
      valor_unitario:unit,
      valor_total:totalItem,
      aguardando_preco:false
    });
    await recalcularTotal(osId);
    showToast("💲 Preço definido!");
    await loadAll();
    if(PAGE==="cotacao") render(); else await openOSDetail(osId);
  }catch(e){showToast("Erro: "+e.message,"error");}
}

function osfBuscaCliente(val){
  const dd=document.getElementById("osf-cli-results");
  if(!val||val.length<1){dd.style.display="none";return;}
  const q=val.toLowerCase();
  const matches=DATA.clientes.filter(c=>(c.nome||"").toLowerCase().includes(q)).slice(0,7);
  if(!matches.length){dd.style.display="none";return;}
  dd.innerHTML=matches.map(c=>`<div onclick="osfSelCliente('${c.id}','${esc(c.nome)}','${esc(c.cpf_cnpj||"")}')" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border)">
    <div style="font-size:12px;font-weight:700">${esc(c.nome)}</div>
    ${c.telefone?`<div style="font-size:10px;color:var(--muted)">${esc(c.telefone)}</div>`:""}
  </div>`).join("");
  dd.style.display="block";
}
function osfSelCliente(id,nome,doc){
  document.getElementById("osf-cli-id").value=id;
  document.getElementById("osf-cli-busca").value=nome;
  document.getElementById("osf-cli-doc").value=doc;
  document.getElementById("osf-cli-results").style.display="none";
}

async function osfSalvar(id,fechar){
  if(!perm("editarOS")){showToast("Sem permissão para editar esta OS.","error");return;}
  const o=DATA.os.find(x=>x.id===id);if(!o)return;
  const isPatioOS=!o.setor_id||o.setor_id==="patio"||o.tipo_servico==="veiculo"||!o.tipo_servico;
  const novoStatus=document.getElementById("osf-status").value;
  if(novoStatus!==o.status&&!perm("moverStatus")){showToast("Sem permissão para mudar o status.","error");return;}
  const cliId=document.getElementById("osf-cli-id").value||null;
  const setorId=document.getElementById("osf-setor").value||null;
  const vendedor=document.getElementById("osf-vendedor").value.trim();
  const dataConfirmacao=document.getElementById("osf-confirmacao").value||null;
  const dataEntrega=document.getElementById("osf-entrega-data").value||null;
  const horaEntrega=document.getElementById("osf-entrega-hora").value||"";
  const descricao=document.getElementById("osf-descricao").value.trim();
  const codFalha=document.getElementById("osf-dtc").value.trim()||null;
  const diagnostico=document.getElementById("osf-diagnostico").value.trim()||null;
  const obs=document.getElementById("osf-obs").value;
  const descPct=Number(document.getElementById("osf-desc-pct").value||0);
  const descVal=Number(document.getElementById("osf-desc-val").value||0);
  const especificacoes={...(o.especificacoes||{}),data_confirmacao:dataConfirmacao,hora_entrega:horaEntrega,desconto_pct:descPct,desconto_valor:descVal};
  let kmEntrada=o.km_entrada;
  let veiculoId=o.veiculo_id||null;
  if(isPatioOS){
    const placa=(document.getElementById("osf-placa")?.value||"").trim().toUpperCase();
    const modelo=(document.getElementById("osf-modelo")?.value||"").trim();
    const ano=document.getElementById("osf-ano")?.value||"";
    const motor=(document.getElementById("osf-motor")?.value||"").trim();
    kmEntrada=document.getElementById("osf-km")?.value?Number(document.getElementById("osf-km").value):null;
    try{
      if(veiculoId){
        await sbPatch("veiculos",`id=eq.${veiculoId}`,{placa,modelo,ano:ano?parseInt(ano):null,motor});
      }else if(placa){
        const res=await sbPost("veiculos",{placa,modelo,ano:ano?parseInt(ano):null,motor,cliente_id:cliId});
        veiculoId=(Array.isArray(res)?res[0]:res)?.id||null;
      }
    }catch(e){showToast("Erro ao salvar veículo: "+e.message,"error");}
  }else{
    especificacoes.referencia=(document.getElementById("osf-referencia")?.value||"").trim();
    especificacoes.marca=(document.getElementById("osf-marca")?.value||"").trim();
    especificacoes.quantidade=document.getElementById("osf-quantidade")?.value||1;
    especificacoes.aplicacao=(document.getElementById("osf-aplicacao")?.value||"").trim();
  }
  try{
    if(novoStatus!==o.status){ await quickStatus(id,novoStatus); }
    await sbPatch("ordens_servico",`id=eq.${id}`,{
      cliente_id:cliId,
      veiculo_id:veiculoId,
      setor_id:setorId,
      tecnico:vendedor,
      data_entrega:dataEntrega,
      descricao,
      cod_falha:codFalha,
      diagnostico,
      km_entrada:kmEntrada,
      notas_internas:obs,
      especificacoes,
    });
    await loadAll();
    await recalcularTotal(id);
    showToast("✅ OS salva!");

  }catch(e){

// ciclo de estados ao clicar: pendente → ok → avaria → na → pendente
const CHK_CYCLE=["pendente","ok","avaria","na"];
let _chkState={};

function toggleChkItem(osId,itemId,el){
  if(!_chkState[osId]) _chkState[osId]={};
  const o=DATA.os.find(x=>x.id===osId);
  const current=(_chkState[osId][itemId])||(o?.checklist_vistoria?.[itemId])||"pendente";
  const next=CHK_CYCLE[(CHK_CYCLE.indexOf(current)+1)%CHK_CYCLE.length];
  _chkState[osId][itemId]=next;
  // atualiza visual imediato sem salvar no banco ainda
  el.className=`chk-item${next!=="pendente"?" "+next:""}`;
  el.querySelector(".chk-item-estado").textContent=
    next==="ok"?"✅ OK":next==="avaria"?"⚠️ Avaria":next==="na"?"— N/A":"· Verificar";
}

// ── CANVAS DE ASSINATURA ──────────────────────────────────
let _sigDrawing=false;let _sigCtx=null;

function initSigCanvas(){
  const canvas=document.getElementById("sig-canvas");
  if(!canvas||_sigCtx) return;
  _sigCtx=canvas.getContext("2d");
  _sigCtx.strokeStyle="#f9fafb";
  _sigCtx.lineWidth=2.5;
  _sigCtx.lineCap="round";
  _sigCtx.lineJoin="round";

  const pos=(e)=>{
    const r=canvas.getBoundingClientRect();
    const scaleX=canvas.width/r.width;
    const scaleY=canvas.height/r.height;
    const src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-r.left)*scaleX,y:(src.clientY-r.top)*scaleY};
  };
  const start=e=>{e.preventDefault();_sigDrawing=true;const p=pos(e);_sigCtx.beginPath();_sigCtx.moveTo(p.x,p.y);canvas.classList.add("signed");};
  const move=e=>{e.preventDefault();if(!_sigDrawing)return;const p=pos(e);_sigCtx.lineTo(p.x,p.y);_sigCtx.stroke();};
  const end=e=>{e.preventDefault();_sigDrawing=false;};

  canvas.addEventListener("mousedown",start);
  canvas.addEventListener("mousemove",move);
  canvas.addEventListener("mouseup",end);
  canvas.addEventListener("mouseleave",end);
  canvas.addEventListener("touchstart",start,{passive:false});
  canvas.addEventListener("touchmove",move,{passive:false});
  canvas.addEventListener("touchend",end,{passive:false});
}

function clearSig(){
  const canvas=document.getElementById("sig-canvas");
  if(!canvas) return;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  canvas.classList.remove("signed");
  _sigCtx=null;
}

function isSigEmpty(){
  const canvas=document.getElementById("sig-canvas");
  if(!canvas) return true;
  const ctx=canvas.getContext("2d");
  const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  return !data.some(v=>v!==0);
}

async function saveChecklist(osId){
  const o=DATA.os.find(x=>x.id===osId);if(!o)return;
  // merge estado local com estado salvo
  const base=o.checklist_vistoria||{};
  const local=_chkState[osId]||{};
  const merged={...base,...local};
  // remove pendentes para não poluir
  Object.keys(merged).forEach(k=>{if(merged[k]==="pendente")delete merged[k];});

  let assinaturaUrl=null;
  if(!isSigEmpty()){
    const canvas=document.getElementById("sig-canvas");
    assinaturaUrl=canvas.toDataURL("image/png");
  }
  if(!assinaturaUrl&&!o.assinatura_cliente){
    if(!confirm("Salvar vistoria sem assinatura do cliente?"))return;
  }

  const avDesc=document.getElementById("chk-avaria-desc")?.value||o.checklist_avarias||"";

  try{
    const patch={checklist_vistoria:merged,checklist_avarias:avDesc};
    if(assinaturaUrl){
      patch.assinatura_cliente=assinaturaUrl;
      patch.checklist_assinado_em=nowStr();
    }
    await sbPatch("ordens_servico",`id=eq.${osId}`,patch);
    _chkState[osId]={};
    _sigCtx=null;
    showToast("✅ Vistoria salva com sucesso!");
    await loadAll();
    openOSDetail(osId);
    setTimeout(()=>{
      const tabBtn=document.querySelector(".tab:nth-child(2)");
      if(tabBtn){tabBtn.click();}
    },80);
  }catch(e){showToast("Erro: "+e.message,"error");}
}

async function limparAssinatura(osId){
  if(!confirm("Remover assinatura e refazer?"))return;
  try{
    await sbPatch("ordens_servico",`id=eq.${osId}`,{assinatura_cliente:null,checklist_assinado_em:null});
    showToast("Assinatura removida.");
    await loadAll();openOSDetail(osId);
    setTimeout(()=>{document.querySelector(".tab:nth-child(2)")?.click();},80);
  }catch(e){showToast("Erro: "+e.message,"error");}
}

// ── CRONÔMETRO ────────────────────────────────────────────
function minToHHMM(min){
  const m=Math.round(min);
  return`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
}
function timerAction(action,osId,savedMin){
  const display=document.getElementById(`timer-display-${osId}`);
  const bar=document.getElementById(`timer-bar-${osId}`);
  const btnStart=document.getElementById(`timer-start-${osId}`);
  const btnPause=document.getElementById(`timer-pause-${osId}`);
  const btnStop=document.getElementById(`timer-stop-${osId}`);
  if(action==="start"){
    if(timerInterval) clearInterval(timerInterval);
    timerStart=Date.now();
    timerAccum=savedMin*60;
    bar?.classList.add("timer-running");
    btnStart.style.display="none";btnPause.style.display="";btnStop.style.display="";
    timerInterval=setInterval(()=>{
      const elapsed=Math.floor((Date.now()-timerStart)/1000);
      const total=timerAccum+elapsed;
      const mm=Math.floor(total/60),ss=total%60;
      if(display) display.textContent=`${String(Math.floor(mm/60)).padStart(2,"0")}:${String(mm%60).padStart(2,"0")}`;
    },1000);
  }else if(action==="pause"){
    clearInterval(timerInterval);timerInterval=null;
    const elapsed=(Date.now()-timerStart)/1000/60;
    timerAccum+=elapsed;
    bar?.classList.remove("timer-running");
    btnStart.style.display="";btnPause.style.display="none";btnStop.style.display="";
    btnStart.textContent="▶ Continuar";
  }else if(action==="stop"){
    clearInterval(timerInterval);timerInterval=null;
    const elapsed=timerStart?(Date.now()-timerStart)/1000/60:0;
    const total=Math.round(timerAccum+elapsed);
    sbPatch("ordens_servico",`id=eq.${osId}`,{tempo_total_min:total}).then(()=>{
      showToast(`⏱ Tempo salvo: ${minToHHMM(total)}`);loadAll();
    }).catch(e=>showToast("Erro ao salvar tempo: "+e.message,"error"));
    bar?.classList.remove("timer-running");
    btnStart.style.display="";btnPause.style.display="none";btnStop.style.display="none";
    btnStart.textContent="▶ Iniciar";
    timerStart=null;timerAccum=0;
  }
}

// ── MELHORIA #11: FOTOS DE ENTRADA ───────────────────────



// normaliza fotos: aceita strings antigas (URL) ou objetos {url, tag, data} — sempre preserva a tag
function normalizeFotos(fotos){
  return (fotos||[]).map(f=> typeof f==="string" ? {url:f,tag:""} : {url:f.url||"",tag:f.tag||"",data:f.data||""}).filter(f=>f.url);
}

// foto de destaque do card (lista/kanban) — prioriza a de entrada, senão a primeira disponível
function primeiraFotoUrl(fotos){
  const norm=normalizeFotos(fotos);
  if(!norm.length) return null;
  return (norm.find(f=>f.tag==="entrada")||norm[0]).url;
}

// seção de fotos de uma categoria (tag) — entrada ou saída, funciona igual pra pátio e laboratório
function buildFotoTagSection(fotos,osId,tag,label,icon){
  const normalized=normalizeFotos(fotos);
  const doTag=[];
  normalized.forEach((f,i)=>{ if(f.tag===tag) doTag.push({...f,i}); });
  const thumbs=doTag.map(f=>`
    <div class="foto-thumb" onclick="openFotoViewer('${osId}',${f.i})">

// comprime uma imagem no canvas antes do upload
function compressImage(file,maxPx=800,quality=0.70){
  return new Promise((resolve,reject)=>{
    // Formatos que o navegador não decodifica em <img>/<canvas> (ex: HEIC/HEIF de iPhone)
    const nomeOuTipo=(file.type||file.name||"").toLowerCase();
    if(nomeOuTipo.includes("heic")||nomeOuTipo.includes("heif")){
      reject(new Error("Foto em formato HEIC/HEIF não é suportada. No iPhone, mude em Ajustes > Câmera > Formatos para 'Mais Compatível', ou escolha 'Manter Original' ao compartilhar/enviar a foto."));
      return;
    }
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("Não foi possível ler o arquivo selecionado."));
    reader.onload=e=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Não foi possível abrir esta imagem. Tente outro formato (JPG/PNG)."));
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){
          if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
          else{w=Math.round(w*maxPx/h);h=maxPx;}
        }
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(blob) resolve(blob);
          else reject(new Error("Falha ao processar a imagem."));
        },"image/jpeg",quality);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleFotoUpload(event,osId,tag){
  const files=Array.from(event.target.files);
  if(!files.length) return;
  const o=DATA.os.find(x=>x.id===osId);
  const existing=normalizeFotos(o?.fotos);
  const existingForTag=existing.filter(f=>f.tag===tag);
  const slots=4-existingForTag.length;
  if(slots<=0){showToast(`Limite de 4 fotos em ${tag==="entrada"?"Entrada":"Saída"} atingido.`,"error");return;}
  const toUpload=files.slice(0,slots);

  const newUrls=[];
  const erros=[];
  try{
    for(const file of toUpload){
      try{
        const compressed=await compressImage(file);
        const ext="jpg";
        const path=`${osId}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

        // upload para o Supabase Storage
        const res=await fetch(`${SB_STORAGE}/object/${SB_BUCKET}/${path}`,{
          method:"POST",
          headers:{
            "apikey":SB_KEY,
            "Authorization":`Bearer ${SB_KEY}`,
            "Content-Type":"image/jpeg",
            "x-upsert":"true"
          },
          body:compressed
        });
        if(!res.ok){
          const t=await res.text();
          const msg=JSON.parse(t||"{}").message||t||res.status;
          throw new Error(`Storage: ${msg}`);
        }

        // URL pública
        const publicUrl=`${SB_STORAGE}/object/public/${SB_BUCKET}/${path}`;
        newUrls.push(publicUrl);
      }catch(fileErr){
        console.warn("Falha ao enviar foto:",file.name,fileErr.message);
        erros.push({nome:file.name,msg:fileErr.message});
      }
    }

    let fotosFinais=existing;
    if(newUrls.length>0){
      fotosFinais=[...existing,...newUrls.map(u=>({url:u,tag,data:nowStr()}))];
      await sbPatch("ordens_servico",`id=eq.${osId}`,{fotos:fotosFinais});
      if(o) o.fotos=fotosFinais;
    }

    if(erros.length===0){
      showToast(`✅ ${newUrls.length} foto(s) adicionada(s).`);
    }else if(newUrls.length>0){
      showToast(`⚠️ ${newUrls.length} foto(s) enviada(s), ${erros.length} falharam: ${erros[0].msg}`,"error");
    }else{
      showToast(`Erro no upload: ${erros[0].msg}`,"error");
    }

    // atualiza só a seção de fotos, sem fechar o modal
    const sec=document.getElementById(`foto-section-${osId}`);
    if(sec) sec.innerHTML=buildFotoSection(fotosFinais,osId);
    event.target.value="";
  }catch(e){
    showToast("Erro no upload: "+e.message,"error");
    const sec=document.getElementById(`foto-section-${osId}`);
    if(sec) sec.innerHTML=buildFotoSection(existing,osId);
  }
}

// apaga um ou mais arquivos de foto do Supabase Storage (URLs base64 são ignoradas, só existem em memória)
async function deletarFotosStorage(fotos){
  const urls=normalizeFotos(fotos).map(f=>f.url).filter(u=>u&&u.startsWith("http"));
  await Promise.all(urls.map(async url=>{
    try{
      const match=url.match(/\/object\/public\/os-fotos\/(.+)$/);
      if(match){
        await fetch(`${SB_STORAGE}/object/${SB_BUCKET}/${match[1]}`,{
          method:"DELETE",
          headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`}
        });
      }
    }catch{}
  }));
}

async function deleteFoto(osId,index){
  if(!confirm("Remover esta foto?")) return;
  const o=DATA.os.find(x=>x.id===osId);
  const fotos=normalizeFotos(o?.fotos);
  await deletarFotosStorage([fotos[index]]);

  fotos.splice(index,1);
  await sbPatch("ordens_servico",`id=eq.${osId}`,{fotos});
  if(o) o.fotos=fotos;
  showToast("Foto removida.");
  const sec=document.getElementById(`foto-section-${osId}`);
  if(sec) sec.innerHTML=buildFotoSection(fotos,osId);
  else{ await loadAll(); }
}

// lightbox com suporte a URL string e {url,tag} object
function openFotoViewer(osIdOrUrl, idx){
  let urls = [];

  if(typeof idx === "number"){
    // chamado com (osId, index)
    const o = DATA.os.find(x=>x.id===osIdOrUrl);
    const fotos = o?.fotos||[];
    urls = fotos.map(f=> typeof f==="string" ? f : (f.url||"")).filter(Boolean);
  } else {
    // chamado com (url) — modo legado
    urls = [osIdOrUrl];
    idx = 0;
  }

  if(!urls.length) return;
  let cur = idx||0;

  const overlay = document.createElement("div");
  overlay.className = "foto-viewer-overlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9000;display:flex;align-items:center;justify-content:center;touch-action:none";
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };

  const render = () => {
    const url = urls[cur];
    overlay.innerHTML = `
      <div style="position:relative;max-width:100vw;max-height:100dvh;display:flex;flex-direction:column;align-items:center">
        <div style="position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(rgba(0,0,0,.6),transparent);z-index:1">
          <div style="color:rgba(255,255,255,.7);font-size:12px">${cur+1} / ${urls.length}</div>
          <button onclick="this.closest('.foto-viewer-overlay').remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
        </div>
        <img src="${url}" style="max-width:100vw;max-height:100dvh;object-fit:contain;user-select:none" draggable="false" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
        <div style="display:none;flex-direction:column;align-items:center;gap:12px;color:#fff;padding:40px">
          <div style="font-size:40px">🖼️</div>
          <div style="font-size:14px;opacity:.7">Não foi possível carregar a foto</div>
        </div>
        ${urls.length>1?`
          <div style="position:fixed;bottom:20px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:16px;z-index:1">
            <button onclick="_fvPrev()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:28px;width:52px;height:52px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>
            <div style="display:flex;gap:6px">${urls.map((_,i)=>`<div style="width:7px;height:7px;border-radius:50%;background:${i===cur?"#fff":"rgba(255,255,255,.4)"}"></div>`).join("")}</div>
            <button onclick="_fvNext()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:28px;width:52px;height:52px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center">›</button>
          </div>`:""}
      </div>`;
  };

  window._fvPrev = () => { cur=(cur-1+urls.length)%urls.length; render(); };
  window._fvNext = () => { cur=(cur+1)%urls.length; render(); };

  // Swipe
  let sx=0;
  overlay.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
  overlay.addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>40){ dx<0?window._fvNext():window._fvPrev(); }
  },{passive:true});

  render();
  document.body.appendChild(overlay);
}

// autocomplete de produtos no formulário de peças
function filterProdSearch(val){
  const dd=document.getElementById("prod-results");
  if(!val||val.length<1){dd.style.display="none";return;}
  const q=val.toLowerCase();
  const matches=DATA.produtos.filter(p=>`${p.nome} ${p.codigo||""}`.toLowerCase().includes(q)).slice(0,7);
  if(!matches.length){dd.style.display="none";return;}
  dd.innerHTML=matches.map(p=>{
    const critico=Number(p.estoque_atual)<=Number(p.estoque_minimo);
    const semEstoque=Number(p.estoque_atual)<=0;
    return `<div onclick="selectProd('${p.id}','${esc(p.nome)}',${p.preco_venda||0})"
      style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;${semEstoque?"opacity:.5":""}">
      <div>
        <div style="font-size:12px;font-weight:700">${esc(p.nome)}</div>
        <div style="font-size:10px;color:var(--muted)">${p.codigo?esc(p.codigo)+" · ":""}${R$(p.preco_venda)} · Estoque: <span style="color:${critico?"var(--accent)":"var(--green)"};font-weight:800">${p.estoque_atual} ${p.unidade||"un"}</span></div>
      </div>
      ${semEstoque?`<span style="font-size:9px;background:#ef444420;color:var(--accent);padding:2px 6px;border-radius:4px;font-weight:800">Sem estoque</span>`:""}
    </div>`;
  }).join("");
  dd.style.display="block";
}

function selectProd(id,nome,preco){
  document.getElementById("peca-prod-id").value=id;
  document.getElementById("peca-search").value=nome;
  document.getElementById("peca-desc").value=nome;
  document.getElementById("peca-unit").value=preco;
  document.getElementById("prod-results").style.display="none";
  calcPecaTotal();
  document.getElementById("peca-qtd").focus();
}

function calcPecaTotal(){
  const qtd=Number(document.getElementById("peca-qtd")?.value||1);
  const unit=Number(document.getElementById("peca-unit")?.value||0);
  const pct=Number(document.getElementById("peca-desc-pct")?.value||0);
  const val=Number(document.getElementById("peca-desc-val")?.value||0);
  const bruto=qtd*unit;
  const total=Math.max(0,bruto-(bruto*pct/100)-val);
  const el=document.getElementById("peca-total");
  if(el) el.value=total>0?R$(total):"";
}

async function addPeca(osId){
  const desc=document.getElementById("peca-desc").value.trim();
  const qtd=Number(document.getElementById("peca-qtd").value||1);
  const unit=Number(document.getElementById("peca-unit").value||0);
  const descPct=Number(document.getElementById("peca-desc-pct")?.value||0);
  const descVal=Number(document.getElementById("peca-desc-val")?.value||0);
  const prodId=document.getElementById("peca-prod-id").value||null;
  const tipo=document.getElementById("item-tipo")?.value||"peca";
  if(!desc){showToast("Informe a descrição.","error");return;}
  if(!unit){showToast("Informe o valor unitário.","error");return;}
  if(qtd<1){showToast("Quantidade inválida.","error");return;}

  // se veio do estoque, verifica disponibilidade
  if(prodId){
    const prod=DATA.produtos.find(p=>p.id===prodId);
    if(prod&&Number(prod.estoque_atual)<qtd){
      showToast(`Estoque insuficiente — disponível: ${prod.estoque_atual} ${prod.unidade||"un"}. Adicione como peça externa ou ajuste a quantidade.`,"error");
      return;
    }
  }

  const btn=document.querySelector(".osf-add-row button[onclick*='addPeca']");
  if(btn){btn.disabled=true;btn.textContent="⏳ Salvando...";}

  try{
    const bruto=qtd*unit;
    const totalItem=Math.max(0,bruto-(bruto*descPct/100)-descVal);

    // 1. insere o item na OS
    await sbPost("os_itens",{
      os_id:osId,
      produto_id:prodId||null,
      descricao:desc,
      quantidade:qtd,
      valor_unitario:unit,
      desconto_pct:descPct,
      desconto_valor:descVal,
      valor_total:totalItem,
      tipo,
      aguardando_preco:false,
      solicitado_por:SESSION?.nome||""
    });

    // 2. atualiza valor_total da OS
    const o=DATA.os.find(x=>x.id===osId);
    const novoTotal=Number(o?.valor_total||0)+totalItem;
    await sbPatch("ordens_servico",`id=eq.${osId}`,{valor_total:novoTotal});

    // 3. ── MELHORIA #4: decrementa estoque se produto vinculado ──
    if(prodId){
      const prod=DATA.produtos.find(p=>p.id===prodId);
      if(prod){
        const novoEstoque=Number(prod.estoque_atual)-qtd;
        await sbPatch("produtos",`id=eq.${prodId}`,{estoque_atual:novoEstoque});

        // alerta de estoque crítico
        if(novoEstoque<=Number(prod.estoque_minimo)&&novoEstoque>0){
          showToast(`⚠️ Estoque de "${prod.nome}" está crítico: ${novoEstoque} ${prod.unidade||"un"} restantes.`,"error");
        }else if(novoEstoque<=0){
          showToast(`🚨 "${prod.nome}" zerou no estoque!`,"error");
        }else{
          showToast(`✅ Peça adicionada — estoque atualizado: ${novoEstoque} ${prod.unidade||"un"} restantes.`);
        }
      }
    }else{
      showToast("✅ Peça adicionada.");
    }

    // 4. recarrega tudo e reabre a OS na aba peças
    await loadAll();
    await openOSDetail(osId);
    // volta para aba peças automaticamente
    setTimeout(()=>{
      const tabBtn=document.querySelector(".tab:nth-child(2)");
      const pecasPanel=document.getElementById("osd-pecas");
      if(tabBtn&&pecasPanel){
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        tabBtn.classList.add("active");
        ["osd-resumo","osd-pecas","osd-wpp","osd-status","osd-hist"].forEach(x=>{
          const el=document.getElementById(x);if(el)el.style.display=x==="osd-pecas"?"block":"none";
        });
      }
    },50);

  }catch(e){
    showToast("Erro: "+e.message,"error");
    if(btn){btn.disabled=false;btn.textContent="+ Adicionar Item";}
  }
}

async function removePeca(itemId,prodId,qtd,osId){
  if(!confirm("Remover esta peça? O estoque será reposto.")) return;
  try{
    const item=await sbGet("os_itens",`id=eq.${itemId}`);
    const valorItem=Number(item[0]?.valor_total||0);

    // 1. remove o item
    await sbDelete("os_itens",`id=eq.${itemId}`);

    // 2. subtrai do valor_total da OS
    const o=DATA.os.find(x=>x.id===osId);
    const novoTotal=Math.max(0,Number(o?.valor_total||0)-valorItem);
    await sbPatch("ordens_servico",`id=eq.${osId}`,{valor_total:novoTotal});

    // 3. ── MELHORIA #4: repõe estoque se havia produto vinculado ──
    if(prodId){
      const prod=DATA.produtos.find(p=>p.id===prodId);
      if(prod){
        const novoEstoque=Number(prod.estoque_atual)+Number(qtd);
        await sbPatch("produtos",`id=eq.${prodId}`,{estoque_atual:novoEstoque});
      }
    }

    showToast("Peça removida"+(prodId?" e estoque reposto.":"."));
    await loadAll();
    if(PAGE==="cotacao") render(); else await openOSDetail(osId);
  }catch(e){showToast("Erro: "+e.message,"error");}
}

function openEditOS(id){
  const o=DATA.os.find(x=>x.id===id);if(!o)return;
  document.getElementById("modal-root").innerHTML=`
    <div class="overlay" onclick="closeModal()">

async function saveEntradaEstoque(prodId){
  if(!perm("editarEstoque")){showToast("Sem permissão para editar estoque.","error");return;}
  const p=DATA.produtos.find(x=>x.id===prodId);if(!p)return;
  const qty=Number(document.getElementById("ent-qty").value);
  if(!qty||qty<=0){showToast("Informe a quantidade.","error");return;}
  const custo=Number(document.getElementById("ent-custo").value||p.preco_custo||0);
  const novoEstoque=Number(p.estoque_atual||0)+qty;
  try{
    await sbPatch("produtos",`id=eq.${prodId}`,{estoque_atual:novoEstoque,...(custo?{preco_custo:custo}:{})});
    // lança saída no financeiro como despesa
    const obs=document.getElementById("ent-obs").value.trim();
    await sbPost("lancamentos",{
      tipo:"despesa",
      descricao:`Entrada estoque: ${p.nome}${obs?` — ${obs}`:""}`,
      valor:custo*qty,
      status:"pago",
      vencimento:today(),
      forma:"—"
    });
    showToast(`✅ +${qty} ${p.unidade||"un"} adicionados ao estoque!`);
    closeModal();await loadAll();
  }catch(e){showToast("Erro: "+e.message,"error");}
}

async function deleteCli(id){
  if(!perm("editarClientes")){showToast("Sem permissão para excluir clientes.","error");return;}
  const cli=DATA.clientes.find(x=>x.id===id);
  if(!cli)return;
  const veics=DATA.veiculos.filter(v=>v.cliente_id===id);
  const osDosCli=DATA.os.filter(o=>o.cliente_id===id);
  const msg=`Excluir ${esc(cli.nome)}?${osDosCli.length?`

⚠️ Este cliente tem ${osDosCli.length} OS que também serão excluídas.`:""}`;
  if(!confirm(msg))return;
  try{
    // exclui em cascata
    for(const o of osDosCli){
      await sbDelete("os_itens",`os_id=eq.${o.id}`).catch(()=>{});
      await sbDelete("lancamentos",`os_id=eq.${o.id}`).catch(()=>{});
    }
    if(osDosCli.length) await sbDelete("ordens_servico",`cliente_id=eq.${id}`).catch(()=>{});
    if(veics.length) await sbDelete("veiculos",`cliente_id=eq.${id}`).catch(()=>{});
    await sbDelete("clientes",`id=eq.${id}`);
    showToast("Cliente excluído.");
    await loadAll();
  }catch(e){showToast("Erro: "+e.message,"error");}
}

// ── AGENDAMENTO ───────────────────────────────────────────
// dados em memória (usam tabela agendamentos no Supabase se existir)
let AGENDAMENTOS=[];

async function loadAgendamentos(){
  try{
    const rows=await sbGet("agendamentos","order=data_hora.asc&select=*");
    AGENDAMENTOS=Array.isArray(rows)?rows:[];
  }catch{AGENDAMENTOS=[];}
}

function renderAgenda(c){
  const hoje=today();
  const agAmanha=AGENDAMENTOS.filter(a=>a.data_hora>=hoje&&a.status!=="cancelado");
  const passados=AGENDAMENTOS.filter(a=>a.data_hora<hoje&&a.status!=="cancelado");
  // agrupar por dia
  const porDia={};
  agAmanha.forEach(a=>{
    const dia=a.data_hora.split("T")[0];
    if(!porDia[dia]) porDia[dia]=[];
    porDia[dia].push(a);
  });

  function agCard(a){
    const cli=DATA.clientes.find(x=>x.id===a.cliente_id);
    const hora=a.data_hora.split("T")[1]?.slice(0,5)||"";
    const passado=a.data_hora<hoje;
    return `<div style="background:var(--bg-surface);border:1px solid var(--border);border-left:3px solid ${passado?"var(--text-muted)":"var(--accent)"};border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:8px">
      <div style="min-width:44px;text-align:center;flex-shrink:0">
        <div style="font-size:16px;font-weight:900;color:var(--accent);font-family:var(--font-mono)">${hora}</div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:700">${esc(cli?.nome||a.cliente_nome||"Cliente")}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px">${esc(a.servico||"—")}</div>
        ${a.observacao?`<div style="font-size:11px;color:var(--text-muted);margin-top:3px">${esc(a.observacao)}</div>`:""}
        ${cli?.telefone?`<div style="font-size:11px;color:var(--text-muted);margin-top:3px">📞 ${esc(cli.telefone)}</div>`:""}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
        ${!passado?`<button onclick="converterAgendaOS('${a.id}')" style="padding:4px 8px;background:var(--accent-tint);border:1px solid var(--accent-glow);border-radius:6px;color:var(--accent);font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap">➕ OS</button>`:""}
        <button onclick="cancelarAgendamento('${a.id}')" style="padding:4px 8px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);font-size:10px;font-weight:700;cursor:pointer">✕</button>
      </div>
    </div>`;
  }

  c.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-size:18px;font-weight:900">📅 Agendamento</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px">${agAmanha.length} agendamentos futuros</div>
      </div>
      <button class="btn btn-red" onclick="openNovoAgendamento()">＋ Agendar</button>
    </div>

    ${agAmanha.length===0?`
      <div class="card" style="text-align:center;padding:32px">
        <div style="font-size:32px;margin-bottom:10px">📅</div>
        <div style="font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:6px">Nenhum agendamento</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">Clique em + Agendar para registrar um atendimento</div>
        <button class="btn btn-red" onclick="openNovoAgendamento()">＋ Primeiro agendamento</button>
      </div>
    `:Object.entries(porDia).sort().map(([dia,ags])=>`
      <div style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px">
          <span>${dia===hoje?"📌 Hoje":new Date(dia+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})}</span>
          <div style="flex:1;height:1px;background:var(--border)"></div>
          <span style="background:var(--accent);color:#fff;border-radius:20px;padding:1px 8px;font-size:10px">${ags.length}</span>
        </div>
        ${ags.map(a=>agCard(a)).join("")}
      </div>`).join("")}

    ${passados.length?`
      <div style="margin-top:8px">

// ── PULL-TO-REFRESH ───────────────────────────────────
(function(){
  let startY=0, pulling=false, indicator=null;
  function createIndicator(){
    if(document.getElementById("ptr-indicator")) return;
    const el=document.createElement("div");
    el.id="ptr-indicator";
    el.style.cssText="position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-60px);background:#fff;border:1px solid var(--border);border-radius:50px;padding:6px 14px;font-size:11px;font-weight:700;color:var(--accent);z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .2s ease;pointer-events:none;display:flex;align-items:center;gap:6px";
    el.innerHTML="⟳ Solte para atualizar";
    document.body.appendChild(el);
    return el;
  }
  document.addEventListener("touchstart",e=>{
    if(window.scrollY>0) return;
    startY=e.touches[0].clientY;
    pulling=false;
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!SESSION) return;
    const dy=e.touches[0].clientY-startY;
    if(dy<40||window.scrollY>0) return;
    pulling=true;
    const ind=createIndicator()||document.getElementById("ptr-indicator");
    if(!ind) return;
    const progress=Math.min(dy-40,60);
    ind.style.transform=`translateX(-50%) translateY(${progress-60}px)`;
    ind.innerHTML=progress>50?"⟳ Solte para atualizar":"⬇️ Puxe para atualizar";
    ind.style.color=progress>50?"var(--accent)":"var(--text-muted)";
  },{passive:true});
  document.addEventListener("touchend",()=>{
    const ind=document.getElementById("ptr-indicator");
    if(pulling&&ind){
      ind.style.transform="translateX(-50%) translateY(-60px)";
      if(SESSION){loadAll();showToast("Atualizando...");}
    }
    if(ind) setTimeout(()=>ind.remove(),300);
    pulling=false;
  });
})();

function updateAppBadge(){
  if(!("setAppBadge" in navigator)) return;
  const urgentes=DATA.os.filter(o=>o.prioridade==="urgente"&&!["finalizado","entregue"].includes(o.status)).length;
  const atrasadas=DATA.os.filter(o=>!["finalizado","entregue"].includes(o.status)&&o.created_at&&(Date.now()-new Date(o.created_at))/(1000*60*60*24)>=3).length;
  const total=urgentes+atrasadas;
  if(total>0) navigator.setAppBadge(total).catch(()=>{});
  else navigator.clearAppBadge?.().catch(()=>{});
}

function buildHistoricoPecasVeiculo(veiculoId, osAtualId){
  if(!veiculoId) return "";
  const osDoVeiculo=DATA.os.filter(o=>o.veiculo_id===veiculoId&&o.id!==osAtualId&&["finalizado","entregue"].includes(o.status));
  if(!osDoVeiculo.length) return "";
  const pecas=[];
  osDoVeiculo.forEach(o=>{
    const itens=(DATA.os_itens||[]).filter(i=>i.os_id===o.id);
    itens.forEach(i=>pecas.push({desc:i.descricao,os:numOS(o.numero),data:o.data_entrada||o.created_at?.split("T")[0]||""}));
  });
  if(!pecas.length) return "";
  return `
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px">🔧 Peças usadas neste veículo</div>
      ${pecas.slice(0,6).map(p=>`
        <div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--border-sub);align-items:center">
          <span style="font-size:12px;flex:1;color:var(--text-primary)">${esc(p.desc)}</span>

// ── AUTO-REFRESH ──────────────────────────────────────────
let _autoRefreshTimer=null;
const AUTO_REFRESH_MS=60000; // 60 segundos

function startAutoRefresh(){
  stopAutoRefresh();
  _autoRefreshTimer=setInterval(async()=>{
    if(!SESSION||document.hidden) return; // pausa se aba não está visível
    if(!navigator.onLine) return;         // pausa se offline
    try{
      const safe=q=>q.catch(()=>[]);
      const[clis,veis,os,prods,lancs,itensPendentes]=await Promise.all([
        safe(sbGet("clientes","select=*&order=created_at.desc")),
        safe(sbGet("veiculos","select=*")),
        safe(sbGet("ordens_servico",osFetchQuery())),
        safe(sbGet("produtos","select=*&order=nome")),
        safe(sbGet("lancamentos",lancFetchQuery())),
        safe(sbGet("os_itens","aguardando_preco=eq.true&select=*")),
      ]);
      DATA.clientes=clis.map(c=>({...c,veiculos:veis.filter(v=>v.cliente_id===c.id)}));
      DATA.veiculos=veis;DATA.os=os;DATA.produtos=prods;DATA.lancamentos=lancs;
      DATA.itensPendentes=itensPendentes;
      saveDataCache();
      updateAppBadge();
      // re-renderiza só se não há modal aberto e não está digitando
      const modalAberto=document.querySelector(".overlay");
      const digitando=document.activeElement?.tagName==="INPUT"||document.activeElement?.tagName==="TEXTAREA";
      if(!modalAberto&&!digitando) render();
    }catch{}
  },AUTO_REFRESH_MS);
}

function stopAutoRefresh(){
  clearInterval(_autoRefreshTimer);
  _autoRefreshTimer=null;
}

// pausa quando aba perde foco, retoma quando volta
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) stopAutoRefresh();
  else if(SESSION) startAutoRefresh();
});

body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f0f0f0;font-family:Arial,sans-serif}
.etiqueta{
  width:85mm;background:#fff;border-radius:10px;
  border:2px solid #161616;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
}
.etq-topo{background:linear-gradient(135deg,#ff2b2b,#8a0d0d);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.etq-loja{font-size:15px;font-weight:900;letter-spacing:1px;line-height:1.1}
.etq-loja-sub{font-size:8px;color:rgba(255,255,255,.75);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.etq-num{margin-left:auto;font-size:19px;font-weight:900;font-family:monospace;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:6px}
.etq-corpo{padding:12px 14px}
.etq-placa{
  font-size:28px;font-weight:900;font-family:monospace;
  text-align:center;letter-spacing:4px;color:#0f0f1a;
  background:#f8f8f8;border:2px solid #ddd;border-radius:6px;
  padding:8px;margin-bottom:10px;
}
.etq-defeito{background:#fff1f1;border:1.5px solid #f3b7b7;border-radius:7px;padding:8px 10px;margin-bottom:10px}
.etq-defeito-lbl{font-size:9px;font-weight:800;color:#b31313;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.etq-defeito-val{font-size:12px;font-weight:700;color:#1a1a1a;line-height:1.4}
.etq-linha{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:11px}
.etq-linha:last-child{border:none}
.etq-k{color:#666;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:10px}
.etq-v{font-weight:700;color:#111;font-size:12px}
.etq-rodape{background:#f8f8f8;padding:8px 14px;font-size:10px;color:#888;text-align:center;border-top:1px solid #eee}
.btn-print{display:block;margin:16px auto;padding:10px 24px;background:${cor};color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
@media print{
  body{background:#fff;min-height:auto}
  .btn-print{display:none}
  .etiqueta{box-shadow:none;border-radius:0}
  @page{size:85mm 120mm;margin:0}
}

/* Bottom sheet para mover status */
.ks-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;animation:ksOverlayIn .2s var(--ease)}
@keyframes ksOverlayIn{from{opacity:0}to{opacity:1}}
.ks-sheet{
  width:100%;max-width:500px;margin:0 auto;
  background:var(--bg-surface);border-radius:20px 20px 0 0;
  padding:12px 16px 32px;
  animation:ksSheetIn .25s var(--ease-bounce);
}
@keyframes ksSheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ks-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.ks-title{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:4px}
.ks-sub{font-size:11px;color:var(--text-muted);margin-bottom:14px}
.ks-btn{
  width:100%;padding:13px 16px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-elevated);
  display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:700;cursor:pointer;
  margin-bottom:8px;transition:all var(--t-fast) var(--ease);
  font-family:var(--font-body);text-align:left;
}
.ks-btn:active{transform:scale(.98);background:var(--accent-tint)}
.ks-btn-icon{font-size:20px;flex-shrink:0}
.ks-btn-label{flex:1}
.ks-btn-arrow{color:var(--text-muted);font-size:14px}
.ks-cancel{
  width:100%;padding:13px;border:none;background:transparent;
  color:var(--text-muted);font-size:13px;font-weight:700;
  cursor:pointer;font-family:var(--font-body);margin-top:4px;border-radius:var(--radius-sm);
}
.ks-cancel:active{background:var(--bg-elevated)}

/* ═══════════════════════════════════════════════════════════════ */
</style></head><body>
<div>
<div class="etiqueta">
  <div class="etq-topo">
    ${maxxShieldSvg(34)}
    <div>
      <div class="etq-loja">${esc(nomeLoja)}</div>
      <div class="etq-loja-sub">Ordem de Serviço</div>
    </div>
    <div class="etq-num">${numOS(o.numero)}</div>
  </div>
  <div class="etq-corpo">
    <div class="etq-placa">${esc(placa)||"S/P"}</div>
    <div class="etq-defeito">
      <div class="etq-defeito-lbl">⚠️ Defeito apresentado</div>
      <div class="etq-defeito-val">${esc(o.descricao||"—")}</div>
    </div>
    <div class="etq-linha"><span class="etq-k">Cliente</span><span class="etq-v">${esc(cli?.nome||"—")}</span></div>
    <div class="etq-linha"><span class="etq-k">Veículo</span><span class="etq-v">${esc(vei?.modelo||specs.modelo||"—")}</span></div>
    <div class="etq-linha"><span class="etq-k">Entrada</span><span class="etq-v">${o.data_entrada||o.created_at?.split("T")[0]||"—"}</span></div>
    ${o.km_entrada?`<div class="etq-linha"><span class="etq-k">KM</span><span class="etq-v">${Number(o.km_entrada).toLocaleString("pt-BR")}</span></div>`:""}
    <div class="etq-linha"><span class="etq-k">Status</span><span class="etq-v">${(STATUS[o.status]||STATUS.recebido).icon} ${(STATUS[o.status]||STATUS.recebido).label}</span></div>
  </div>
  <div class="etq-rodape">📍 ${esc(cfg.end||nomeLoja)} ${cfg.tel?"· "+esc(cfg.tel):""}</div>
</div>
<button class="btn-print" onclick="window.print()">🖨️ Imprimir etiqueta</button>
</div>
</body></html>`);
  win.document.close();
}

function salvarConfiguracoes(){
  const campos=['nome','sub','cnpj','tel','email','end','cor'];
  const checkboxes=['show_km','show_motor','show_dtc','show_prioridade','show_setor','show_hist','show_assin','show_obs'];
  const cfg={};
  campos.forEach(id=>{const el=document.getElementById('cfg-'+id);if(el) cfg[id]=el.value.trim();});
  checkboxes.forEach(id=>{const el=document.getElementById(id);if(el) cfg[id]=el.checked;});
  localStorage.setItem('maxx_cfg',JSON.stringify(cfg));
  showToast('✅ Configurações salvas!');
}

function abrirPreviewImpressao(){
  const os=DATA.os[0];
  if(!os){showToast('Nenhuma OS disponível para preview.','erro');return;}
  printOS(os.id);
}

async function exportarBackup(){
  showToast('⏳ Preparando backup...');
  try{
    // busca histórico completo de OS pro backup, não só o filtro ativo do dia a dia
    const [os,clientes,veiculos,produtos,lancamentos]=await Promise.all([
      sbGet("ordens_servico","select=*&order=numero.desc").catch(()=>DATA.os),
      sbGet("clientes","select=*").catch(()=>DATA.clientes),
      sbGet("veiculos","select=*").catch(()=>DATA.veiculos),
      sbGet("produtos","select=*").catch(()=>DATA.produtos),
      sbGet("lancamentos","select=*").catch(()=>DATA.lancamentos),
    ]);
    const dados={geradoEm:nowStr(),os,clientes,veiculos,produtos,lancamentos};
    const blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='maxx-diesel-backup-'+today()+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('📥 Backup exportado!');
  }catch(e){
    showToast('Erro ao gerar backup: '+e.message,'error');
  }
}
