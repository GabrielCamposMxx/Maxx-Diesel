<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#9b1c1c"/>
<title>MAXX DIESEL</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{
  --acc:#9b1c1c; --acc2:#b91c1c; --acc-tint:rgba(155,28,28,.08);
  --bg:#f0f2f5; --card:#fff; --border:#e2e6ed; --border2:#f3f4f6;
  --t1:#111827; --t2:#6b7280; --t3:#9ca3af;
  --ok:#16a34a; --warn:#d97706; --err:#dc2626; --info:#2563eb;
  --r:16px; --font:'Barlow',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --bounce:cubic-bezier(0.34,1.56,0.64,1);
  --shadow:0 2px 10px rgba(0,0,0,.07);
}
body{font-family:var(--font);background:var(--bg);color:var(--t1);min-height:100dvh}

/* ── LOGIN ── */
#tela-login{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
.lbox{background:#fff;border-radius:22px;padding:36px 28px;width:100%;max-width:340px;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.llogo{text-align:center;margin-bottom:28px}
.llogo-title{font-size:26px;font-weight:900;color:var(--acc);letter-spacing:1px}
.llogo-sub{font-size:12px;color:var(--t3);margin-top:3px}
.lcampo{margin-bottom:14px}
.lcampo label{display:block;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.linput{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-family:var(--font);outline:none;transition:all .15s;color:var(--t1)}
.linput:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(155,28,28,.1)}
.lbtn{width:100%;padding:14px;background:var(--acc);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:var(--font);cursor:pointer;margin-top:6px;transition:all .18s var(--bounce);box-shadow:0 4px 14px rgba(155,28,28,.35)}
.lbtn:hover{background:var(--acc2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(155,28,28,.4)}
.lbtn:active{transform:scale(.97)}
.lbtn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
#login-err{text-align:center;font-size:13px;margin-top:10px;min-height:20px;color:var(--err);font-weight:600}

/* ── APP ── */
#app{display:none;min-height:100dvh}
#topbar{position:sticky;top:0;z-index:100;background:var(--acc);height:56px;display:flex;align-items:center;padding:0 14px;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 4px 16px rgba(155,28,28,.2)}
#menu-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;font-size:18px;padding:5px 8px;cursor:pointer;line-height:1}
#topbar-title{color:#fff;font-size:15px;font-weight:700;flex:1;letter-spacing:.3px}
#sync-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.tb-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;font-size:13px;font-weight:700;padding:6px 10px;cursor:pointer;font-family:var(--font)}
#nova-os-fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 18px rgba(155,28,28,.5);z-index:150;display:flex;align-items:center;justify-content:center;transition:all .2s var(--bounce)}
#nova-os-fab:active{transform:scale(.88)}

/* ── SIDEBAR ── */
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;backdrop-filter:blur(4px)}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:#fff;z-index:201;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.15)}
#sidebar.open{transform:translateX(0)}
.sb-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-logo-text{font-size:16px;font-weight:900;color:var(--acc)}
.sb-user{font-size:11px;color:var(--t2);margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.sb-group{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:12px 8px 4px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;border-radius:10px;background:none;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;text-align:left;font-family:var(--font);transition:all .15s var(--bounce);margin-bottom:2px}
.sb-item:hover{background:var(--bg);color:var(--t1);transform:translateX(2px)}
.sb-item.ativo{background:var(--acc-tint);color:var(--acc);font-weight:700}
.sb-item span:first-child{font-size:16px;width:22px;text-align:center}
.sb-footer{padding:12px 8px;border-top:1px solid var(--border)}
#btn-sair{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;border-radius:10px;background:none;color:var(--err);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font)}

/* ── CONTEÚDO ── */
#conteudo{padding:14px 14px calc(80px + env(safe-area-inset-bottom))}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card-titulo{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--r);border:1px solid var(--border);border-top:3px solid;padding:14px;box-shadow:var(--shadow);transition:transform .18s var(--bounce)}
.stat:active{transform:scale(.97)}
.stat-val{font-size:28px;font-weight:900;line-height:1;font-family:var(--mono)}
.stat-lbl{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.stat-sub{font-size:10px;color:var(--t3);margin-top:2px}

/* ── OS CARD ── */
.os-card{background:var(--card);border-radius:18px;border:1px solid var(--border);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s var(--bounce)}
.os-card:active{transform:scale(.99)}
.os-foto{width:100%;height:110px;background:linear-gradient(145deg,#1a1f2e,#2d3548);position:relative;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.os-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.os-badge-num{position:absolute;top:8px;left:10px;background:rgba(0,0,0,.6);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;backdrop-filter:blur(4px)}
.os-placa-box{position:absolute;top:8px;right:10px;background:#fff;border:2px solid #1a1a2e;border-radius:6px;padding:2px 8px;text-align:center}
.os-placa-top{background:#1d3a8a;color:#fff;font-size:6px;font-weight:900;letter-spacing:.8px;border-radius:3px 3px 0 0;margin:-2px -8px 2px;padding:1.5px}
.os-placa-num{font-family:var(--mono);font-size:12px;font-weight:900;color:#0f0f1a;letter-spacing:1px}
.os-urgente{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to right,#dc2626,#ef4444);color:#fff;font-size:10px;font-weight:800;padding:3px 10px;text-align:center}
.os-body{padding:11px 13px}
.os-nome{font-size:14px;font-weight:700;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.os-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;border:1px solid}
.os-desc{font-size:12px;color:var(--t2);line-height:1.4;margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.os-footer{display:flex;align-items:center;gap:6px;padding-top:8px;border-top:1px solid var(--border2);flex-wrap:wrap}
.next-btn{padding:5px 11px;border-radius:9px;border:1.5px solid;font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s var(--bounce);min-height:30px}
.next-btn:active{transform:scale(.95)}

/* ── PILLS ── */
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--t2);white-space:nowrap;cursor:pointer;transition:all .15s var(--bounce);flex-shrink:0;min-height:32px;display:inline-flex;align-items:center;gap:4px}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 3px 10px rgba(155,28,28,.3)}
.pill:active{transform:scale(.95)}

/* ── MODAL / SHEET ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:540px;max-height:92dvh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:sobir .25s var(--bounce)}
@keyframes sobir{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:14px auto 10px}
.sheet-titulo{font-size:17px;font-weight:700;padding:0 20px 14px;border-bottom:1px solid var(--border2);margin-bottom:14px}
.sheet-corpo{padding:0 20px}

/* ── FORM ── */
.flabel{display:block;font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;margin-top:14px}
.flabel:first-child{margin-top:0}
.finput{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:var(--font);outline:none;transition:all .15s;color:var(--t1);background:#fff}
.finput:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(155,28,28,.09)}
textarea.finput{resize:none}
select.finput{cursor:pointer}
.btn-p{width:100%;padding:14px;background:var(--acc);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;box-shadow:0 4px 14px rgba(155,28,28,.35);transition:all .18s var(--bounce);margin-top:16px}
.btn-p:active{transform:scale(.97)}
.btn-p:disabled{opacity:.6;cursor:not-allowed}
.btn-s{width:100%;padding:12px;background:#f8f9fb;color:var(--t2);border:1px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer;margin-top:8px}

/* ── TIPO / SETOR ── */
.tipo-grid{display:flex;gap:6px;margin-top:4px}
.tipo-btn{flex:1;padding:9px 4px;border:1.5px solid var(--border);border-radius:12px;background:#f8f9fb;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--t2);transition:all .18s var(--bounce)}
.tipo-btn span{font-size:18px}
.tipo-btn.on{border-color:var(--acc);background:var(--acc-tint);color:var(--acc);transform:scale(1.04)}
.setor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.setor-btn{padding:9px 6px;border:2px solid;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:700;transition:all .18s var(--bounce)}
.setor-btn span{font-size:18px}

/* ── FOTOS CHECKIN ── */
.foto-area{width:100%;height:120px;border:2px dashed var(--border);border-radius:14px;background:#f8f9fb;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:border-color .2s}
.foto-area.ok{border-color:var(--ok);border-style:solid}
.foto-area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foto-thumb{width:68px;height:68px;border-radius:11px;border:1px solid var(--border);overflow:hidden;position:relative;flex-shrink:0}
.foto-thumb img{width:100%;height:100%;object-fit:cover}
.foto-thumb-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);border:none;color:#fff;width:18px;height:18px;border-radius:50%;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ci-btns{display:flex;gap:6px;margin-top:7px}
.ci-btn{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:11px;font-weight:700;color:var(--t2);cursor:pointer;text-align:center;transition:all .15s}
.ci-btn.red{background:rgba(155,28,28,.07);border-color:rgba(155,28,28,.25);color:var(--acc)}

/* ── LISTA COMPACTA ── */
.os-row{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--card);border:1px solid var(--border);border-left:3px solid;border-radius:12px;margin-bottom:7px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.os-row:active{transform:scale(.99)}
.os-row-foto{width:44px;height:44px;border-radius:9px;background:linear-gradient(135deg,#1a1f2e,#2d3548);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.os-row-foto img{width:100%;height:100%;object-fit:cover}
.os-row-info{flex:1;min-width:0}
.os-row-nome{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.os-row-sub{font-size:11px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}

/* ── BOTTOM NAV ── */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(64px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-around;padding:8px 0 0;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.bn-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--t3);font-size:9px;font-weight:700;cursor:pointer;padding:4px 12px;font-family:var(--font);transition:color .15s;min-width:56px}
.bn-btn.on{color:var(--acc)}
.bn-btn span:first-child{font-size:20px}

/* ── SPINNER ── */
#spinner{display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:10px;color:var(--t2);font-size:13px}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:girar .7s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

/* ── TOAST ── */
#toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:13px 16px;border-radius:13px;font-size:13px;font-weight:600;z-index:9999;display:none;align-items:center;gap:9px;box-shadow:0 4px 20px rgba(0,0,0,.2);animation:fadeup .2s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── VAZIO ── */
.vazio{text-align:center;padding:48px 20px;color:var(--t3)}
.vazio-icon{font-size:44px;margin-bottom:12px}
.vazio-titulo{font-size:15px;font-weight:700;color:var(--t2);margin-bottom:6px}
.vazio-sub{font-size:13px}

/* ── DETALHES ── */
.detalhe-info{background:#f8f9fb;border-radius:14px;padding:12px 14px;border:1px solid var(--border);margin-bottom:14px}
.info-linha{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--border2)}
.info-linha:last-child{border:none}
.info-chave{font-size:11px;color:var(--t2);min-width:72px;flex-shrink:0;font-weight:600;padding-top:1px}
.info-valor{font-size:13px;color:var(--t1);flex:1;word-break:break-word}
.status-acao{width:100%;padding:12px 14px;border-radius:13px;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:var(--font);transition:all .15s var(--bounce)}
.status-acao:active{transform:scale(.97)}

/* ── RESPONSIVO ── */
@media(min-width:600px){
  #conteudo{max-width:600px;margin:0 auto}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="tela-login">
  <div class="lbox">
    <div class="llogo">
      <div class="llogo-title">MAXX DIESEL</div>
      <div class="llogo-sub">Sistema de Gestão de Oficina</div>
    </div>
    <div class="lcampo">
      <label>Usuário</label>
      <input class="linput" id="inp-user" placeholder="admin" autocorrect="off" autocapitalize="none" autocomplete="username"/>
    </div>
    <div class="lcampo">
      <label>Senha</label>
      <input class="linput" id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="lbtn" id="btn-entrar">Entrar</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- TOPBAR -->
  <div id="topbar">
    <button id="menu-btn" onclick="abrirSidebar()">☰</button>
    <div id="topbar-title">MAXX DIESEL</div>
    <div id="sync-dot"></div>
    <button class="tb-btn" onclick="abrirNovaOS()">＋ OS</button>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar-overlay" onclick="fecharSidebar()"></div>
  <div id="sidebar">
    <div class="sb-logo">
      <div>
        <div class="sb-logo-text">MAXX DIESEL</div>
        <div class="sb-user" id="sb-user-nome">Usuário</div>
      </div>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-footer">
      <button id="btn-sair" class="sb-item" style="color:var(--err)">
        <span>🚪</span><span>Sair</span>
      </button>
    </div>
  </div>

  <!-- SPINNER -->
  <div id="spinner" style="display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:12px;color:var(--t2)">
    <div class="spin"></div>
    <div style="font-size:13px">Carregando...</div>
  </div>

  <!-- CONTEÚDO -->
  <div id="conteudo"></div>

  <!-- FAB -->
  <button id="nova-os-fab" onclick="abrirNovaOS()">＋</button>

  <!-- BOTTOM NAV -->
  <nav id="bottom-nav">
    <button class="bn-btn on" id="bn-dash" onclick="irPara('dashboard')"><span>📊</span>Dashboard</button>
    <button class="bn-btn" id="bn-os" onclick="irPara('os')"><span>📋</span>OS</button>
    <button class="bn-btn" id="bn-clis" onclick="irPara('clientes')"><span>👥</span>Clientes</button>
    <button class="bn-btn" id="bn-fin" onclick="irPara('financeiro')"><span>💰</span>Financeiro</button>
    <button class="bn-btn" id="bn-mais" onclick="abrirMais()"><span>⋯</span>Mais</button>
  </nav>
</div>

<!-- MODALS -->
<div id="modal-root"></div>
<div id="toast"></div>

<script>

const H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};

async function sbGet(tabela,query){
  try{
    const r=await fetch(SB_URL+"/rest/v1/"+tabela+"?"+(query||""),{headers:H});
    if(!r.ok)return[];
    return await r.json();
  }catch{return[];}
}

async function sbPost(tabela,corpo){
  setSyncStatus("saving");
  try{
    const r=await fetch(SB_URL+"/rest/v1/"+tabela,{method:"POST",headers:{...H,Prefer:"return=representation"},body:JSON.stringify(corpo)});
    if(!r.ok){const t=await r.text();throw new Error(t);}
    setSyncStatus("ok");
    return await r.json();
  }catch(e){setSyncStatus("erro");throw e;}
}

async function sbPatch(tabela,query,corpo){
  setSyncStatus("saving");
  try{
    const r=await fetch(SB_URL+"/rest/v1/"+tabela+"?"+query,{method:"PATCH",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify(corpo)});
    if(!r.ok){const t=await r.text();throw new Error(t);}
    setSyncStatus("ok");
  }catch(e){setSyncStatus("erro");throw e;}
}

async function sbDelete(tabela,query){
  const r=await fetch(SB_URL+"/rest/v1/"+tabela+"?"+query,{method:"DELETE",headers:{...H,Prefer:"return=minimal"}});
  if(!r.ok){const t=await r.text();throw new Error(t);}
}

async function fazerLogin(){
  const u=(document.getElementById("inp-user").value||"").trim().toLowerCase();
  const p=document.getElementById("inp-pass").value||"";
  const err=document.getElementById("login-err");
  const btn=document.getElementById("btn-entrar");
  err.textContent="";
  if(!u||!p){err.textContent="Preencha usuário e senha.";return;}

  // bootstrap sempre funciona
  if(u==="admin"&&p==="maxx2024"){
    SESSION={nome:"Administrador",role:"admin",user:"admin",id:null};
    salvarSessao(SESSION);
    abrirApp();
    return;
  }

  btn.disabled=true;btn.textContent="Verificando...";
  try{
    const rows=await sbGet("usuarios","username=eq."+encodeURIComponent(u)+"&select=*&limit=1");
    if(!rows||!rows.length){err.textContent="Usuário não encontrado.";btn.disabled=false;btn.textContent="Entrar";return;}
    const row=rows[0];
    if(row.ativo===false){err.textContent="Usuário inativo.";btn.disabled=false;btn.textContent="Entrar";return;}
    let ok=(row.senha===p);
    if(!ok){
      try{
        const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p));
        const h=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
        ok=(row.senha===h);
      }catch{}
    }
    if(!ok){err.textContent="Senha incorreta.";btn.disabled=false;btn.textContent="Entrar";return;}
    SESSION={id:row.id,nome:row.nome,role:row.role||"mecanico",user:row.username};
    salvarSessao(SESSION);
    sbPatch("usuarios","id=eq."+row.id,{ultimo_acesso:new Date().toISOString()}).catch(()=>{});
  }catch(e){
    err.textContent="Erro de conexão. Tente novamente.";
    btn.disabled=false;btn.textContent="Entrar";
    return;
  }
  btn.disabled=false;btn.textContent="Entrar";
  abrirApp();
}

function abrirApp(){
  document.getElementById("tela-login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("sb-user-nome").textContent=SESSION.nome+" · "+({admin:"Admin",recepcao:"Recepção",mecanico:"Mecânico"}[SESSION.role]||SESSION.role);
  document.getElementById("btn-sair").addEventListener("click",sair,{once:true});
  construirNav();
  carregarDados();
  startRefresh();
}

function sair(){
  SESSION=null;stopRefresh();
  try{localStorage.removeItem("maxx_s2");}catch{}
  document.getElementById("app").style.display="none";
  document.getElementById("tela-login").style.display="flex";
  document.getElementById("inp-pass").value="";
  document.getElementById("login-err").textContent="";
  document.getElementById("btn-entrar").disabled=false;
  document.getElementById("btn-entrar").textContent="Entrar";
}

async function carregarDados(){
  const spin=document.getElementById("spinner");
  const cont=document.getElementById("conteudo");
  spin.style.display="flex";cont.style.display="none";
  // tenta cache primeiro
  try{
    const c=localStorage.getItem("maxx_cache");
    if(c){
      const snap=JSON.parse(c);
      DADOS.os=snap.os||[];DADOS.clientes=snap.clientes||[];
      DADOS.veiculos=snap.veiculos||[];DADOS.produtos=snap.produtos||[];
      DADOS.lancamentos=snap.lancamentos||[];
      spin.style.display="none";cont.style.display="block";
      renderizar();
    }
  }catch{}
  // busca dados frescos
  try{
    const [os,clis,veis,prods,lancs]=await Promise.all([
      sbGet("ordens_servico","select=*&order=numero.desc"),
      sbGet("clientes","select=*&order=nome"),
      sbGet("veiculos","select=*"),
      sbGet("produtos","select=*&order=nome"),
      sbGet("lancamentos","select=*&order=created_at.desc&limit=200"),
    ]);
    DADOS.os=Array.isArray(os)?os:[];
    DADOS.clientes=Array.isArray(clis)?clis:[];
    DADOS.veiculos=Array.isArray(veis)?veis:[];
    DADOS.produtos=Array.isArray(prods)?prods:[];
    DADOS.lancamentos=Array.isArray(lancs)?lancs:[];
    try{localStorage.setItem("maxx_cache",JSON.stringify(DADOS));}catch{}
  }catch{}
  spin.style.display="none";cont.style.display="block";
  renderizar();
}

function startRefresh(){
  stopRefresh();
  _refreshTimer=setInterval(async()=>{
    if(!SESSION||document.hidden||!navigator.onLine)return;
    try{
      const [os,clis]=await Promise.all([
        sbGet("ordens_servico","select=*&order=numero.desc"),
        sbGet("clientes","select=*&order=nome"),
      ]);
      if(Array.isArray(os)) DADOS.os=os;
      if(Array.isArray(clis)) DADOS.clientes=clis;
      const aberto=!document.querySelector(".overlay");
      const digitando=["INPUT","TEXTAREA"].includes(document.activeElement?.tagName);
      if(aberto&&!digitando)renderizar();
    }catch{}
  },60000);
}
function stopRefresh(){clearInterval(_refreshTimer);}
document.addEventListener("visibilitychange",()=>document.hidden?stopRefresh():SESSION&&startRefresh());
window.addEventListener("online",()=>setSyncStatus("ok"));
window.addEventListener("offline",()=>setSyncStatus("erro"));

  if(!el)return;
  try{
    if(PAGINA==="dashboard") renderDashboard(el);
    else if(PAGINA==="os") renderOS(el);
    else if(PAGINA==="clientes") renderClientes(el);
    else if(PAGINA==="financeiro") renderFinanceiro(el);
    else if(PAGINA==="estoque") renderEstoque(el);
    else if(PAGINA==="mural") renderMural(el);
    else el.innerHTML='<div class="vazio"><div class="vazio-icon">🚧</div><div class="vazio-titulo">Em breve</div><div class="vazio-sub">Este módulo está em desenvolvimento</div></div>';

function osRowHTML(o){
  const cli=DADOS.clientes.find(c=>c.id===o.cliente_id);
  const set=SETORES.find(s=>s.id===o.setor_id);
  const st=STATUS[o.status]||STATUS.recebido;
  const next=FLOW[o.status]?.[0];
  const stNext=next?STATUS[next]:null;
  const specs=o.especificacoes||{};
  const placa=(DADOS.veiculos.find(v=>v.id===o.veiculo_id)?.placa)||specs.placa||"";
  const fotos=Array.isArray(o.fotos)?o.fotos:[];
  const dias=o.created_at?Math.floor((Date.now()-new Date(o.created_at))/86400000):0;
  const isOld=dias>=3&&!["finalizado","entregue"].includes(o.status);
  const tipoIcon={veiculo:"🚗",pecas:"📦",bico:"💉",bomba:"⚙️",kit:"🔩"}[o.tipo_servico||"veiculo"]||"🔧";

  return '<div class="os-row" style="border-left-color:'+st.cor+'" onclick="abrirDetalheOS(\''+o.id+'\')">'+ 
    '<div class="os-row-foto">'+(fotos[0]?'<img src="'+(fotos[0].url||fotos[0])+'" alt="foto" loading="lazy"/>':tipoIcon)+'</div>'+
    '<div class="os-row-info">'+
      '<div class="os-row-nome">'+
        (o.prioridade==="urgente"?'<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#dc2626;margin-right:5px;flex-shrink:0"></span>':"")+
        esc(cli?.nome||"Sem cliente")+
        (placa?' <span style="font-family:var(--mono);font-size:10px;background:#f1f5f9;padding:1px 5px;border-radius:3px">'+esc(placa)+'</span>':"")+
      '</div>'+
      '<div style="display:flex;gap:5px;margin-top:3px;flex-wrap:wrap">'+
        '<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:'+st.cor+'15;color:'+st.cor+';border:1px solid '+st.cor+'25">'+st.icon+' '+st.label+'</span>'+
        (set?'<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;background:'+set.cor+'12;color:'+set.cor+'">'+set.icon+' '+set.nome+'</span>':"")+
        (isOld?'<span style="font-size:9px;color:var(--err);font-weight:700">⚠️ '+dias+'d</span>':"")+
        (o.status==="retorno"?'<span style="font-size:9px;font-weight:700;color:#9b1c1c">🔄 Retorno</span>':"")+

function renderOS(el){
  const busca=(el.querySelector("#os-busca")||{value:""}).value?.toLowerCase()||"";
  let lista=DADOS.os.filter(o=>o.status!=="entregue");
  if(_filtroStatus) lista=lista.filter(o=>o.status===_filtroStatus);
  if(_filtroTipo==="retorno") lista=lista.filter(o=>o.status==="retorno");
  else if(_filtroTipo) lista=lista.filter(o=>(o.tipo_servico||"veiculo")===_filtroTipo);
  if(busca){
    lista=lista.filter(o=>{
      const cli=DADOS.clientes.find(c=>c.id===o.cliente_id);
      const vei=DADOS.veiculos.find(v=>v.id===o.veiculo_id);
      const sp=o.especificacoes||{};
      return (numOS(o.numero)+" "+(cli?.nome||"")+" "+(vei?.placa||"")+" "+(sp.placa||"")+" "+(o.descricao||"")+" "+(o.cod_falha||"")).toLowerCase().includes(busca);
    });
  }
  lista.sort((a,b)=>{
    const ua=a.prioridade==="urgente"?0:1;
    const ub=b.prioridade==="urgente"?0:1;
    if(ua!==ub)return ua-ub;
    return new Date(b.created_at||0)-new Date(a.created_at||0);
  });

  const tiposPills=[
    {f:"",label:"Todas",cnt:DADOS.os.filter(o=>o.status!=="entregue").length},
    {f:"veiculo",label:"🚗 Carros",cnt:DADOS.os.filter(o=>(!o.tipo_servico||o.tipo_servico==="veiculo")).length},
    {f:"pecas",label:"📦 Peças",cnt:DADOS.os.filter(o=>o.tipo_servico==="pecas").length},
    {f:"bico",label:"💉 Bico",cnt:DADOS.os.filter(o=>o.tipo_servico==="bico").length},
    {f:"bomba",label:"⚙️ Bomba",cnt:DADOS.os.filter(o=>o.tipo_servico==="bomba").length},
    {f:"kit",label:"🔩 Kit",cnt:DADOS.os.filter(o=>o.tipo_servico==="kit").length},
    {f:"retorno",label:"🔄 Retorno",cnt:DADOS.os.filter(o=>o.status==="retorno").length},
  ].filter(p=>p.f===""||p.cnt>0);

  const statusPills=Object.entries(STATUS).map(([k,s])=>{
    const cnt=DADOS.os.filter(o=>o.status===k).length;
    return cnt?{f:k,label:s.icon+" "+s.label,cnt}:null;
  }).filter(Boolean);

  el.innerHTML=
    '<div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">'+
      '<div style="position:relative;flex:1">'+
        '<span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none">🔍</span>'+
        '<input id="os-busca" placeholder="Cliente, placa, DTC..." style="width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:var(--font);outline:none" oninput="renderOS(document.getElementById(\'conteudo\'))" value="'+esc(busca)+'"/>'+
      '</div>'+
      '<button onclick="_osViewMode=_osViewMode===\'cards\'?\'lista\':\'cards\';renderOS(document.getElementById(\'conteudo\'))" style="padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:16px;cursor:pointer;min-width:40px;min-height:40px">'+(_osViewMode==="cards"?"☰":"⊞")+'</button>'+
    '</div>'+
    '<div class="pills">'+tiposPills.map(p=>'<div class="pill'+(_filtroTipo===p.f?" on":"")+'" onclick="_filtroTipo=\''+p.f+'\';renderOS(document.getElementById(\'conteudo\'))">'+esc(p.label)+' <span style="opacity:.7;font-size:9px">'+p.cnt+'</span></div>').join("")+'</div>'+
    '<div class="pills">'+
      '<div class="pill'+((!_filtroStatus)?" on":"")+'" onclick="_filtroStatus=\'\';renderOS(document.getElementById(\'conteudo\'))">Todos</div>'+
      statusPills.map(p=>'<div class="pill"+(_filtroStatus===p.f?" on":"")+'" onclick="_filtroStatus=\''+p.f+'\';renderOS(document.getElementById(\'conteudo\'))">'+esc(p.label)+'</div>').join("")+
    '</div>'+
    '<div style="font-size:11px;color:var(--t3);margin-bottom:10px">'+lista.length+' OS</div>'+
    (lista.length?lista.map(o=>_osViewMode==="cards"?osCardHTML(o):osRowHTML(o)).join(""):
      '<div class="vazio"><div class="vazio-icon">📋</div><div class="vazio-titulo">Nenhuma OS</div><div class="vazio-sub">'+
        (busca?"Busca: \""+esc(busca)+"\"":_filtroStatus||_filtroTipo?"Tente outro filtro":"Toque em + para criar a primeira OS")+
      '</div></div>');
}

async function avancarStatus(id,novoStatus){
  haptic(20);
  const o=DADOS.os.find(x=>x.id===id);if(!o)return;
  const hist=(Array.isArray(o.historico)?o.historico:[]).concat([{data:agora(),acao:"→ "+(STATUS[novoStatus]?.label||novoStatus),user:SESSION?.nome||"—"}]);
  try{
    await sbPatch("ordens_servico","id=eq."+id,{status:novoStatus,historico:hist});
    o.status=novoStatus;o.historico=hist;
    toast((STATUS[novoStatus]?.icon||"✅")+" "+( STATUS[novoStatus]?.label||novoStatus));
    renderizar();
  }catch(e){toast("Erro: "+e.message,"erro");}
}

async function confirmarExcluirOS(id){
  const o=DADOS.os.find(x=>x.id===id);if(!o)return;
  const cli=DADOS.clientes.find(c=>c.id===o.cliente_id);
  if(!confirm("Excluir "+numOS(o.numero)+" — "+( cli?.nome||"Sem cliente")+"?\nEsta ação não pode ser desfeita."))return;
  try{
    await sbDelete("os_itens","os_id=eq."+id).catch(()=>{});
    await sbDelete("lancamentos","os_id=eq."+id).catch(()=>{});
    await sbDelete("ordens_servico","id=eq."+id);
    DADOS.os=DADOS.os.filter(x=>x.id!==id);
    toast("OS excluída.");fecharModal();renderizar();
  }catch(e){toast("Erro: "+e.message,"erro");}
}

function addFotoNovOS(input){
  const files=Array.from(input.files||[]);
  if(!files.length)return;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas");
        const max=600,r=Math.min(max/img.width,max/img.height,1);
        c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        const data=c.toDataURL("image/jpeg",.72);
        novaOSFotos.push({url:data,tag:"Check-in",data:agora()});
        renderFotosNovOS();
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
  input.value="";
}

function renderFotosNovOS(){
  const grid=document.getElementById("nos-foto-grid");
  const ph=document.getElementById("nos-foto-ph");
  const area=document.getElementById("nos-foto-area");
  if(!grid)return;
  // thumbs
  grid.innerHTML=novaOSFotos.map((f,i)=>
    '<div class="foto-thumb">'+
      '<img src="'+f.url+'" loading="lazy"/>'+
      '<button class="foto-thumb-del" onclick="remFotoNovOS('+i+')">✕</button>'+
    '</div>'
  ).join("");
  if(ph) ph.style.display=novaOSFotos.length?"none":"flex";
  if(area){
    area.style.borderColor=novaOSFotos.length?"#16a34a":"var(--border)";

function buscarCliNovOS(q){
  const dd=document.getElementById("nos-cli-dd");
  if(!dd)return;
  if(!q||q.length<2){dd.style.display="none";return;}
  const res=DADOS.clientes.filter(c=>c.nome.toLowerCase().includes(q.toLowerCase())).slice(0,7);
  if(!res.length){dd.style.display="none";return;}
  dd.innerHTML=res.map(c=>'<div onclick="selCliNovOS(\''+c.id+'\',\''+esc(c.nome)+'\')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border2);font-size:13px;font-weight:600">'+esc(c.nome)+(c.telefone?'<div style="font-size:11px;color:var(--t2)">'+c.telefone+'</div>':"")+' </div>').join("");
  dd.style.display="block";

function selCliNovOS(id,nome){
  document.getElementById("nos-cli-id").value=id;
  document.getElementById("nos-cli-inp").value=nome;
  const dd=document.getElementById("nos-cli-dd");if(dd)dd.style.display="none";
}

function buscaPlacaNovOS(placa){
  const p=placa.replace(/[^A-Z0-9]/g,"");
  if(p.length<6)return;
  const vei=DADOS.veiculos.find(v=>(v.placa||"").replace(/[^A-Z0-9]/g,"")=== p);
  if(vei){
    const m=document.getElementById("nos-modelo");
    if(m&&vei.modelo) m.value=vei.modelo+(vei.ano?" "+vei.ano:"");
    const cli=DADOS.clientes.find(c=>c.id===vei.cliente_id);
    if(cli&&!document.getElementById("nos-cli-id").value) selCliNovOS(cli.id,cli.nome);
    toast("🚗 "+( vei.modelo||"Veículo")+" encontrado");
    return;
  }
  const match=DADOS.os.find(o=>((o.especificacoes||{}).placa||"").replace(/[^A-Z0-9]/g,"")=== p);
  if(match){
    const sp=match.especificacoes||{};
    const m=document.getElementById("nos-modelo");
    if(m&&sp.modelo) m.value=sp.modelo+(sp.ano?" "+sp.ano:"");
    const cli=DADOS.clientes.find(c=>c.id===match.cliente_id);
    if(cli&&!document.getElementById("nos-cli-id").value) selCliNovOS(cli.id,cli.nome);
    toast("🚗 "+cli?.nome+" (histórico)");
  }
}

async function salvarNovOS(){
  const desc=(document.getElementById("nos-desc")?.value||"").trim();
  if(!desc){toast("Descreva o problema ou serviço.","erro");return;}
  const btn=document.querySelector(".btn-p");
  if(btn){btn.disabled=true;btn.textContent="Salvando...";}
  const specs={};
  const placa=(document.getElementById("nos-placa")?.value||"").trim();
  const modelo=(document.getElementById("nos-modelo")?.value||"").trim();
  const km=document.getElementById("nos-km")?.value||"";
  if(placa) specs.placa=placa;
  if(modelo) specs.modelo=modelo;
  if(km) specs.km=km;
  try{
    await sbPost("ordens_servico",{
      cliente_id:document.getElementById("nos-cli-id")?.value||null,
      tipo_servico:document.getElementById("nos-tipo")?.value||"veiculo",
      setor_id:document.getElementById("nos-setor")?.value||null,

function renderFinanceiro(el){

      '</div>';
    }).join(""):
      '<div class="vazio"><div class="vazio-icon">📌</div><div class="vazio-titulo">Nenhuma mensagem</div><div class="vazio-sub">Seja o primeiro a escrever</div></div>');
}

function abrirNovaMural(){
  document.getElementById("modal-root").innerHTML=
    '<div class="overlay" onclick="fecharModal()"><div class="sheet" onclick="event.stopPropagation()">'+
    '<div class="sheet-handle"></div>'+
    '<div class="sheet-titulo">Nova mensagem</div>'+
    '<div class="sheet-corpo">'+
      '<label class="flabel">Categoria</label>'+
      '<div style="display:flex;gap:7px;flex-wrap:wrap" id="mural-cats">'+
        MURAL_CATS.map((c,i)=>'<button type="button" class="tipo-btn'+(i===0?" on":"")+'" data-cat="'+c.id+'" onclick="selCatMural(\''+c.id+'\')" style="flex-basis:calc(33% - 5px)"><span>'+c.icon+'</span>'+c.label+'</button>').join("")+
      '</div>'+
      '<input type="hidden" id="mural-cat" value="'+MURAL_CATS[0].id+'"/>'+
      '<label class="flabel">Mensagem *</label>'+
      '<textarea class="finput" id="mural-txt" rows="4" placeholder="Digite sua mensagem..." autofocus></textarea>'+
      '<button class="btn-p" onclick="salvarMural()">📌 Publicar</button>'+
      '<button class="btn-s" onclick="fecharModal()">Cancelar</button>'+
    '</div></div></div>';
  setTimeout(()=>document.getElementById("mural-txt")?.focus(),100);
}

function selCatMural(id){
  document.getElementById("mural-cat").value=id;
  document.querySelectorAll("#mural-cats .tipo-btn").forEach(b=>b.classList.toggle("on",b.dataset.cat===id));
}

async function salvarMural(){
  const txt=(document.getElementById("mural-txt")?.value||"").trim();
  const cat=document.getElementById("mural-cat")?.value||"geral";
  if(!txt){toast("Digite uma mensagem.","erro");return;}
  const btn=document.querySelector(".btn-p");if(btn){btn.disabled=true;btn.textContent="Publicando...";}
  try{
    await sbPost("mural",{texto:txt,categoria:cat,autor:SESSION?.nome||"—",autor_id:SESSION?.id||null,reacoes:{},resolvido:false});
    toast("✅ Publicado!");fecharModal();await loadMural();renderizar();
  }catch(e){
    toast("Erro: "+e.message,"erro");
    if(btn){btn.disabled=false;btn.textContent="📌 Publicar";}
  }
}

async function reagirMural(id,emoji){
  const m=MURAL.find(x=>x.id===id);if(!m)return;
  const r={...(m.reacoes||{})};r[emoji]=(r[emoji]||0)+1;
  try{await sbPatch("mural","id=eq."+id,{reacoes:r});m.reacoes=r;renderizar();}catch{}
}

async function resolverMural(id){
  try{await sbPatch("mural","id=eq."+id,{resolvido:true});const m=MURAL.find(x=>x.id===id);if(m)m.resolvido=true;toast("✅ Resolvido!");renderizar();}catch(e){toast("Erro","erro");}
}

async function excluirMural(id){
  if(!confirm("Excluir esta mensagem?"))return;
  try{await sbDelete("mural","id=eq."+id);MURAL=MURAL.filter(x=>x.id!==id);renderizar();}catch(e){toast("Erro","erro");}
}

// ══════════════════════════════════════════════════
// PULL TO REFRESH
// ══════════════════════════════════════════════════
let _sy=0,_ptr=false,_ptrEl=null;
document.addEventListener("touchstart",e=>{if(window.scrollY===0)_sy=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchmove",e=>{
  if(e.touches[0].clientY-_sy>55&&window.scrollY===0&&!_ptrEl){
    _ptr=true;_ptrEl=document.createElement("div");
    _ptrEl.style.cssText="position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);border-radius:50px;padding:6px 14px;font-size:11px;font-weight:700;color:var(--acc);z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.1)";
    _ptrEl.textContent="⟳ Solte para atualizar";
    document.body.appendChild(_ptrEl);
  }
},{passive:true});
document.addEventListener("touchend",()=>{
  if(_ptr){carregarDados();toast("Atualizando...");}
  if(_ptrEl){_ptrEl.remove();_ptrEl=null;}_ptr=false;
});

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
SESSION=carregarSessao();
if(SESSION){
  abrirApp();
} else {
  document.getElementById("tela-login").style.display="flex";
  document.getElementById("app").style.display="none";
}
</script>
